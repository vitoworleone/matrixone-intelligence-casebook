<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI product loop</title>
  <desc id="desc">A five-step product loop from enterprise documents to trustworthy AI delivery and feedback-driven iteration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b3d"/>
      <stop offset="100%" stop-color="#132f68"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="310" rx="24" fill="url(#background)"/>
  <text x="60" y="58" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ENTERPRISE AI PRODUCT LOOP</text>
  <text x="60" y="91" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">从企业数据到可信 AI 交付</text>
  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="60" y="142" width="180" height="102" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
    <text x="84" y="181" fill="#7dd3fc" font-size="13" font-weight="700">01 · AI-READY DATA</text>
    <text x="84" y="213" fill="#ffffff" font-size="20" font-weight="700">Document</text>
    <text x="84" y="235" fill="#ffffff" font-size="20" font-weight="700">Intelligence</text>
    <rect x="288" y="142" width="180" height="102" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
    <text x="312" y="181" fill="#7dd3fc" font-size="13" font-weight="700">02 · KNOWLEDGE</text>
    <text x="312" y="213" fill="#ffffff" font-size="20" font-weight="700">Traceable RAG</text>
    <text x="312" y="235" fill="#cbd5e1" font-size="14">retrieval + citations</text>
    <rect x="516" y="142" width="180" height="102" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
    <text x="540" y="181" fill="#7dd3fc" font-size="13" font-weight="700">03 · EXECUTION</text>
    <text x="540" y="213" fill="#ffffff" font-size="20" font-weight="700">Agent + Tools</text>
    <text x="540" y="235" fill="#cbd5e1" font-size="14">workflow + approval</text>
    <rect x="744" y="142" width="180" height="102" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.20"/>
    <text x="768" y="181" fill="#7dd3fc" font-size="13" font-weight="700">04 · QUALITY</text>
    <text x="768" y="213" fill="#ffffff" font-size="20" font-weight="700">Evaluation</text>
    <text x="768" y="235" fill="#cbd5e1" font-size="14">rubric + badcases</text>
    <rect x="972" y="142" width="168" height="102" rx="18" fill="url(#accent)"/>
    <text x="996" y="181" fill="#e0e7ff" font-size="13" font-weight="700">05 · DELIVERY</text>
    <text x="996" y="213" fill="#ffffff" font-size="20" font-weight="700">Trusted AI</text>
    <text x="996" y="235" fill="#eef2ff" font-size="14">PoC → rollout</text>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round">
    <path d="M250 193H278"/><path d="M478 193H506"/><path d="M706 193H734"/><path d="M934 193H962"/>
  </g>
  <g fill="#7dd3fc">
    <path d="M278 187l10 6-10 6z"/><path d="M506 187l10 6-10 6z"/><path d="M734 187l10 6-10 6z"/><path d="M962 187l10 6-10 6z"/>
  </g>
</svg>
