<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOI Platform showcase</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 680px; margin: 0; overflow: hidden; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .canvas {
      position: relative; width: 1200px; height: 680px; overflow: hidden;
      background: radial-gradient(circle at 88% 17%, #315eab 0, transparent 39%),
                  radial-gradient(circle at 12% 95%, #194a76 0, transparent 42%),
                  linear-gradient(125deg, #09182e, #122b52 62%, #17366b);
    }
    .canvas::before {
      content: ""; position: absolute; inset: 0; opacity: .13;
      background-image: linear-gradient(#a7c8ff 1px, transparent 1px),
                        linear-gradient(90deg, #a7c8ff 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 87%);
    }
    .eyebrow { position: absolute; left: 50px; top: 37px; color: #93c5fd; font-size: 14px; font-weight: 750; letter-spacing: .18em; }
    h1 { position: absolute; left: 47px; top: 62px; margin: 0; color: #fff; font-size: 43px; font-weight: 720; letter-spacing: -.035em; }
    .subhead { position: absolute; left: 50px; top: 124px; color: #cbdaf2; font-size: 16px; }
    .window { position: absolute; overflow: hidden; background: white; border: 1px solid #d7e0f0; border-radius: 18px; box-shadow: 0 26px 70px #031022a8, 0 4px 12px #03102255; }
    .window-main { left: 47px; top: 183px; width: 835px; height: 440px; }
    .window-secondary { left: 745px; top: 306px; width: 407px; height: 294px; border: 2px solid #f5f8ff; }
    .chrome { height: 39px; display: flex; align-items: center; gap: 7px; padding: 0 17px; border-bottom: 1px solid #e6ebf3; background: #f7f9fc; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff6b6b; }
    .dot:nth-child(2) { background: #f8c34e; }
    .dot:nth-child(3) { background: #51cb8a; }
    .tab { margin-left: 15px; color: #596579; font-size: 12px; font-weight: 650; }
    .window img { display: block; width: 100%; height: auto; }
    .label { position: absolute; right: 48px; bottom: 24px; color: #bcd5fd; font-size: 13px; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="eyebrow">MOI PLATFORM</div>
    <h1>从工作流到智能体应用</h1>
    <div class="subhead">Workflow design · Agent applications · Product prototype</div>
    <section class="window window-main" aria-label="智能体应用创建界面">
      <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="tab">智能体应用</span></div>
      <img src="../assets/screenshots/moi-platform/agent-app-creation.png" alt="" />
    </section>
    <section class="window window-secondary" aria-label="工作流管理界面">
      <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="tab">工作流管理</span></div>
      <img src="../assets/screenshots/moi-platform/workflow-management.png" alt="" />
    </section>
    <div class="label">PRODUCT INTERFACE / 01</div>
  </main>
</body>
</html>
