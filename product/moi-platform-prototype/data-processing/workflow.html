<head>

  <link rel="stylesheet" href="../styles/common.css">
  <style>
    .btn-primary {
      background: #1677ff; color: #fff; border: none; padding: 4px 15px; height: 32px;
      border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 400;
      display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s;
    }
    .btn-primary:hover { background: #4096ff; }

    .data-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #f0f0f0; }
    .data-table th {
      text-align: left; padding: 12px 16px; font-size: 14px; color: rgba(0,0,0,0.88);
      font-weight: 600; background: #fafafa; border-bottom: 1px solid #f0f0f0;
    }
    .data-table td { padding: 12px 16px; font-size: 14px; color: rgba(0,0,0,0.88); border-bottom: 1px solid #f0f0f0; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #fafafa; }

    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .status-badge.success { background: #f6ffed; color: #52c41a; }
    .status-badge.running { background: #e6f4ff; color: #1677ff; }
    .status-badge.failed { background: #fff2f0; color: #ff4d4f; }
    .status-badge.pending { background: #f5f5f5; color: rgba(0,0,0,0.45); }
    .status-badge.stopped { background: #fffbe6; color: #faad14; }

    .mode-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .mode-badge.dag { background: #f0f5ff; color: #2f54eb; }
    .mode-badge.dev { background: #f9f0ff; color: #722ed1; }

    .action-btns { display: flex; gap: 8px; }
    .action-btn-sm {
      padding: 0 7px; height: 24px; border-radius: 6px; font-size: 14px; cursor: pointer;
      border: 1px solid #d9d9d9; background: #fff; color: rgba(0,0,0,0.88); transition: all 0.2s;
      display: inline-flex; align-items: center;
    }
    .action-btn-sm:hover { border-color: #1677ff; color: #1677ff; }
    .action-btn-sm.danger:hover { border-color: #ff4d4f; color: #ff4d4f; }

    .form-input {
      padding: 4px 11px; height: 32px; border: 1px solid #d9d9d9; border-radius: 6px;
      font-size: 14px; color: rgba(0,0,0,0.88); outline: none; transition: all 0.2s;
    }
    .form-input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(5,145,255,0.1); }
    .form-input::placeholder { color: rgba(0,0,0,0.25); }

    .empty-state {
      text-align: center; padding: 80px 0; color: rgba(0,0,0,0.25);
    }
    .empty-state svg { margin-bottom: 16px; }
    .empty-state p { font-size: 14px; margin-bottom: 16px; }

    /* Template modal */
    .tpl-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .tpl-overlay.show { display: flex; }
    .tpl-modal {
      background: #fff; border-radius: 12px; width: 680px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }
    .tpl-header {
      padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between;
    }
    .tpl-header h2 { font-size: 16px; font-weight: 600; color: rgba(0,0,0,0.88); margin: 0; }
    .tpl-close {
      width: 28px; height: 28px; border: none; background: none; cursor: pointer;
      color: rgba(0,0,0,0.35); border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all 0.15s;
    }
    .tpl-close:hover { background: rgba(0,0,0,0.04); color: rgba(0,0,0,0.65); }
    .tpl-subtitle { font-size: 13px; color: rgba(0,0,0,0.45); padding: 6px 24px 16px; }
    .tpl-body { padding: 0 24px 20px; display: flex; flex-direction: column; gap: 12px; }
    .tpl-card {
      border: 1.5px solid #f0f0f0; border-radius: 10px; padding: 16px 18px; cursor: pointer;
      transition: all 0.2s; position: relative;
    }
    .tpl-card:hover { border-color: #1677ff; box-shadow: 0 2px 12px rgba(22,119,255,0.1); }
    .tpl-card .tpl-name { font-size: 14px; font-weight: 600; color: rgba(0,0,0,0.88); margin-bottom: 6px; }
    .tpl-card .tpl-desc { font-size: 12px; color: rgba(0,0,0,0.55); line-height: 1.6; margin-bottom: 10px; }
    .tpl-card .tpl-nodes {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .tpl-node-tag {
      display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; height: 22px;
      border-radius: 4px; font-size: 11px; background: #f5f5f5; color: rgba(0,0,0,0.65);
    }
    .tpl-node-arrow { color: rgba(0,0,0,0.2); font-size: 11px; }
    .tpl-card .tpl-use {
      position: absolute; top: 16px; right: 18px; padding: 3px 12px; height: 26px;
      border-radius: 5px; font-size: 12px; cursor: pointer; border: 1px solid #1677ff;
      background: #1677ff; color: #fff; transition: all 0.15s;
      display: inline-flex; align-items: center;
    }
    .tpl-card .tpl-use:hover { background: #4096ff; }
    .tpl-blank {
      border: 1.5px dashed #d9d9d9; border-radius: 10px; padding: 14px 18px; cursor: pointer;
      transition: all 0.2s; text-align: center; color: rgba(0,0,0,0.45); font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tpl-blank:hover { border-color: #1677ff; color: #1677ff; background: #f0f5ff; }
  </style>
</head>

    var workflows = [
      {
        id: 'wf7b', name: '【示例制造数据项目】设备可靠性数据处理 · 全工作流读版（连接器全在工作流内）', branches: 3,
        mode: 'dag', modeName: '基础模式',
        status: 'success', statusName: '已完成', statusIcon: '✓',
        lastRun: '2026-04-11 05:00', created: '2026-04-10 09:00'
      },
      {
        id: 'wf7a', name: '【示例制造数据项目】设备可靠性数据处理 · 全载入版（数据由载入任务预置）', branches: 3,
        mode: 'dag', modeName: '基础模式',
        status: 'success', statusName: '已完成', statusIcon: '✓',
        lastRun: '2026-04-11 05:00', created: '2026-04-10 09:00'
      },
      {
        id: 'wf7', name: '【示例制造数据项目】设备可靠性数据处理 · 混合参考版（传感器工作流读 + Fiix 载入）', branches: 3,
        mode: 'dag', modeName: '基础模式',
        status: 'success', statusName: '已完成', statusIcon: '✓',
        lastRun: '2026-04-11 05:00', created: '2026-04-10 09:00'
      }
    ];

    function renderTable(data) {
      var tbody = document.getElementById('tableBody');
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9l6 6M15 9l-6 6"/></svg><p>暂无工作流</p></div></td></tr>';
        return;
      }
      var html = '';
      data.forEach(function(wf) {
        html += '<tr data-status="' + wf.status + '">'
          + '<td><a href="#" style="color:#1677ff;text-decoration:none" onclick="editWorkflow(\'' + wf.id + '\');return false">' + wf.name + '</a></td>'
          + '<td style="color:rgba(0,0,0,0.45);font-size:13px"><span style="display:inline-flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 9v6c0 1.66 1.34 3 3 3h3"/></svg>' + (wf.branches || 1) + '</span></td>'
          + '<td><span class="status-badge ' + wf.status + '">' + wf.statusIcon + ' ' + wf.statusName + '</span></td>'
          + '<td style="color:rgba(0,0,0,0.65)">' + wf.lastRun + '</td>'
          + '<td style="color:rgba(0,0,0,0.65)">' + wf.created + '</td>'
          + '<td><div class="action-btns">'
            + '<button class="action-btn-sm" onclick="ObjPerm.open(\'工作流\', \'' + wf.name + '\')">权限</button>'
            + '<button class="action-btn-sm" onclick="location.href=\'../monitor/job.html?type=wf&q=\' + encodeURIComponent(this.closest(\'tr\').cells[0].textContent.trim())">作业</button>'
            + '<button class="action-btn-sm" onclick="editWorkflow(\'' + wf.id + '\')">编辑</button>'
            + (wf.status === 'running' ? '<button class="action-btn-sm" onclick="stopWorkflow(\'' + wf.id + '\')">停止</button>' : '<button class="action-btn-sm" onclick="runWorkflow(\'' + wf.id + '\')">运行</button>')
            + '<button class="action-btn-sm danger" onclick="deleteWorkflow(\'' + wf.id + '\')">删除</button>'
          + '</div></td></tr>';
      });
      tbody.innerHTML = html;
      if (window.OPS) OPS.iconify(tbody);
    }

    function filterTable() {
      var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      var status = document.getElementById('statusFilter').value;
      var filtered = workflows.filter(function(wf) {
        var matchName = !keyword || wf.name.toLowerCase().indexOf(keyword) !== -1;
        var matchStatus = !status || wf.status === status;
        return matchName && matchStatus;
      });
      renderTable(filtered);
    }

    function openCreateModal() {
      // 直接进画布——模板 / 拖拽 / 自然语言三路引导在画布内完成
      location.href = 'workflow-edit.html?tpl=blank';
    }
    function editWorkflow(id) {
      var wf = workflows.find(function(w) { return w.id === id; });
      var name = wf ? encodeURIComponent(wf.name) : '';
      location.href = 'workflow-edit.html?id=' + id + '&name=' + name;
    }
    function runWorkflow(id) {
      var wf = workflows.find(function(w) { return w.id === id; });
      if (wf) { wf.status = 'running'; wf.statusName = '运行中'; wf.statusIcon = '⟳'; wf.lastRun = new Date().toISOString().slice(0,16).replace('T',' '); }
      filterTable();
    }
    function stopWorkflow(id) {
      var wf = workflows.find(function(w) { return w.id === id; });
      if (wf) { wf.status = 'stopped'; wf.statusName = '已停止'; wf.statusIcon = '■'; }
      filterTable();
    }
    function deleteWorkflow(id) {
      if (!confirm('确定删除该工作流？')) return;
      workflows = workflows.filter(function(w) { return w.id !== id; });
      filterTable();
    }

    // Init
    renderTable(workflows);
  </script>

  <!-- Template Selection Modal -->
  
  </div>
</body>
</html>
