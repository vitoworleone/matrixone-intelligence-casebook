<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作流交互演示</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fb; color: #18243a; }
    header { background: #fff; border-bottom: 1px solid #e5eaf2; }
    .bar { width: min(1200px, calc(100% - 40px)); margin: auto; min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .back { color: #1677ff; text-decoration: none; font-size: 14px; }
    .back:hover, .credit a:hover { text-decoration: underline; }
    main { width: min(1200px, calc(100% - 40px)); margin: 42px auto 64px; }
    h1 { margin: 0 0 22px; font-size: clamp(25px, 4vw, 36px); letter-spacing: -.02em; }
    video { display: block; width: 100%; aspect-ratio: 8 / 5; background: #e9edf3; border-radius: 14px; box-shadow: 0 20px 48px rgba(25, 49, 91, .12); }
    .credit { margin: 20px 0 0; color: #667085; font-size: 14px; }
    .credit a { color: #1677ff; text-decoration: none; }
  </style>
</head>
<body>
  <header><div class="bar"><strong>CanvasFlow</strong><a class="back" href="workflow.html">返回工作流</a></div></header>
  <main>
    <h1>工作流交互演示</h1>
    <video controls playsinline preload="metadata" poster="../videos/workflow-interaction-poster.jpg" aria-label="工作流交互演示">
      <source src="../videos/workflow-interaction-demo.mp4" type="video/mp4">
      <a href="../videos/workflow-interaction-demo.mp4">播放视频</a>
    </video>
    <p class="credit">CanvasFlow 项目与作者：<a href="https://github.com/Bai-009/canvas-first-workflow" target="_blank" rel="noopener noreferrer">Bai-009</a></p>
  </main>
</body>
</html>
