<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOI - SQL 编辑器</title>
  <link rel="stylesheet" href="../styles/common.css">
  <style>
    .sql-layout { display: flex; height: calc(100vh - 56px - 49px); }

    /* Left: DB Tree Panel */
    .db-tree-panel {
      width: 280px; min-width: 280px; background: #fff; border-right: 1px solid #f0f0f0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    /* Left panel tabs */
    .left-panel-tabs {
      display: flex; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; position: relative;
    }
    .left-panel-tab {
      flex: 1; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 600;
      color: rgba(0,0,0,0.45); cursor: pointer; border-bottom: 2px solid transparent;
      transition: all 0.15s; user-select: none;
    }
    .left-panel-tab:hover { color: rgba(0,0,0,0.88); }
    .left-panel-tab.active { color: #1677ff; border-bottom-color: #1677ff; }
    .left-panel-collapse-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 22px; height: 22px; border: none; background: none; cursor: pointer;
      color: rgba(0,0,0,0.3); border-radius: 4px; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; z-index: 2;
    }
    .left-panel-collapse-btn:hover { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.65); }
    .left-panel-collapse-btn svg { width: 14px; height: 14px; }
    /* Collapsed left panel */
    .db-tree-panel.collapsed { width: 0; min-width: 0; border-right: none; overflow: hidden; }
    .left-panel-expand-btn {
      display: none; width: 20px; min-width: 20px; background: #fff; border-right: 1px solid #f0f0f0;
      cursor: pointer; align-items: center; justify-content: center; color: rgba(0,0,0,0.3);
      transition: all 0.15s; flex-shrink: 0;
    }
    .left-panel-expand-btn:hover { background: #f0f5ff; color: #1677ff; }
    .left-panel-expand-btn.show { display: flex; }
    .left-panel-expand-btn svg { width: 14px; height: 14px; }
    .left-tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .left-tab-content.active { display: flex; }
    .db-tree-search { padding: 8px 12px; }
    .db-tree-search input {
      width: 100%; height: 30px; padding: 4px 30px 4px 10px; border: 1px solid #d9d9d9;
      border-radius: 6px; font-size: 12px; outline: none; transition: all 0.2s;
    }
    .db-tree-search input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(5,145,255,0.1); }
    .db-tree-search input::placeholder { color: rgba(0,0,0,0.25); }
    .db-tree-search { position: relative; }
    .db-tree-search .s-icon {
      position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
      color: rgba(0,0,0,0.35); pointer-events: none;
    }
    .db-tree-body { flex: 1; overflow-y: auto; padding: 4px 0; }
    .db-tree-body::-webkit-scrollbar { width: 4px; }
    .db-tree-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

    /* Workbook panel */
    .wb-search-row {
      display: flex; align-items: center; gap: 6px; padding: 8px 12px; flex-shrink: 0;
    }
    .wb-search-row input {
      flex: 1; height: 30px; padding: 4px 30px 4px 10px; border: 1px solid #d9d9d9;
      border-radius: 6px; font-size: 12px; outline: none; transition: all 0.2s;
    }
    .wb-search-row input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(5,145,255,0.1); }
    .wb-search-row input::placeholder { color: rgba(0,0,0,0.25); }
    .wb-search-wrap { flex: 1; position: relative; }
    .wb-search-wrap .s-icon {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      color: rgba(0,0,0,0.35); pointer-events: none;
    }
    .wb-add-icon-btn {
      width: 30px; height: 30px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: rgba(0,0,0,0.65); transition: all 0.15s; flex-shrink: 0;
    }
    .wb-add-icon-btn:hover { border-color: #1677ff; color: #1677ff; background: #f0f5ff; }
    .wb-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .wb-list::-webkit-scrollbar { width: 4px; }
    .wb-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }
    .wb-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px;
      cursor: pointer; transition: all 0.15s; margin-bottom: 2px; position: relative;
    }
    .wb-item:hover { background: rgba(0,0,0,0.04); }
    .wb-item.active { background: #e6f4ff; }
    .wb-item .wb-icon {
      width: 28px; height: 28px; border-radius: 6px; background: #f0f5ff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .wb-item.active .wb-icon { background: #bae0ff; }
    .wb-item .wb-icon svg { width: 14px; height: 14px; color: #1677ff; }
    .wb-item .wb-info { flex: 1; min-width: 0; }
    .wb-item .wb-name {
      font-size: 13px; color: rgba(0,0,0,0.88); font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wb-item.active .wb-name { color: #1677ff; }
    .wb-item .wb-meta { font-size: 11px; color: rgba(0,0,0,0.35); margin-top: 1px; }
    .wb-item .wb-actions {
      display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0;
    }
    .wb-item:hover .wb-actions { opacity: 1; }
    .wb-act-btn {
      width: 22px; height: 22px; border: none; background: none; cursor: pointer;
      color: rgba(0,0,0,0.3); border-radius: 4px; display: flex; align-items: center; justify-content: center;
    }
    .wb-act-btn:hover { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.65); }
    .wb-act-btn.danger:hover { color: #ff4d4f; background: #fff2f0; }
    .wb-act-btn svg { width: 13px; height: 13px; }
    /* Rename input */
    .wb-rename-input {
      font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.88);
      border: 1px solid #1677ff; border-radius: 4px; outline: none; padding: 1px 6px;
      width: 100%; box-sizing: border-box; background: #fff;
    }

    .db-node {
      display: flex; align-items: center; height: 30px; padding: 0 12px; cursor: pointer;
      transition: background 0.15s; gap: 4px; font-size: 13px; color: rgba(0,0,0,0.88);
    }
    .db-node:hover { background: rgba(0,0,0,0.04); }
    .db-node.selected { background: #e6f4ff; color: #1677ff; }
    .db-node .n-arrow {
      width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: rgba(0,0,0,0.35); transition: transform 0.2s; font-size: 10px;
    }
    .db-node .n-arrow.open { transform: rotate(90deg); }
    .db-node .n-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .db-node .n-icon svg { width: 14px; height: 14px; }
    .db-node .n-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .db-node .n-badge {
      font-size: 11px; color: rgba(0,0,0,0.35); background: #f5f5f5; padding: 0 5px;
      border-radius: 3px; flex-shrink: 0; line-height: 18px;
    }
    .db-children { display: none; }
    .db-children.open { display: block; }
    .db-children .db-node { padding-left: 36px; }

    /* Table info panel below tree */
    .table-info-panel {
      border-top: 1px solid #f0f0f0; background: #fafafa; max-height: 240px;
      overflow-y: auto; flex-shrink: 0;
    }
    .table-info-panel::-webkit-scrollbar { width: 4px; }
    .table-info-panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }
    .table-info-header {
      padding: 8px 12px; font-size: 12px; font-weight: 600; color: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #f0f0f0; background: #fff; position: sticky; top: 0; z-index: 1;
    }
    .table-info-header .row-count { font-weight: 400; color: rgba(0,0,0,0.45); }
    .col-row {
      display: flex; align-items: center; padding: 4px 12px; font-size: 12px;
      border-bottom: 1px solid #f5f5f5; gap: 8px;
    }
    .col-row:last-child { border-bottom: none; }
    .col-name { flex: 1; color: rgba(0,0,0,0.88); font-family: 'SF Mono','Consolas','Monaco',monospace; }
    .col-type { color: rgba(0,0,0,0.45); font-family: 'SF Mono','Consolas','Monaco',monospace; font-size: 11px; }

    /* Right: SQL Editor Panel */
    .sql-editor-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f5f5f5; }

    /* Toolbar */
    .sql-toolbar {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: #fff; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;
    }
    .sql-toolbar select {
      height: 30px; padding: 2px 8px; border: 1px solid #d9d9d9; border-radius: 6px;
      font-size: 13px; outline: none; background: #fff; cursor: pointer; min-width: 160px;
    }
    .sql-toolbar select:focus { border-color: #1677ff; }
    /* 三种查询模式切换 */
    .sql-mode-switch { display: flex; gap: 4px; padding: 10px 10px 0; }
    .sql-mode-btn { flex: 1; padding: 6px 4px; font-size: 12px; border: 1px solid #e5e6eb; background: #fff; color: rgba(0,0,0,0.6); cursor: pointer; border-radius: 6px; transition: all 0.15s; white-space: nowrap; }
    .sql-mode-btn:hover { border-color: #1677ff; color: #1677ff; }
    .sql-mode-btn.active { background: #1677ff; color: #fff; border-color: #1677ff; }
    .sql-mode-btn.active:hover { color: #fff; }
    .sql-syntax-badge { font-size: 12px; color: rgba(0,0,0,0.5); padding: 3px 10px; background: #f5f7fa; border: 1px solid #eef0f3; border-radius: 6px; white-space: nowrap; }
    .btn-run {
      background: #1677ff; color: #fff; border: none; padding: 0 16px; height: 30px;
      border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s;
      margin-left: 0; flex-shrink: 0; white-space: nowrap;
    }
    .btn-run:hover { background: #4096ff; }
    .btn-run svg { width: 14px; height: 14px; }
    /* 工作簿历史版本选择器 */
    .ver-selector { position: relative; margin-left: auto; }
    .ver-trigger { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; color: rgba(0,0,0,0.7); max-width: 250px; }
    .ver-trigger:hover { border-color: #1677ff; color: #1677ff; }
    .ver-trigger svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.6; }
    .ver-trigger .ver-cur { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'SF Mono', Monaco, monospace; }
    .ver-dropdown { display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 50; background: #fff; border: 1px solid #e5e6eb; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.12); min-width: 290px; padding: 8px; }
    .ver-dropdown.show { display: block; }
    .ver-dropdown-title { font-size: 12px; color: rgba(0,0,0,0.4); padding: 4px 8px 8px; }
    .ver-list { max-height: 340px; overflow-y: auto; }
    .ver-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .ver-item:hover { background: #f5f7fb; }
    .ver-item.active { background: #e6f0ff; }
    .ver-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .ver-dot.formal { background: #52c41a; }
    .ver-dot.draft { background: #faad14; }
    .ver-name { flex: 1; font-family: 'SF Mono', Monaco, monospace; color: rgba(0,0,0,0.8); white-space: nowrap; }
    .ver-item.active .ver-name { color: #1677ff; font-weight: 600; }
    .ver-check { color: #1677ff; }
    .ver-empty { padding: 16px; text-align: center; font-size: 12px; color: rgba(0,0,0,0.3); }

    /* Code Area */
    .code-area-wrap {
      flex: 1; min-height: 120px; display: flex; background: #fff; border-bottom: 1px solid #e5e6eb;
      position: relative; overflow: hidden;
    }
    .line-numbers {
      width: 44px; background: #fafafa; border-right: 1px solid #f0f0f0; padding: 10px 0;
      text-align: right; font-family: 'SF Mono','Consolas','Monaco',monospace; font-size: 13px;
      line-height: 20px; color: rgba(0,0,0,0.25); user-select: none; overflow: hidden;
      flex-shrink: 0;
    }
    .line-numbers div { padding: 0 8px 0 0; }
    .code-editor-container { flex: 1; position: relative; overflow: hidden; }
    .code-highlight-layer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 10px 12px;
      font-family: 'SF Mono','Consolas','Monaco',monospace; font-size: 13px;
      line-height: 20px; white-space: pre-wrap; word-wrap: break-word;
      pointer-events: none; color: rgba(0,0,0,0.88); overflow-y: auto;
    }
    .code-highlight-layer .hl-active { background: rgba(22,119,255,0.08); border-radius: 2px; }
    .code-highlight-layer .hl-keyword { color: #0550ae; font-weight: 600; }
    .code-textarea {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 10px 12px;
      font-family: 'SF Mono','Consolas','Monaco',monospace; font-size: 13px;
      line-height: 20px; border: none; outline: none; resize: none; background: transparent;
      color: transparent; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word;
      caret-color: rgba(0,0,0,0.88);
    }
    .code-textarea::placeholder { color: rgba(0,0,0,0.25); }

    /* Query History Tabs */
    .query-history-bar {
      display: flex; align-items: center; background: #fafafa; border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0; height: 34px; padding: 0 8px; gap: 2px; overflow-x: auto;
    }
    .query-history-bar::-webkit-scrollbar { height: 0; }
    .query-tab {
      display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 28px;
      background: #fff; border: 1px solid #e8e8e8; border-radius: 6px; cursor: pointer;
      font-size: 12px; color: rgba(0,0,0,0.65); white-space: nowrap; max-width: 220px;
      transition: all 0.15s; flex-shrink: 0;
    }
    .query-tab:hover { border-color: #b3d8ff; background: #f0f5ff; }
    .query-tab.active { border-color: #1677ff; background: #e6f4ff; color: #1677ff; }
    .query-tab .qt-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .query-tab .qt-dot.success { background: #52c41a; }
    .query-tab .qt-dot.error { background: #ff4d4f; }
    .query-tab .qt-dot.running { background: #faad14; }
    .query-tab .qt-sql {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px;
    }
    .query-tab .qt-close {
      width: 16px; height: 16px; border: none; background: none; cursor: pointer;
      color: rgba(0,0,0,0.25); border-radius: 3px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; font-size: 12px; line-height: 1; padding: 0;
    }
    .query-tab .qt-close:hover { background: rgba(0,0,0,0.08); color: rgba(0,0,0,0.65); }
    .query-tab.active .qt-close:hover { background: rgba(22,119,255,0.15); color: #1677ff; }

    /* Result Area */
    .result-area { min-height: 36px; display: flex; flex-direction: column; background: #fff; overflow: hidden; transition: none; }
    .result-area.minimized { flex: none !important; height: 36px !important; min-height: 36px; }
    .result-area.maximized { flex: none !important; height: calc(100% - 46px) !important; }
    .result-area.minimized .result-body,
    .result-area.minimized .query-history-bar { display: none; }
    .result-tabs {
      display: flex; align-items: center; border-bottom: 1px solid #f0f0f0; padding: 0 16px;
      flex-shrink: 0; background: #fff; height: 36px;
    }
    .result-tab {
      padding: 8px 16px; font-size: 13px; color: rgba(0,0,0,0.65); cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .result-tab:hover { color: rgba(0,0,0,0.88); }
    .result-tab.active { color: #1677ff; border-bottom-color: #1677ff; font-weight: 500; }
    .result-status {
      margin-left: auto; font-size: 12px; color: rgba(0,0,0,0.45); display: flex; align-items: center; gap: 12px;
    }
    .result-status .success { color: #52c41a; }
    .result-toolbar-btns {
      display: flex; align-items: center; gap: 4px; margin-left: 12px;
    }
    .result-tool-btn {
      width: 26px; height: 26px; border: none; background: none; cursor: pointer;
      color: rgba(0,0,0,0.35); border-radius: 4px; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .result-tool-btn:hover { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.65); }
    .result-tool-btn svg { width: 14px; height: 14px; }
    .result-body { flex: 1; overflow: auto; position: relative; }
    .result-body::-webkit-scrollbar { width: 6px; height: 6px; }
    .result-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

    /* Chart Builder */
    .chart-container { display: flex; height: 100%; }
    .chart-canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
    .chart-canvas-area svg { max-width: 100%; }
    .chart-config-panel {
      width: 240px; min-width: 240px; border-left: 1px solid #f0f0f0; padding: 12px;
      overflow-y: auto; background: #fafafa; flex-shrink: 0;
    }
    .chart-config-panel::-webkit-scrollbar { width: 4px; }
    .chart-config-panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }
    .cc-section { margin-bottom: 14px; }
    .cc-label { font-size: 12px; color: rgba(0,0,0,0.45); margin-bottom: 4px; font-weight: 500; }
    .cc-select {
      width: 100%; height: 30px; padding: 2px 8px; border: 1px solid #d9d9d9; border-radius: 6px;
      font-size: 12px; outline: none; background: #fff; cursor: pointer;
    }
    .cc-select:focus { border-color: #1677ff; }
    .cc-type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .cc-type-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px;
      border: 1px solid #e8e8e8; border-radius: 6px; cursor: pointer; background: #fff;
      font-size: 10px; color: rgba(0,0,0,0.55); transition: all 0.15s;
    }
    .cc-type-btn:hover { border-color: #b3d8ff; background: #f0f5ff; }
    .cc-type-btn.active { border-color: #1677ff; background: #e6f4ff; color: #1677ff; }
    .cc-type-btn svg { width: 20px; height: 20px; }
    .cc-y-row { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
    .cc-y-row select { flex: 1; }
    .cc-y-remove {
      width: 22px; height: 22px; border: none; background: none; cursor: pointer;
      color: rgba(0,0,0,0.25); border-radius: 4px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .cc-y-remove:hover { background: #fff2f0; color: #ff4d4f; }
    .cc-add-y {
      font-size: 12px; color: #1677ff; cursor: pointer; display: inline-flex;
      align-items: center; gap: 4px; padding: 2px 0;
    }
    .cc-add-y:hover { text-decoration: underline; }
    .chart-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: rgba(0,0,0,0.25); gap: 8px; font-size: 13px;
    }
    .chart-empty svg { width: 48px; height: 48px; color: rgba(0,0,0,0.08); }
    .result-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .result-table th {
      text-align: left; padding: 8px 12px; background: #fafafa; border-bottom: 1px solid #f0f0f0;
      font-weight: 500; color: rgba(0,0,0,0.65); white-space: nowrap; position: sticky; top: 0; z-index: 1;
    }
    .result-table td {
      padding: 6px 12px; border-bottom: 1px solid #f5f5f5; color: rgba(0,0,0,0.88); white-space: nowrap;
    }
    .result-table tr:hover td { background: #fafafa; }
    .result-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: rgba(0,0,0,0.25); gap: 8px; font-size: 13px;
    }
    .result-empty svg { width: 48px; height: 48px; color: rgba(0,0,0,0.08); }

    /* Splitter */
    .h-splitter {
      height: 4px; background: #f0f0f0; cursor: row-resize; flex-shrink: 0;
      transition: background 0.15s;
    }
    .h-splitter:hover { background: #1677ff; }
  </style>
</head>
<body>

  <div class="top-bar"></div>
  <div id="addWsModal"></div>

  <!-- Sidebar -->
  <div class="sidebar">

    // ===== Database tree data: extract from Catalog + add mock tables =====
    var DB_TREE = [];
    var expandedDbs = new Set();
    var selectedTable = null;

    function loadDbTree() {
      DB_TREE = [];
      // Read from Catalog localStorage
      var catalogData = [];
      try {
        var raw = localStorage.getItem('moi_catalog_data');
        if (raw) catalogData = JSON.parse(raw);
      } catch(e) {}

      // Extract all databases that contain tables
      // 外部数据库目录(extcatalog)：其下的 db / schema 也要抽取，并标记 external + source（联邦查询）
      var dbMap = {}; // key -> { tables, external, source, display }
      function walk(nodes, extName) {
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          var curExt = (n.type === 'extcatalog') ? n.name : extName;
          if ((n.type === 'db' || n.type === 'schema') && n.children) {
            var tables = [];
            for (var j = 0; j < n.children.length; j++) {
              if (n.children[j].type === 'table') {
                tables.push(n.children[j].name);
              }
            }
            if (tables.length > 0) {
              // 外部库用「源名 · 库/schema」做唯一键，避免与内部同名库冲突；display 只显示库/schema 名
              var key = curExt ? (curExt + ' · ' + n.name) : n.name;
              dbMap[key] = { tables: tables, external: !!curExt, source: curExt || null, display: n.name };
            }
          }
          if (n.children) walk(n.children, curExt);
        }
      }
      walk(catalogData, null);

      // Add mock databases with rich table data for demo
      if (!dbMap['处理数据库']) {
        dbMap['处理数据库'] = { tables: ['用户行为表'] };
      }
      // Ensure TPC-H style tables exist
      if (!dbMap['tpch_sf1']) {
        dbMap['tpch_sf1'] = { tables: ['part', 'orders', 'lineitem', 'customer'] };
      }

      // Build flat DB_TREE（内部库在前、外部联邦库在后）
      for (var dbName in dbMap) {
        DB_TREE.push({ name: dbName, tables: dbMap[dbName].tables, external: !!dbMap[dbName].external, source: dbMap[dbName].source || null, display: dbMap[dbName].display || dbName });
      }
      // Sort：内部优先，其次按名
      DB_TREE.sort(function(a, b) {
        if (!!a.external !== !!b.external) return a.external ? 1 : -1;
        return (a.display || a.name).localeCompare(b.display || b.name);
      });
    }

    // ===== 三种查询模式 =====
    var sqlMode = 'moi';        // moi | external | federated
    var sqlExtCatalog = null;   // external 模式下选中的某个外部目录（source 名）
    function sqlExternalCatalogs() {
      var seen = {}, list = [];
      DB_TREE.forEach(function(d){ if (d.external && d.source && !seen[d.source]) { seen[d.source] = 1; list.push(d.source); } });
      return list;
    }
    function sqlExtDialect(source) {
      var s = source || '';
      if (/PostgreSQL|Greenplum/i.test(s)) return 'PostgreSQL';
      if (/Oracle/i.test(s)) return 'Oracle';
      if (/SQL\s*Server/i.test(s)) return 'SQL Server';
      if (/ClickHouse/i.test(s)) return 'ClickHouse';
      if (/Doris/i.test(s)) return 'Doris';
      if (/Hive/i.test(s)) return 'Hive';
      if (/MongoDB/i.test(s)) return 'MongoDB';
      if (/MatrixOne/i.test(s)) return 'MySQL';
      if (/MySQL/i.test(s)) return 'MySQL';
      return 'SQL';
    }
    // 模式过滤：某个 DB_TREE 条目在当前模式下是否显示
    function sqlDbVisible(db) {
      if (sqlMode === 'moi') return !db.external;
      if (sqlMode === 'external') return db.external && db.source === sqlExtCatalog;
      return true; // federated：全部
    }
    function setSqlMode(mode) {
      sqlMode = mode;
      if (mode === 'external' && !sqlExtCatalog) { var cats = sqlExternalCatalogs(); sqlExtCatalog = cats.length ? cats[0] : null; }
      expandedDbs.clear();
      renderSqlModeUI(); renderDbTree(); renderDbSelector(); updateSqlSyntaxBadge();
    }
    function setSqlExtCatalog(source) {
      sqlExtCatalog = source; expandedDbs.clear();
      var es = document.getElementById('sqlExtSelect'); if (es && es.value !== source) es.value = source;
      renderDbTree(); renderDbSelector(); updateSqlSyntaxBadge();
    }

      // SQL 计算资源选择器：MOI 表 / 联邦查询在 MOI 引擎运行 SQL → 显示；外部目录直查下推源端 → 隐藏
      var qr = document.getElementById('sqlQueryResWrap');

    function updateSqlSyntaxBadge() {
      var b = document.getElementById('sqlSyntaxBadge'); if (!b) return;
      if (sqlMode === 'moi') b.innerHTML = '语法：<b>MySQL</b>';
      else if (sqlMode === 'external') b.innerHTML = '语法：<b style="color:#13c2c2">' + sqlExtDialect(sqlExtCatalog) + '</b> · 直发该外部库';

    function renderDbTree() {
      var search = (document.getElementById('dbSearchInput').value || '').trim().toLowerCase();
      var container = document.getElementById('dbTreeBody');
      var html = '';
      var dbIcon = '<span class="n-icon" style="color:#52c41a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg></span>';

      // 外部联邦库图标：数据库柱体 + 外链角标（青色，与 Catalog 的 extcatalog 一致）
      var extDbIcon = '<span class="n-icon" style="color:#13c2c2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="5.5" rx="6" ry="2.5"/><path d="M3 5.5v6c0 1.3 2.7 2.4 6 2.5"/><path d="M3 11.5v6c0 1.4 3 2.5 6.5 2.4"/><path d="M15 9l6-6M21 3v4.5M21 3h-4.5"/></svg></span>';

      for (var i = 0; i < DB_TREE.length; i++) {
        var db = DB_TREE[i];
        if (!sqlDbVisible(db)) continue;

        // Filter（外部库可按 库名 / 源名 搜）
        var matchTables = db.tables.filter(function(t) {
          return !search || t.toLowerCase().indexOf(search) !== -1;
        });
        var dbMatch = !search || dispName.toLowerCase().indexOf(search) !== -1 || (db.source || '').toLowerCase().indexOf(search) !== -1;
        if (!dbMatch && matchTables.length === 0) continue;
        var showTables = dbMatch ? db.tables : matchTables;
        if (search) isOpen = true;

        var dbKey = db.name.replace(/'/g, "\\'");
        html += '<div class="db-node" onclick="toggleDb(\'' + dbKey + '\')"' + (db.external ? ' title="外部源：' + (db.source || '') + ' · 联邦查询，SQL 下推、数据留源"' : '') + '>'
          + '<span class="n-arrow' + (isOpen ? ' open' : '') + '">›</span>'
          + (db.external ? extDbIcon : dbIcon)
          + '<span class="n-label">' + dispName + '</span>'
          + (db.external ? '<span style="margin-left:6px;padding:0 6px;font-size:10px;line-height:16px;color:#13c2c2;background:#e6fffb;border:1px solid #b5f5ec;border-radius:8px;flex-shrink:0">联邦</span>' : '')
          + '<span class="n-badge">' + db.tables.length + '</span>'
          + '</div>';
        html += '<div class="db-children' + (isOpen ? ' open' : '') + '" id="dbChildren_' + i + '">';
        for (var j = 0; j < showTables.length; j++) {
          var tName = showTables[j];
          var sel = selectedTable === tName ? ' selected' : '';
          html += '<div class="db-node' + sel + '" onclick="event.stopPropagation();selectTable(\'' + tName + '\',\'' + db.name + '\')">'
            + '<span class="n-arrow" style="visibility:hidden">›</span>'
            + tableIcon
            + '<span class="n-label">' + tName + '</span>'
            + '</div>';
        }
        html += '</div>';
      }
      if (!html) {
        html = '<div style="text-align:center;padding:40px 12px;color:rgba(0,0,0,0.25);font-size:13px">暂无包含表的数据库</div>';

    }

    function toggleDb(name) {
      if (expandedDbs.has(name)) expandedDbs.delete(name);
      else expandedDbs.add(name);
      renderDbTree();
    }

    function selectTable(tableName, dbName) {

      // 外部联邦表提示（含三段式引用名，呼应"统一方言、引擎下推"）

      var fedBanner = '';

          + '<span style="color:#13c2c2;font-weight:600">外部联邦表</span> · 源：' + (dbEntry.source || '') + '<br>'
          + '引用 <code style="color:#13c2c2;background:#fff;padding:1px 4px;border-radius:3px">' + (dbEntry.display || '') + '.' + tableName + '</code>，统一方言查询，引擎下推到源库，<b>数据不落地</b>'

    function filterDbTree() { renderDbTree(); }

    // ===== DB Selector dropdown =====
    function renderDbSelector() {
      var sel = document.getElementById('dbSelector');
      sel.innerHTML = '';

    function onDbSelectorChange() {}

    // ===== SQL Editor: line numbers, highlighting, cursor tracking =====
    var currentStmtRange = null; // { start, end } char indices

    function onSqlInput() {
      updateLineNumbers();
      updateHighlight();
      onSqlCursorMove();
      wbOnEdit();
    }

    function updateLineNumbers() {
      var ta = document.getElementById('sqlTextarea');
      var lines = ta.value.split('\n');
      var nums = document.getElementById('lineNumbers');
      var html = '';
      for (var i = 0; i < lines.length; i++) {
        html += '<div>' + (i + 1) + '</div>';
      }
      nums.innerHTML = html;
    }

    function onSqlCursorMove() {
      var ta = document.getElementById('sqlTextarea');
      var pos = ta.selectionStart;
      var text = ta.value;

      // Find which statement the cursor is in (delimited by ";")
      var stmts = parseStatements(text);
      currentStmtRange = null;
      for (var i = 0; i < stmts.length; i++) {
        if (pos >= stmts[i].start && pos <= stmts[i].end) {
          currentStmtRange = stmts[i];
          break;
        }
      }
      // If cursor is after last ";", pick last statement
      if (!currentStmtRange && stmts.length > 0) {
        currentStmtRange = stmts[stmts.length - 1];
      }

      updateHighlight();
      // Update hint
      var hint = document.getElementById('stmtHint');
      if (currentStmtRange) {
        var stmtText = text.substring(currentStmtRange.start, currentStmtRange.end).trim();
        if (stmtText) {
          hint.textContent = '当前语句： ' + (stmtText.length > 40 ? stmtText.substring(0, 40) + '...' : stmtText);
        } else {
          hint.textContent = '';
        }
      } else {
        hint.textContent = '';
      }
    }

    function parseStatements(text) {
      var stmts = [];
      var start = 0;
      for (var i = 0; i <= text.length; i++) {
        if (i === text.length || text[i] === ';') {
          var chunk = text.substring(start, i).trim();
          if (chunk) {
            stmts.push({ start: start, end: i, text: chunk });
          }
          start = i + 1;
        }
      }
      return stmts;
    }

    function updateHighlight() {
      var ta = document.getElementById('sqlTextarea');
      var text = ta.value;
      var layer = document.getElementById('highlightLayer');

      if (!currentStmtRange) {
        layer.innerHTML = syntaxHighlight(escHtml(text));
        return;
      }

      var before = text.substring(0, currentStmtRange.start);
      var active = text.substring(currentStmtRange.start, currentStmtRange.end);
      var after = text.substring(currentStmtRange.end);

      // Include the trailing ";" in highlight if present
      if (after.charAt(0) === ';') {
        active += ';';
        after = after.substring(1);
      }

      layer.innerHTML = syntaxHighlight(escHtml(before))
        + '<span class="hl-active">' + syntaxHighlight(escHtml(active)) + '</span>'
        + syntaxHighlight(escHtml(after));
    }

    function syntaxHighlight(escapedSql) {
      var keywords = ['SELECT','FROM','WHERE','ORDER','BY','LIMIT','INSERT','UPDATE','DELETE',
        'CREATE','DROP','ALTER','TABLE','INTO','VALUES','SET','JOIN','LEFT','RIGHT','INNER',
        'OUTER','ON','AND','OR','NOT','IN','LIKE','AS','GROUP','HAVING','DISTINCT','COUNT',
        'SUM','AVG','MIN','MAX','BETWEEN','EXISTS','UNION','ALL','IS','NULL','TRUE','FALSE',
        'CASE','WHEN','THEN','ELSE','END','ASC','DESC','WITH','OVER','PARTITION','ROW_NUMBER',
        'RANK','DENSE_RANK','OFFSET','FETCH','NEXT','ROWS','ONLY'];
      var result = escapedSql;
      for (var i = 0; i < keywords.length; i++) {
        var re = new RegExp('\\b(' + keywords[i] + ')\\b', 'gi');
        result = result.replace(re, '<span class="hl-keyword">$1</span>');
      }
      return result;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function syncScroll() {
      var ta = document.getElementById('sqlTextarea');
      var layer = document.getElementById('highlightLayer');
      var nums = document.getElementById('lineNumbers');
      layer.scrollTop = ta.scrollTop;
      layer.scrollLeft = ta.scrollLeft;
      nums.scrollTop = ta.scrollTop;
    }

    // ===== Execute SQL =====
    var queryHistory = []; // { id, sql, result, status, time }
    var activeQueryId = null;
    var activeResultTab = 'table'; // 'table' | 'chart'

    // Chart config state
    var chartConfig = { type: 'bar', xCol: '', ySeries: [{ col: '', agg: 'SUM' }] };

    function executeSQL() {
      var ta = document.getElementById('sqlTextarea');
      var text = ta.value;
      if (!currentStmtRange) {
        alert('请先在编辑器中输入 SQL 语句');
        return;
      }
      var sql = text.substring(currentStmtRange.start, currentStmtRange.end).trim();
      if (!sql) { alert('当前语句为空'); return; }

      // 执行触发：当前草稿转正式 / 或生成新正式版本（时间戳命名）
      wbOnRun();

      // Mock execution result
      var result = generateMockResult(sql);
      var qEntry = {
        id: 'q_' + Date.now(),
        sql: sql,
        result: result,
        status: 'success',
        time: new Date().toLocaleTimeString()
      };
      queryHistory.push(qEntry);
      activeQueryId = qEntry.id;
      lastResult = result;

      renderQueryTabs();
      showQueryResult(qEntry);
      // Show download button
      document.getElementById('btnDownloadResult').style.display = '';
      // Restore from minimized if needed
      var ra = document.getElementById('resultArea');
      if (ra.classList.contains('minimized')) {
        toggleResultMinMax('min');
      }
    }

    function renderQueryTabs() {
      var bar = document.getElementById('queryHistoryBar');
      if (queryHistory.length === 0) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      var html = '';
      for (var i = 0; i < queryHistory.length; i++) {
        var q = queryHistory[i];
        var isActive = q.id === activeQueryId;
        var dotClass = q.status === 'success' ? 'success' : 'error';
        var sqlSnippet = q.sql.replace(/\s+/g, ' ');
        if (sqlSnippet.length > 30) sqlSnippet = sqlSnippet.substring(0, 30) + '...';
        html += '<div class="query-tab' + (isActive ? ' active' : '') + '" onclick="switchQueryTab(\'' + q.id + '\')">'
          + '<span class="qt-dot ' + dotClass + '"></span>'
          + '<span class="qt-sql" title="' + escHtml(q.sql) + '">' + escHtml(sqlSnippet) + '</span>'
          + '<button class="qt-close" onclick="event.stopPropagation();closeQueryTab(\'' + q.id + '\')" title="关闭">✕</button>'
          + '</div>';
      }
      bar.innerHTML = html;
      // Scroll to active tab
      var activeEl = bar.querySelector('.query-tab.active');
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }

    function switchQueryTab(id) {
      activeQueryId = id;
      var q = queryHistory.find(function(h) { return h.id === id; });
      if (q) {
        lastResult = q.result;
        showQueryResult(q);
      }
      renderQueryTabs();
    }

    function closeQueryTab(id) {
      var idx = queryHistory.findIndex(function(h) { return h.id === id; });
      if (idx === -1) return;
      queryHistory.splice(idx, 1);
      if (activeQueryId === id) {
        if (queryHistory.length > 0) {
          var newIdx = Math.min(idx, queryHistory.length - 1);
          activeQueryId = queryHistory[newIdx].id;
          lastResult = queryHistory[newIdx].result;
          showQueryResult(queryHistory[newIdx]);
        } else {
          activeQueryId = null;
          lastResult = null;
          document.getElementById('resultStatus').innerHTML = '';
          document.getElementById('resultBody').innerHTML = '<div class="result-empty"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="8" y="12" width="48" height="40" rx="4"/><path d="M8 22h48"/><path d="M24 22v30"/><path d="M40 22v30"/><path d="M8 34h48"/><path d="M8 46h48"/></svg><span>点击"执行"运行 SQL 查看结果</span></div>';

    var lastResult = null;

    // ===== Render result as table =====
    function renderResultTable(result) {
      var body = document.getElementById('resultBody');
      var html = '<table class="result-table"><thead><tr>';
      for (var i = 0; i < result.columns.length; i++) {
        html += '<th>' + escHtml(String(result.columns[i])) + '</th>';
      }
      html += '</tr></thead><tbody>';
      for (var r = 0; r < result.rows.length; r++) {
        html += '<tr>';
        for (var c = 0; c < result.rows[r].length; c++) {
          html += '<td>' + escHtml(String(result.rows[r][c])) + '</td>';
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      body.innerHTML = html;
    }

    // ===== Chart rendering =====
    var CHART_COLORS = ['#1677ff','#52c41a','#faad14','#ff4d4f','#722ed1','#13c2c2','#eb2f96','#fa8c16'];
    var AGG_FUNCS = {
      'SUM': function(vals) { return vals.reduce(function(a,b){return a+b;},0); },
      'AVG': function(vals) { return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : 0; },
      'COUNT': function(vals) { return vals.length; },
      'MAX': function(vals) { return Math.max.apply(null, vals); },
      'MIN': function(vals) { return Math.min.apply(null, vals); }
    };

    function getNumericColumns(result) {
      if (!result || !result.rows || result.rows.length === 0) return [];
      var cols = [];
      for (var c = 0; c < result.columns.length; c++) {
        var isNum = true;
        for (var r = 0; r < Math.min(result.rows.length, 5); r++) {
          var v = result.rows[r][c];
          if (v !== null && v !== '' && isNaN(Number(v))) { isNum = false; break; }
        }
        if (isNum) cols.push(result.columns[c]);
      }
      return cols;
    }

    function aggregateData(result) {
      var xIdx = result.columns.indexOf(chartConfig.xCol);
      if (xIdx === -1) xIdx = 0;
      // Group by x
      var groups = {};
      var xLabels = [];
      for (var r = 0; r < result.rows.length; r++) {
        var xVal = String(result.rows[r][xIdx]);
        if (!groups[xVal]) { groups[xVal] = {}; xLabels.push(xVal); }
        for (var s = 0; s < chartConfig.ySeries.length; s++) {
          var yCol = chartConfig.ySeries[s].col;
          var yIdx = result.columns.indexOf(yCol);
          if (yIdx === -1) continue;
          if (!groups[xVal][s]) groups[xVal][s] = [];
          var v = Number(result.rows[r][yIdx]);
          if (!isNaN(v)) groups[xVal][s].push(v);
        }
      }
      // Apply aggregation
      var series = [];
      for (var s = 0; s < chartConfig.ySeries.length; s++) {
        var data = [];
        var aggFn = AGG_FUNCS[chartConfig.ySeries[s].agg] || AGG_FUNCS['SUM'];
        for (var i = 0; i < xLabels.length; i++) {
          var vals = (groups[xLabels[i]] && groups[xLabels[i]][s]) || [];
          data.push(aggFn(vals));
        }
        series.push({ label: chartConfig.ySeries[s].col + ' (' + chartConfig.ySeries[s].agg + ')', data: data });
      }
      return { xLabels: xLabels, series: series };
    }

    function renderChartSVG(result) {
      var agg = aggregateData(result);
      var xLabels = agg.xLabels;
      var series = agg.series;
      if (xLabels.length === 0 || series.length === 0) {
        return '<div class="chart-empty"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="8" y="32" width="10" height="20" rx="2"/><rect x="22" y="20" width="10" height="32" rx="2"/><rect x="36" y="26" width="10" height="26" rx="2"/><rect x="50" y="14" width="10" height="38" rx="2"/></svg><span>无可用数据生成图表</span></div>';
      }
      var allVals = [];
      for (var s = 0; s < series.length; s++) allVals = allVals.concat(series[s].data);
      var maxVal = Math.max.apply(null, allVals);
      var minVal = Math.min.apply(null, allVals.concat([0]));
      if (maxVal === minVal) maxVal = minVal + 1;

      var W = 560, H = 320, padL = 60, padR = 20, padT = 20, padB = 60;
      var cW = W - padL - padR, cH = H - padT - padB;

      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:' + W + 'px;height:auto">';
      // Grid lines
      var gridCount = 5;
      for (var g = 0; g <= gridCount; g++) {
        var gy = padT + cH - (g / gridCount) * cH;
        var gVal = minVal + (g / gridCount) * (maxVal - minVal);
        svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="#f0f0f0" stroke-width="1"/>';
        svg += '<text x="' + (padL - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="rgba(0,0,0,0.45)">' + formatChartVal(gVal) + '</text>';
      }
      // Axes
      svg += '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (H - padB) + '" stroke="#d9d9d9" stroke-width="1"/>';
      svg += '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="#d9d9d9" stroke-width="1"/>';

      var type = chartConfig.type;
      if (type === 'bar') {
        var groupW = cW / xLabels.length;
        var barW = Math.max(4, Math.min(40, (groupW - 8) / series.length));
        for (var i = 0; i < xLabels.length; i++) {
          var gx = padL + i * groupW + groupW / 2;
          // X label
          svg += '<text x="' + gx + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.65)">' + truncLabel(xLabels[i], 10) + '</text>';
          for (var s = 0; s < series.length; s++) {
            var val = series[s].data[i];
            var barH = ((val - minVal) / (maxVal - minVal)) * cH;
            var bx = gx - (series.length * barW) / 2 + s * barW;
            var by = padT + cH - barH;
            svg += '<rect x="' + bx + '" y="' + by + '" width="' + barW + '" height="' + barH + '" fill="' + CHART_COLORS[s % CHART_COLORS.length] + '" rx="2" opacity="0.85"><title>' + escHtml(series[s].label) + ': ' + formatChartVal(val) + '</title></rect>';
          }
        }
      } else if (type === 'line') {
        for (var s = 0; s < series.length; s++) {
          var points = [];
          for (var i = 0; i < xLabels.length; i++) {
            var px = padL + (i / (xLabels.length - 1 || 1)) * cW;
            var py = padT + cH - ((series[s].data[i] - minVal) / (maxVal - minVal)) * cH;
            points.push(px + ',' + py);
          }
          svg += '<polyline points="' + points.join(' ') + '" fill="none" stroke="' + CHART_COLORS[s % CHART_COLORS.length] + '" stroke-width="2"/>';
          for (var i = 0; i < points.length; i++) {
            var pp = points[i].split(',');
            svg += '<circle cx="' + pp[0] + '" cy="' + pp[1] + '" r="3.5" fill="#fff" stroke="' + CHART_COLORS[s % CHART_COLORS.length] + '" stroke-width="2"><title>' + escHtml(series[s].label) + ': ' + formatChartVal(series[s].data[i]) + '</title></circle>';
          }
        }
        for (var i = 0; i < xLabels.length; i++) {
          var lx = padL + (i / (xLabels.length - 1 || 1)) * cW;
          svg += '<text x="' + lx + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.65)">' + truncLabel(xLabels[i], 10) + '</text>';
        }
      } else if (type === 'scatter') {
        for (var s = 0; s < series.length; s++) {
          for (var i = 0; i < xLabels.length; i++) {
            var px = padL + (i / (xLabels.length - 1 || 1)) * cW;
            var py = padT + cH - ((series[s].data[i] - minVal) / (maxVal - minVal)) * cH;
            svg += '<circle cx="' + px + '" cy="' + py + '" r="5" fill="' + CHART_COLORS[s % CHART_COLORS.length] + '" opacity="0.7"><title>' + escHtml(xLabels[i]) + ' → ' + escHtml(series[s].label) + ': ' + formatChartVal(series[s].data[i]) + '</title></circle>';
          }
        }
        for (var i = 0; i < xLabels.length; i++) {
          var lx = padL + (i / (xLabels.length - 1 || 1)) * cW;
          svg += '<text x="' + lx + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.65)">' + truncLabel(xLabels[i], 10) + '</text>';
        }
      } else if (type === 'area') {
        for (var s = 0; s < series.length; s++) {
          var pts = [];
          for (var i = 0; i < xLabels.length; i++) {
            var px = padL + (i / (xLabels.length - 1 || 1)) * cW;
            var py = padT + cH - ((series[s].data[i] - minVal) / (maxVal - minVal)) * cH;
            pts.push({ x: px, y: py });
          }
          var areaPath = 'M' + pts[0].x + ',' + pts[0].y;
          for (var i = 1; i < pts.length; i++) areaPath += 'L' + pts[i].x + ',' + pts[i].y;
          areaPath += 'L' + pts[pts.length - 1].x + ',' + (padT + cH) + 'L' + pts[0].x + ',' + (padT + cH) + 'Z';
          svg += '<path d="' + areaPath + '" fill="' + CHART_COLORS[s % CHART_COLORS.length] + '" opacity="0.15"/>';
          var linePts = pts.map(function(p) { return p.x + ',' + p.y; }).join(' ');
          svg += '<polyline points="' + linePts + '" fill="none" stroke="' + CHART_COLORS[s % CHART_COLORS.length] + '" stroke-width="2"/>';
        }
        for (var i = 0; i < xLabels.length; i++) {
          var lx = padL + (i / (xLabels.length - 1 || 1)) * cW;
          svg += '<text x="' + lx + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.65)">' + truncLabel(xLabels[i], 10) + '</text>';
        }
      }
      // Legend
      if (series.length > 1) {
        for (var s = 0; s < series.length; s++) {
          var lx = padL + s * 140;
          svg += '<rect x="' + lx + '" y="' + (H - 14) + '" width="10" height="10" rx="2" fill="' + CHART_COLORS[s % CHART_COLORS.length] + '"/>';
          svg += '<text x="' + (lx + 14) + '" y="' + (H - 5) + '" font-size="11" fill="rgba(0,0,0,0.65)">' + escHtml(series[s].label) + '</text>';
        }
      }
      svg += '</svg>';
      return svg;
    }

    function formatChartVal(v) {
      if (Math.abs(v) >= 1000000) return (v / 1000000).toFixed(1) + 'M';
      if (Math.abs(v) >= 1000) return (v / 1000).toFixed(1) + 'K';
      return Number(v.toFixed(2)).toString();
    }
    function truncLabel(s, max) { return s.length > max ? s.substring(0, max) + '..' : s; }

    function renderChartConfigPanel(result) {
      var numCols = getNumericColumns(result);
      var allCols = result.columns;
      var html = '';
      // Chart type
      html += '<div class="cc-section"><div class="cc-label">图表类型</div><div class="cc-type-grid">';
      var types = [
        { id:'bar', label:'柱状图', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="6" width="4" height="14" rx="1"/><rect x="17" y="9" width="4" height="11" rx="1"/></svg>' },
        { id:'line', label:'折线图', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 17 9 11 13 15 21 7"/><circle cx="9" cy="11" r="1.5" fill="currentColor"/><circle cx="13" cy="15" r="1.5" fill="currentColor"/><circle cx="21" cy="7" r="1.5" fill="currentColor"/></svg>' },
        { id:'scatter', label:'散点图', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="14" r="2" fill="currentColor"/><circle cx="12" cy="8" r="2" fill="currentColor"/><circle cx="17" cy="12" r="2" fill="currentColor"/><circle cx="9" cy="18" r="1.5" fill="currentColor"/><circle cx="19" cy="6" r="1.5" fill="currentColor"/></svg>' },
        { id:'area', label:'面积图', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 18L9 12L13 15L21 8V18H3Z" fill="currentColor" opacity="0.15"/><polyline points="3 18 9 12 13 15 21 8"/></svg>' }
      ];
      for (var t = 0; t < types.length; t++) {
        html += '<div class="cc-type-btn' + (chartConfig.type === types[t].id ? ' active' : '') + '" onclick="setChartType(\'' + types[t].id + '\')">' + types[t].icon + '<span>' + types[t].label + '</span></div>';
      }
      html += '</div></div>';
      // X axis
      html += '<div class="cc-section"><div class="cc-label">X 轴</div><select class="cc-select" onchange="setChartX(this.value)">';
      for (var i = 0; i < allCols.length; i++) {
        html += '<option value="' + escHtml(allCols[i]) + '"' + (chartConfig.xCol === allCols[i] ? ' selected' : '') + '>' + escHtml(allCols[i]) + '</option>';
      }
      html += '</select></div>';
      // Y axis series
      html += '<div class="cc-section"><div class="cc-label">Y 轴</div>';
      for (var s = 0; s < chartConfig.ySeries.length; s++) {
        html += '<div class="cc-y-row"><select class="cc-select" onchange="setChartYCol(' + s + ',this.value)">';
        for (var i = 0; i < numCols.length; i++) {
          html += '<option value="' + escHtml(numCols[i]) + '"' + (chartConfig.ySeries[s].col === numCols[i] ? ' selected' : '') + '>' + escHtml(numCols[i]) + '</option>';
        }
        html += '</select><select class="cc-select" style="width:80px;flex:none" onchange="setChartYAgg(' + s + ',this.value)">';
        var aggs = ['SUM','AVG','COUNT','MAX','MIN'];
        for (var a = 0; a < aggs.length; a++) {
          html += '<option' + (chartConfig.ySeries[s].agg === aggs[a] ? ' selected' : '') + '>' + aggs[a] + '</option>';
        }
        html += '</select>';
        if (chartConfig.ySeries.length > 1) {
          html += '<button class="cc-y-remove" onclick="removeChartY(' + s + ')">✕</button>';
        }
        html += '</div>';
      }
      if (numCols.length > 1) {
        html += '<div class="cc-add-y" onclick="addChartY()">+ 添加 Y 轴</div>';
      }
      html += '</div>';
      return html;
    }

    function renderChartView(result) {
      if (!result || !result.columns || result.columns.length === 0) {
        document.getElementById('resultBody').innerHTML = '<div class="chart-empty"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="8" y="32" width="10" height="20" rx="2"/><rect x="22" y="20" width="10" height="32" rx="2"/><rect x="36" y="26" width="10" height="26" rx="2"/><rect x="50" y="14" width="10" height="38" rx="2"/></svg><span>请先执行查询以生成图表</span></div>';
        return;
      }
      var html = '<div class="chart-container">';
      html += '<div class="chart-canvas-area" id="chartCanvas">' + renderChartSVG(result) + '</div>';
      html += '<div class="chart-config-panel" id="chartConfigPanel">' + renderChartConfigPanel(result) + '</div>';
      html += '</div>';
      document.getElementById('resultBody').innerHTML = html;
    }

    function setChartType(type) { chartConfig.type = type; if (lastResult) renderChartView(lastResult); }
    function setChartX(col) { chartConfig.xCol = col; if (lastResult) renderChartView(lastResult); }
    function setChartYCol(idx, col) { chartConfig.ySeries[idx].col = col; if (lastResult) renderChartView(lastResult); }
    function setChartYAgg(idx, agg) { chartConfig.ySeries[idx].agg = agg; if (lastResult) renderChartView(lastResult); }
    function addChartY() {
      var numCols = getNumericColumns(lastResult);
      var used = chartConfig.ySeries.map(function(s){return s.col;});
      var next = numCols.find(function(c){return used.indexOf(c)===-1;}) || numCols[0];
      chartConfig.ySeries.push({ col: next, agg: 'SUM' });
      if (lastResult) renderChartView(lastResult);
    }
    function removeChartY(idx) {
      if (chartConfig.ySeries.length <= 1) return;
      chartConfig.ySeries.splice(idx, 1);
      if (lastResult) renderChartView(lastResult);
    }

    function switchResultTab(tab, el) {
      document.querySelectorAll('.result-tab').forEach(function(t) { t.classList.remove('active'); });
      el.classList.add('active');
      activeResultTab = tab;
      if (lastResult) {
        if (tab === 'table') {
          renderResultTable(lastResult);
        } else {
          renderChartView(lastResult);
        }
      }
    }

    // ===== Result panel minimize / maximize =====
    var resultPanelState = 'normal'; // 'normal' | 'minimized' | 'maximized'
    var savedCodeH = null;
    var savedResultH = null;

    function toggleResultMinMax(action) {
      var ra = document.getElementById('resultArea');
      var codeWrap = document.getElementById('codeAreaWrap');
      var splitter = document.getElementById('hSplitter');

      if (action === 'min') {
        if (resultPanelState === 'minimized') {
          // Restore
          ra.classList.remove('minimized');
          ra.style.flex = '1';
          ra.style.height = '';
          codeWrap.style.flex = '1';
          codeWrap.style.height = '';
          splitter.style.display = '';
          resultPanelState = 'normal';
        } else {
          // Minimize
          if (resultPanelState === 'maximized') {
            ra.classList.remove('maximized');
          }
          ra.classList.add('minimized');
          ra.style.flex = 'none';
          codeWrap.style.flex = '1';
          codeWrap.style.height = '';
          splitter.style.display = 'none';
          resultPanelState = 'minimized';
        }
      } else if (action === 'max') {
        if (resultPanelState === 'maximized') {
          // Restore
          ra.classList.remove('maximized');
          ra.style.flex = '1';
          ra.style.height = '';
          codeWrap.style.flex = '1';
          codeWrap.style.height = '';
          splitter.style.display = '';
          resultPanelState = 'normal';
        } else {
          // Maximize
          if (resultPanelState === 'minimized') {
            ra.classList.remove('minimized');
          }
          ra.classList.add('maximized');
          ra.style.flex = 'none';
          codeWrap.style.flex = 'none';
          codeWrap.style.height = '0px';
          splitter.style.display = 'none';
          resultPanelState = 'maximized';
        }
      }
      updateMinMaxIcons();
    }

    function updateMinMaxIcons() {
      var btnMin = document.getElementById('btnMinResult');
      var btnMax = document.getElementById('btnMaxResult');
      btnMin.title = resultPanelState === 'minimized' ? '恢复' : '最小化';
      btnMax.title = resultPanelState === 'maximized' ? '恢复' : '最大化';
    }

    // ===== Download result as CSV =====
    function downloadResultCSV() {
      if (!lastResult) return;
      var csv = lastResult.columns.join(',') + '\n';
      for (var r = 0; r < lastResult.rows.length; r++) {
        var row = lastResult.rows[r].map(function(cell) {
          var s = String(cell);
          if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
            return '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        });
        csv += row.join(',') + '\n';
      }
      var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'query_result_' + new Date().toISOString().slice(0,19).replace(/[:-]/g,'') + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

    function loadWorkbooks() {
      try {
        var raw = localStorage.getItem('moi_sql_workbooks');
        if (raw) workbooks = JSON.parse(raw);
      } catch(e) {}
      var storedV = parseInt(localStorage.getItem('moi_sql_workbooks_v') || '0', 10);
      if (!workbooks || workbooks.length === 0) {
        workbooks = defaultWorkbooks();
      } else if (storedV < WB_VERSION) {
        // 版本升级：补齐缺失的示例工作簿（按 id），保留用户自建的
        defaultWorkbooks().forEach(function(ex) {
          if (!workbooks.some(function(w) { return w.id === ex.id; })) workbooks.push(ex);
        });
      }
      localStorage.setItem('moi_sql_workbooks_v', String(WB_VERSION));
      if (!activeWbId || !workbooks.find(function(w) { return w.id === activeWbId; })) {
        activeWbId = workbooks[0].id;
      }
      // 版本初始化：无版本的工作簿种一个正式版本作为基线（新建的工作簿首次编辑才生成草稿）
      workbooks.forEach(function(wb) {
        if (!wb.versions) wb.versions = [];
        if (wb.versions.length === 0) {
          var ts = Date.now();
          if (wb.createdAt) { var t = new Date(wb.createdAt).getTime(); if (!isNaN(t)) ts = t; }
          var v = { id: 'v_' + ts + '_' + (++verSeq), ts: ts, type: 'formal', sql: wb.sql || '' };
          wb.versions.push(v); wb.activeVer = v.id;
        } else if (!wb.activeVer || !wbActiveVersion(wb)) {
          wb.activeVer = wb.versions[wb.versions.length - 1].id;
        }
      });
      saveWorkbooks();
    }

    function saveWorkbooks() {
      localStorage.setItem('moi_sql_workbooks', JSON.stringify(workbooks));
    }

      for (var i = 0; i < workbooks.length; i++) {
        var wb = workbooks[i];
        if (search && wb.name.toLowerCase().indexOf(search) === -1) continue;
        var isActive = wb.id === activeWbId;

        html += '<div class="wb-item' + (isActive ? ' active' : '') + '" onclick="selectWorkbook(\'' + wb.id + '\')" data-wbid="' + wb.id + '">';

        if (canDelete) {

    function selectWorkbook(id) {

      loadWbContent();
      applyWbMode();
      renderWorkbooks();

      var wb = workbooks.find(function(w) { return w.id === activeWbId; });
      if (!wb || !wb.mode) return;
      if (wb.mode === 'external' && wb.extCatalog) {
        sqlMode = 'external';
        sqlExtCatalog = wb.extCatalog;

      if (wb) {
        wb.sql = document.getElementById('sqlTextarea').value;

    function addWorkbook() {
      var idx = workbooks.length + 1;
      var name = '工作簿 ' + idx;
      // Ensure unique name
      while (workbooks.some(function(w) { return w.name === name; })) {
        idx++;
        name = '工作簿 ' + idx;
      }
      var wb = { id: 'wb_' + Date.now(), name: name, sql: '', createdAt: new Date().toISOString(), versions: [], activeVer: null };
      workbooks.push(wb);
      saveWorkbooks();
      selectWorkbook(wb.id);

    // ===== 工作簿历史版本 =====
    function formatVerTs(ts) {
      var d = new Date(ts);
      function p(n) { return (n < 10 ? '0' : '') + n; }
      return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    function verLabel(v) { return formatVerTs(v.ts) + (v.type === 'draft' ? ' （草稿）' : ''); }
    function wbActiveVersion(wb) {
      if (!wb || !wb.versions) return null;
      for (var i = 0; i < wb.versions.length; i++) { if (wb.versions[i].id === wb.activeVer) return wb.versions[i]; }
      return null;
    }
    function wbTrimVersions(wb) {
      if (!wb.versions || wb.versions.length <= 25) return;
      wb.versions.sort(function(a, b) { return b.ts - a.ts; });
      var keep = wb.versions.slice(0, 25);
      if (wb.activeVer && !keep.some(function(v) { return v.id === wb.activeVer; })) {
        var av = wbActiveVersion(wb); if (av) keep.push(av);
      }
      wb.versions = keep;
    }
    // 编辑器内容变化：正式/初始 → 生成草稿；草稿 → 原地更新
    function wbOnEdit() {
      var wb = workbooks.find(function(w) { return w.id === activeWbId; });
      if (!wb) return;
      var content = document.getElementById('sqlTextarea').value;
      wb.sql = content;
      if (!wb.versions) wb.versions = [];
      var cur = wbActiveVersion(wb);
      if (!cur) {
        var d0 = { id: 'v_' + Date.now() + '_' + (++verSeq), ts: Date.now(), type: 'draft', sql: content };
        wb.versions.push(d0); wb.activeVer = d0.id; wbTrimVersions(wb); renderVersionDropdown(); saveWorkbooks(); return;
      }
      if (cur.type === 'formal') {
        if (content === cur.sql) return;
        var d = { id: 'v_' + Date.now() + '_' + (++verSeq), ts: Date.now(), type: 'draft', sql: content };
        wb.versions.push(d); wb.activeVer = d.id; wbTrimVersions(wb); renderVersionDropdown(); saveWorkbooks(); return;
      }
      cur.sql = content; // 草稿原地更新（3 秒自动保存负责落盘）
    }
    // 执行：当前草稿转正式（去草稿、时间戳更新为执行时间）；否则生成新正式版本
    function wbOnRun() {
      var wb = workbooks.find(function(w) { return w.id === activeWbId; });
      if (!wb) return;
      var content = document.getElementById('sqlTextarea').value;
      wb.sql = content;
      if (!wb.versions) wb.versions = [];
      var cur = wbActiveVersion(wb);
      if (cur && cur.type === 'draft') {
        cur.type = 'formal'; cur.ts = Date.now(); cur.sql = content;
      } else {
        var f = { id: 'v_' + Date.now() + '_' + (++verSeq), ts: Date.now(), type: 'formal', sql: content };
        wb.versions.push(f); wb.activeVer = f.id;
      }
      wbTrimVersions(wb); renderVersionDropdown(); saveWorkbooks();
    }
    function selectVersion(id) {
      var wb = workbooks.find(function(w) { return w.id === activeWbId; });
      if (!wb) return;
      var v = null;
      for (var i = 0; i < wb.versions.length; i++) { if (wb.versions[i].id === id) v = wb.versions[i]; }
      if (!v) return;
      wb.activeVer = id; wb.sql = v.sql;
      document.getElementById('sqlTextarea').value = v.sql;
      updateLineNumbers(); updateHighlight(); onSqlCursorMove();
      renderVersionDropdown(); saveWorkbooks();
      var dd = document.getElementById('verDropdown'); if (dd) dd.classList.remove('show');
    }
    function renderVersionDropdown() {
      var wb = workbooks.find(function(w) { return w.id === activeWbId; });
      var labelEl = document.getElementById('verCurLabel');
      if (!labelEl) return;
      var cur = wb ? wbActiveVersion(wb) : null;
      labelEl.textContent = cur ? verLabel(cur) : '初始（未保存）';
      var list = document.getElementById('verList');
      if (!list) return;
      var versions = (wb && wb.versions ? wb.versions : []).slice().sort(function(a, b) { return b.ts - a.ts; });
      if (!versions.length) { list.innerHTML = '<div class="ver-empty">暂无历史版本，编辑或执行后生成</div>'; return; }
      list.innerHTML = versions.map(function(v) {
        var active = v.id === wb.activeVer;
        return '<div class="ver-item' + (active ? ' active' : '') + '" onclick="selectVersion(\'' + v.id + '\')">'
          + '<span class="ver-dot ' + v.type + '"></span>'
          + '<span class="ver-name">' + verLabel(v) + '</span>'
          + (active ? '<span class="ver-check">✓</span>' : '') + '</div>';
      }).join('');
    }
    function toggleVersionDropdown(e) {
      if (e) e.stopPropagation();
      var dd = document.getElementById('verDropdown');
      if (!dd) return;
      var show = !dd.classList.contains('show');
      dd.classList.toggle('show', show);
      if (show) renderVersionDropdown();
    }
    document.addEventListener('click', function(e) {
      var sel = document.getElementById('verSelector');
      var dd = document.getElementById('verDropdown');
      if (dd && dd.classList.contains('show') && sel && !sel.contains(e.target)) dd.classList.remove('show');
    });

    function deleteWorkbook(id) {
      if (workbooks.length <= 1) return;
      if (!confirm('确定删除该工作簿？')) return;
      var idx = workbooks.findIndex(function(w) { return w.id === id; });
      if (idx === -1) return;
      workbooks.splice(idx, 1);
      if (activeWbId === id) {
        activeWbId = workbooks[0].id;
        loadWbContent();
      }
      saveWorkbooks();
      renderWorkbooks();
    }

    function startRenameWb(id) {
      renamingWbId = id;
      renderWorkbooks();
    }

    function confirmRenameWb(id) {
      var inp = document.getElementById('wbRenameInput');
      if (!inp) { renamingWbId = null; return; }
      var newName = inp.value.trim();
      if (newName) {
        var wb = workbooks.find(function(w) { return w.id === id; });
        if (wb) { wb.name = newName; saveWorkbooks(); }
      }
      renamingWbId = null;
      renderWorkbooks();
    }

    function onWbRenameKey(e, id) {
      if (e.key === 'Enter') { e.target.blur(); }
      if (e.key === 'Escape') { renamingWbId = null; renderWorkbooks(); }
    }

    // Auto-save workbook content periodically
    setInterval(function() { saveCurrentWbContent(); }, 3000);

    // ===== Init =====
    loadWorkbooks();
    loadDbTree();
    renderSqlModeUI();
    updateSqlSyntaxBadge();
    renderDbTree();
    renderDbSelector();
    applyWbMode();
    renderWorkbooks();
    loadWbContent();
    updateLineNumbers();
    // Expand first db by default
    if (DB_TREE.length > 0) {
      expandedDbs.add(DB_TREE[0].name);
      renderDbTree();
    }
    onSqlInput();
  </script>
</body>
</html>
