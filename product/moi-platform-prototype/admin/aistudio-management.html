<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOI - 管理后台 · AI Studio 管理</title>
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <style>
    /* 模型服务页专用 */
    .btn-secondary { background: #fff; color: rgba(0,0,0,0.65); border: 1px solid #d9d9d9; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .btn-secondary:hover { border-color: #722ed1; color: #722ed1; }

    .ms-site-bar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .ms-site-bar label { font-size: 13px; color: rgba(0,0,0,0.55); white-space: nowrap; }
    .ms-site-select { height: 34px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; background: #fff; outline: none; cursor: pointer; min-width: 220px; }
    .ms-site-select:focus { border-color: #1677ff; }

    .ms-info-bar { display: flex; align-items: flex-start; gap: 8px; background: #e6f4ff; border: 1px solid #91caff; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: #0958d9; line-height: 1.7; margin-bottom: 16px; }
    .ms-info-bar svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 3px; }

    .ms-model-chip { display: inline-flex; align-items: center; gap: 5px; background: #f5f5f5; border: 1px solid #e8e8e8; border-radius: 5px; padding: 2px 9px; font-size: 12px; color: rgba(0,0,0,0.65); margin: 2px 4px 2px 0; white-space: nowrap; }
    .ms-model-chip.def { background: #e6f4ff; border-color: #91caff; color: #0958d9; font-weight: 500; }
    .ms-model-chip .star { color: #1677ff; font-size: 11px; }

    .ms-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
    .ms-badge.on { background: rgba(82,196,26,0.1); color: #389e0d; }
    .ms-badge.off { background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.45); }

    .ms-slot-name { font-weight: 600; color: rgba(0,0,0,0.88); font-size: 13.5px; }
    .ms-slot-desc { font-size: 12px; color: rgba(0,0,0,0.4); margin-top: 2px; }
    .ms-type-tag { font-size: 12px; color: rgba(0,0,0,0.55); background: #fafafa; border: 1px solid #f0f0f0; border-radius: 4px; padding: 1px 8px; white-space: nowrap; }

    .ms-section-title { font-size: 15px; font-weight: 600; color: rgba(0,0,0,0.88); margin: 28px 0 4px; display: flex; align-items: center; gap: 8px; }
    .ms-section-title svg { width: 16px; height: 16px; color: #722ed1; }

    /* 弹窗 */
    .ms-modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 500; align-items: center; justify-content: center; }
    .ms-modal-overlay.show { display: flex; }
    .ms-modal { background: #fff; border-radius: 12px; width: 560px; max-height: 86vh; box-shadow: 0 6px 30px rgba(0,0,0,0.12); display: flex; flex-direction: column; }
    .ms-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 26px 14px; border-bottom: 1px solid #f0f0f0; }
    .ms-modal-header h3 { font-size: 16px; font-weight: 600; margin: 0; }
    .ms-modal-close { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; font-size: 17px; color: rgba(0,0,0,0.45); }
    .ms-modal-close:hover { background: rgba(0,0,0,0.04); }
    .ms-modal-body { padding: 18px 26px; overflow-y: auto; flex: 1; }
    .ms-modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 26px; border-top: 1px solid #f0f0f0; }
    .ms-modal-hint { font-size: 12.5px; color: rgba(0,0,0,0.45); line-height: 1.7; margin-bottom: 12px; }

    /* 模型选择器(借鉴 Genesis:搜索 + 滚动列表) */
    .ms-picker-search { width: 100%; height: 32px; padding: 0 11px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 12.5px; outline: none; margin-bottom: 8px; box-sizing: border-box; }
    .ms-picker-search:focus { border-color: #722ed1; box-shadow: 0 0 0 2px rgba(114,46,209,0.08); }
    .ms-model-list { max-height: 300px; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 8px; }
    .ms-mrow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: background 0.1s; }
    .ms-mrow:last-child { border-bottom: none; }
    .ms-mrow:hover { background: #fafafa; }
    .ms-mrow.checked { background: #f0f7ff; }
    .ms-mrow input { accent-color: #1677ff; width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; pointer-events: none; }
    .ms-mrow .nm { font-size: 13px; color: rgba(0,0,0,0.85); flex: 1; }
    .ms-mrow.checked .nm { color: #0958d9; font-weight: 500; }
    .ms-mrow .src { font-size: 10.5px; color: rgba(0,0,0,0.4); background: #f0f0f0; padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
    .ms-empty { padding: 22px; text-align: center; font-size: 12.5px; color: rgba(0,0,0,0.3); }
    .ms-def-label { font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.88); margin: 16px 0 8px; }
    .ms-def-area .ms-mrow { border: 1px solid #f0f0f0; border-radius: 8px; margin-bottom: 4px; }
    .ms-def-area .ms-mrow.checked { border-color: #91caff; }

    .ms-log-table td { font-size: 12.5px !important; padding: 9px 14px !important; }
    .ms-arrow { color: rgba(0,0,0,0.3); margin: 0 6px; }
    .ms-toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(30,32,38,0.88); color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 8px; z-index: 999; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
    .ms-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="admin-layout">
    <div class="admin-sidebar" id="adminSidebar"></div>
    <div class="admin-main">

      <!-- ========== Panel: 模型服务 ========== -->
      <div id="asPanel-models" style="display:none">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:20px">
          <div>
            <div class="admin-page-title">模型服务</div>
            <div class="admin-page-desc" style="margin-bottom:0">AI Studio 各项 AI 服务背后的模型配置——从 Genesis 已接入模型中选择;按服务站点生效</div>
          </div>
          <div class="ms-site-bar">
            <label>服务站点</label>
            <select class="ms-site-select" id="msSiteSelect" onchange="msSwitchSite(this.value)">
              <option value="aliyun">阿里云(中国 · 国内主站)</option>
              <option value="tencent">腾讯云(中国)</option>
              <option value="v2">Virtual Vision(沙特阿拉伯)</option>
              <option value="1stack">1Stack(马来西亚 · 新加坡)</option>
            </select>
          </div>
        </div>

        <div class="ms-info-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg>
          <div>AI 服务按统一单价计费(500 cr / 百万 token),更换模型不影响用户价格。前台行为:「不可见」= 用户无模型概念,后台多选一;「可选」= 用户在此处配置的模型中选择。</div>
        </div>

        <table class="admin-table" style="table-layout:fixed">
          <thead><tr>
            <th style="width:27%">AI 服务</th>
            <th style="width:11%">模型类型</th>
            <th>模型名称(★ 默认)</th>
            <th style="width:9%">前台行为</th>
            <th style="width:8%">操作</th>
          </tr></thead>
          <tbody id="msSlotBody"></tbody>
        </table>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:26px">
          <div class="ms-section-title" style="margin:0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
            最近变更
          </div>
          <span style="font-size:12px;color:rgba(0,0,0,0.4)">模型服务的全部配置变更自动记录,用于效果突变时回溯排查</span>
        </div>
        <table class="admin-table ms-log-table" style="margin-top:10px">
          <thead><tr><th style="width:150px">时间</th><th style="width:100px">操作人</th><th style="width:170px">站点</th><th style="width:190px">AI 服务</th><th>变更内容</th></tr></thead>
          <tbody id="msLogBody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- AI 服务配置弹窗 -->
  <div class="ms-modal-overlay" id="msSlotModal">
    <div class="ms-modal">
      <div class="ms-modal-header"><h3 id="msSlotModalTitle">配置 AI 服务</h3><button class="ms-modal-close" onclick="msCloseSlotModal()">✕</button></div>
      <div class="ms-modal-body" id="msSlotModalBody"></div>
      <div class="ms-modal-footer">
        <button class="btn-secondary" style="padding:7px 18px;font-size:13px" onclick="msCloseSlotModal()">取消</button>
        <button class="btn-primary" style="padding:7px 18px;font-size:13px" onclick="msSaveSlot()">保存</button>
      </div>
    </div>
  </div>

  <div class="ms-toast" id="msToast"></div>

  <script src="../scripts/common.js"></script>
  <script src="../scripts/admin-common.js"></script>
  <script>
    // ===== Genesis 已接入模型(按模型类型;各站点接入清单不同)=====
    var GENESIS_POOLS = {
      cn: {
        '对话(文本)': ['qwen-max', 'qwen-plus', 'qwen-turbo', 'qwen-long', 'deepseek-v3', 'deepseek-r1', 'glm-4.5', 'glm-4-air', 'moonshot-v1-8k', 'moonshot-v1-32k', 'moonshot-v1-128k', 'baichuan4', 'baichuan3-turbo', 'yi-large', 'yi-lightning', 'minimax-abab7', 'minimax-abab6.5s', 'ernie-4.5', 'hunyuan-large', 'spark-4.0-ultra'],
        '对话(多模态)': ['qwen-vl-plus', 'qwen-vl-max', 'glm-4v', 'glm-4v-plus', 'step-1v', 'moonshot-v1-vision', 'hunyuan-vision', 'yi-vision'],
        '向量': ['bge-m3', 'text-embedding-v3', 'text-embedding-v2', 'm3e-large', 'gte-large-zh', 'bce-embedding-base', 'conan-embedding'],
        '多模态向量': ['efficientnet-b3', 'chinese-clip', 'bge-visualized', 'cn-clip-vit-l'],
        '重排': ['bge-reranker-v2', 'gte-rerank', 'bce-reranker-base', 'conan-reranker']
      },
      sea: {
        '对话(文本)': ['llama-3.1-70b', 'llama-3.1-8b', 'claude-sonnet', 'claude-haiku', 'gpt-4.1', 'gpt-4.1-mini', 'mistral-large', 'mistral-small', 'sea-lion-v3', 'gemma-2-27b', 'qwen-max'],
        '对话(多模态)': ['gpt-4.1', 'claude-sonnet', 'qwen-vl-plus', 'llama-3.2-90b-vision'],
        '向量': ['multilingual-e5-large', 'bge-m3', 'text-embedding-3-large', 'text-embedding-3-small', 'cohere-embed-v3'],
        '多模态向量': ['efficientnet-b3', 'siglip-large', 'cohere-embed-v3-multimodal'],
        '重排': ['bge-reranker-v2', 'cohere-rerank-v3', 'voyage-rerank-2']
      }
    };

    // ===== 站点级配置:每项 AI 服务 = 生效模型(不可见:单个;可选:多个 + 默认)=====
    function makeSlots(d) {
      return [
        { id: 'parse', name: '文档解析(VLM · OCR)', desc: '文件解析、版面识别、图表理解', type: '对话(多模态)', models: [d.parse], def: d.parse, front: 'hidden' },
        { id: 'embed-text', name: '文本 Embedding', desc: '知识库 / Catalog 向量索引', type: '向量', models: [d.embedText], def: d.embedText, front: 'hidden' },
        { id: 'embed-img', name: '图片 Embedding', desc: '知识库图文检索(以图搜图)', type: '多模态向量', models: [d.embedImg], def: d.embedImg, front: 'hidden' },
        { id: 'rerank', name: 'Rerank 重排', desc: '知识库检索结果重排序', type: '重排', models: [d.rerank], def: d.rerank, front: 'hidden' },
        { id: 'nl2sql', name: 'NL2SQL(数据看板 · 知识库问答)', desc: '自然语言生成 SQL:数据看板图表定义、知识库结构化问答', type: '对话(文本)', models: [d.nl2sql], def: d.nl2sql, front: 'hidden' },
        { id: 'kbqa', name: '知识库问答', desc: '问答解析、RAG 检索生成、最终结果整合共用一个模型;用户从配置的模型中选择', type: '对话(文本)', models: d.kbqaModels.slice(), def: d.kbqaDef, front: 'selectable' },
        { id: 'agent-chat', name: '智能体对话', desc: '智能体主对话模型;用户从此处配置的模型中选择', type: '对话(文本)', models: d.agentModels.slice(), def: d.agentDef, front: 'selectable' }
      ];
    }

    var SITE_CONFIGS = {
      aliyun: { label: '阿里云(国内主站)', pool: 'cn', slots: makeSlots({ parse: 'qwen-vl-plus', embedText: 'bge-m3', embedImg: 'efficientnet-b3', rerank: 'bge-reranker-v2', nl2sql: 'qwen-max', kbqaModels: ['qwen-plus', 'qwen-max', 'deepseek-v3'], kbqaDef: 'qwen-plus', agentModels: ['qwen-max', 'deepseek-v3', 'qwen-plus', 'glm-4.5'], agentDef: 'qwen-max' }) },
      tencent: { label: '腾讯云(中国)', pool: 'cn', slots: makeSlots({ parse: 'qwen-vl-plus', embedText: 'bge-m3', embedImg: 'efficientnet-b3', rerank: 'bge-reranker-v2', nl2sql: 'qwen-max', kbqaModels: ['qwen-plus', 'hunyuan-large'], kbqaDef: 'qwen-plus', agentModels: ['qwen-max', 'deepseek-v3', 'hunyuan-large'], agentDef: 'qwen-max' }) },
      v2: { label: 'Virtual Vision(沙特阿拉伯)', pool: 'sea', slots: makeSlots({ parse: 'gpt-4.1', embedText: 'multilingual-e5-large', embedImg: 'efficientnet-b3', rerank: 'bge-reranker-v2', nl2sql: 'llama-3.1-70b', kbqaModels: ['claude-sonnet', 'llama-3.1-70b'], kbqaDef: 'claude-sonnet', agentModels: ['claude-sonnet', 'gpt-4.1', 'llama-3.1-70b'], agentDef: 'claude-sonnet' }) },
      '1stack': { label: '1Stack(马来西亚 · 新加坡)', pool: 'sea', slots: makeSlots({ parse: 'gpt-4.1', embedText: 'multilingual-e5-large', embedImg: 'efficientnet-b3', rerank: 'cohere-rerank-v3', nl2sql: 'llama-3.1-70b', kbqaModels: ['claude-sonnet', 'llama-3.1-70b', 'sea-lion-v3'], kbqaDef: 'claude-sonnet', agentModels: ['claude-sonnet', 'gpt-4.1', 'llama-3.1-70b', 'sea-lion-v3'], agentDef: 'claude-sonnet' }) }
    };

    var MS_LOGS = [
      { time: '2026-08-11 15:20', who: 'admin', site: '1Stack(马来西亚 · 新加坡)', slot: '智能体对话', change: '开放模型 + sea-lion-v3' },
      { time: '2026-08-10 11:02', who: 'admin', site: '1Stack(马来西亚 · 新加坡)', slot: '知识库问答', change: '默认模型 llama-3.1-70b <span class="ms-arrow">→</span> claude-sonnet' },
      { time: '2026-07-22 09:40', who: 'ops-chen', site: '阿里云(国内主站)', slot: 'NL2SQL(数据看板 · 知识库问答)', change: '模型 qwen-plus <span class="ms-arrow">→</span> qwen-max' }
    ];

    var msCurSite = 'aliyun';

    function msEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
    function msToast(t) { var el = document.getElementById('msToast'); el.textContent = t; el.classList.add('show'); setTimeout(function() { el.classList.remove('show'); }, 2200); }

    function msSwitchSite(site) { msCurSite = site; msRenderSlots(); }

    function msRenderSlots() {
      var cfg = SITE_CONFIGS[msCurSite];
      var html = '';
      cfg.slots.forEach(function(s, i) {
        var chips = s.front === 'selectable'
          ? s.models.map(function(m) {
              return '<span class="ms-model-chip' + (m === s.def ? ' def' : '') + '">' + (m === s.def ? '<span class="star">★</span>' : '') + msEsc(m) + '</span>';
            }).join('')
          : '<span class="ms-model-chip def">' + msEsc(s.def) + '</span>';
        var front = s.front === 'selectable'
          ? '<span class="ms-badge on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="width:11px;height:11px"><path d="M20 6L9 17l-5-5"/></svg>可选</span>'
          : '<span class="ms-badge off">不可见</span>';
        html += '<tr>'
          + '<td><div class="ms-slot-name">' + msEsc(s.name) + '</div><div class="ms-slot-desc">' + msEsc(s.desc) + '</div></td>'
          + '<td><span class="ms-type-tag">' + msEsc(s.type) + '</span></td>'
          + '<td>' + chips + '</td>'
          + '<td>' + front + '</td>'
          + '<td><button class="btn-secondary" style="padding:4px 12px;font-size:12px" onclick="msOpenSlotModal(' + i + ')">配置</button></td>'
          + '</tr>';
      });
      document.getElementById('msSlotBody').innerHTML = html;
    }

    function msRenderLogs() {
      document.getElementById('msLogBody').innerHTML = MS_LOGS.map(function(l) {
        return '<tr><td>' + l.time + '</td><td>' + msEsc(l.who) + '</td><td>' + msEsc(l.site) + '</td><td>' + msEsc(l.slot) + '</td><td>' + l.change + '</td></tr>';
      }).join('');
    }

    // ===== 配置弹窗:可搜索模型选择器(借鉴 Genesis 模型选择) =====
    // 状态独立存放,搜索过滤重渲染列表时勾选不丢
    var msModal = { idx: null, mode: 'single', q: '', pool: [], pick: '', picked: [], def: '' };

    function msOpenSlotModal(idx) {
      var cfg = SITE_CONFIGS[msCurSite];
      var s = cfg.slots[idx];
      var pool = (GENESIS_POOLS[cfg.pool][s.type] || []).slice();
      s.models.forEach(function(m) { if (pool.indexOf(m) < 0) pool.push(m); }); // 生效中但已不在清单的模型仍列出

      msModal = {
        idx: idx,
        mode: s.front === 'selectable' ? 'multi' : 'single',
        q: '', pool: pool,
        pick: s.def,
        picked: s.models.slice(),
        def: s.def
      };

      document.getElementById('msSlotModalTitle').textContent = '配置 AI 服务:' + s.name;
      var hint = msModal.mode === 'multi'
        ? '勾选开放给用户的模型(用户在前台从中多选一);再指定默认——未选择时的缺省。模型来自 Genesis 已接入清单(' + msEsc(s.type) + ',共 ' + pool.length + ' 个)。'
        : '该服务对用户不可见,后台多选一:从 Genesis 已接入清单(' + msEsc(s.type) + ',共 ' + pool.length + ' 个)中选定一个生效模型。';

      document.getElementById('msSlotModalBody').innerHTML =
        '<div class="ms-modal-hint">' + hint + '</div>'
        + '<input class="ms-picker-search" placeholder="搜索模型名称 · 共 ' + pool.length + ' 个" oninput="msModal.q=this.value;msModalRenderList()">'
        + '<div class="ms-model-list" id="msModelList"></div>'
        + (msModal.mode === 'multi' ? '<div class="ms-def-label">默认模型 <span style="font-weight:400;font-size:12px;color:rgba(0,0,0,0.4)">从已勾选中指定</span></div><div class="ms-def-area" id="msDefArea"></div>' : '');

      msModalRenderList();
      if (msModal.mode === 'multi') msModalRenderDef();
      document.getElementById('msSlotModal').classList.add('show');
    }

    function msModalRenderList() {
      var q = msModal.q.trim().toLowerCase();
      var list = msModal.pool.filter(function(m) { return !q || m.toLowerCase().indexOf(q) >= 0; });
      var html = list.map(function(m) {
        var on = msModal.mode === 'multi' ? msModal.picked.indexOf(m) >= 0 : msModal.pick === m;
        var input = msModal.mode === 'multi'
          ? '<input type="checkbox"' + (on ? ' checked' : '') + '>'
          : '<input type="radio"' + (on ? ' checked' : '') + '>';
        return '<div class="ms-mrow' + (on ? ' checked' : '') + '" onclick="msModalHit(\'' + msEsc(m).replace(/'/g, "\\'") + '\')">'
          + input + '<span class="nm">' + msEsc(m) + '</span><span class="src">Genesis</span></div>';
      }).join('');
      document.getElementById('msModelList').innerHTML = html || '<div class="ms-empty">无匹配模型</div>';
    }

    function msModalHit(m) {
      if (msModal.mode === 'single') {
        msModal.pick = m;
      } else {
        var i = msModal.picked.indexOf(m);
        if (i >= 0) msModal.picked.splice(i, 1); else msModal.picked.push(m);
        if (msModal.picked.indexOf(msModal.def) < 0) msModal.def = msModal.picked[0] || '';
        msModalRenderDef();
      }
      msModalRenderList();
    }

    function msModalRenderDef() {
      var area = document.getElementById('msDefArea');
      if (!area) return;
      area.innerHTML = msModal.picked.map(function(m) {
        var on = m === msModal.def;
        return '<div class="ms-mrow' + (on ? ' checked' : '') + '" onclick="msModal.def=\'' + msEsc(m).replace(/'/g, "\\'") + '\';msModalRenderDef()">'
          + '<input type="radio"' + (on ? ' checked' : '') + '><span class="nm">' + msEsc(m) + '</span></div>';
      }).join('') || '<div style="font-size:12.5px;color:rgba(0,0,0,0.35);padding:4px 2px">先在上方勾选至少一个模型</div>';
    }

    function msCloseSlotModal() { document.getElementById('msSlotModal').classList.remove('show'); msModal.idx = null; }

    function msSaveSlot() {
      var cfg = SITE_CONFIGS[msCurSite];
      var s = cfg.slots[msModal.idx];
      var oldDef = s.def, oldModels = s.models.slice();

      if (msModal.mode === 'multi') {
        if (!msModal.picked.length) { msToast('至少开放 1 个模型'); return; }
        s.models = msModal.picked.slice();
        s.def = msModal.picked.indexOf(msModal.def) >= 0 ? msModal.def : msModal.picked[0];
      } else {
        if (!msModal.pick) { msToast('请选择一个模型'); return; }
        s.models = [msModal.pick];
        s.def = msModal.pick;
      }

      if (oldDef !== s.def) {
        MS_LOGS.unshift({ time: '2026-08-12 18:30', who: 'admin', site: cfg.label, slot: s.name, change: (msModal.mode === 'multi' ? '默认模型 ' : '模型 ') + msEsc(oldDef) + ' <span class="ms-arrow">→</span> ' + msEsc(s.def) });
      } else if (oldModels.join() !== s.models.join()) {
        MS_LOGS.unshift({ time: '2026-08-12 18:30', who: 'admin', site: cfg.label, slot: s.name, change: '更新开放模型清单' });
      }
      msRenderSlots(); msRenderLogs(); msCloseSlotModal();
      msToast('已保存');
    }

    // ===== Panel 路由(与其他管理页同款 hash 模式)=====
    function showAsPanel(hash) {
      var panels = ['models'];
      var target = panels.indexOf(hash) >= 0 ? hash : 'models';
      panels.forEach(function(p) { document.getElementById('asPanel-' + p).style.display = (p === target) ? '' : 'none'; });
      document.querySelectorAll('.admin-nav-child').forEach(function(c) {
        c.classList.toggle('active', c.getAttribute('href').indexOf('#' + target) >= 0);
      });
    }
    window.addEventListener('hashchange', function() { showAsPanel(window.location.hash.replace('#', '')); });

    showAsPanel(window.location.hash.replace('#', '') || 'models');
    msRenderSlots(); msRenderLogs();
  </script>
</body>
</html>
