<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - MOI MOI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --brand: #004af0; --brand-d: #0040d0; --ink: #142140; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased; background: #fff; min-height: 100vh; color: var(--ink);
    }
    a { text-decoration: none; }

    /* ===== 等宽左右分栏 ===== */
    .auth-layout { display: flex; min-height: 100vh; }
    .auth-brand, .auth-form-panel { flex: 1 1 50%; min-width: 0; }

    /* 左：品牌视觉栏（与登录页一致） */
    .auth-brand {
      position: relative; overflow: hidden; color: #fff;
      background:
        radial-gradient(56% 52% at 70% 44%, rgba(124,98,238,0.50) 0%, rgba(124,98,238,0) 62%),
        linear-gradient(46deg, #1c3ab4 0%, #18265f 46%, #141b4c 100%);
      display: flex; flex-direction: column; justify-content: center; padding: 60px;
    }
    .brand-logo { position: absolute; top: 46px; left: 60px; z-index: 3; }
    .brand-logo img { height: 28px; filter: brightness(0) invert(1); }
    .brand-mid { max-width: 490px; position: relative; z-index: 2; }
    .brand-eyebrow { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.78); letter-spacing: 1px; }
    .brand-title { font-size: 42px; font-weight: 700; line-height: 1.24; margin-top: 18px; letter-spacing: 1px; }
    .brand-title .grad { background: linear-gradient(92deg, #7ab4ff 0%, #66e6e2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand-sub { font-size: 15px; line-height: 1.9; color: rgba(255,255,255,0.74); margin-top: 22px; max-width: 480px; }
    .brand-checks { list-style: none; margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
    .brand-checks li { display: flex; align-items: center; gap: 13px; font-size: 14.5px; color: rgba(255,255,255,0.9); }
    .ck { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(38,209,160,0.15); border: 1px solid rgba(38,209,160,0.32); }
    .ck svg { width: 15px; height: 15px; color: #2bd6a4; }
    .brand-pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 15px; border-radius: 20px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.86); }
    .pill i { width: 5px; height: 5px; border-radius: 50%; background: #5ba6ff; box-shadow: 0 0 8px rgba(91,166,255,0.85); }
    .brand-bottom { position: absolute; left: 60px; right: 60px; bottom: 46px; z-index: 2; }
    .brand-divider { height: 1px; background: rgba(255,255,255,0.13); margin-bottom: 18px; }
    .brand-tag { font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }

    /* 右：注册表单栏 */
    .auth-form-panel { background: #fff; display: flex; align-items: center; justify-content: center; padding: 40px 32px; }
    .reg-card { width: 100%; max-width: 400px; }
    .form-head { margin-bottom: 24px; }
    .form-head h2 { font-size: 24px; font-weight: 600; letter-spacing: 0.3px; }
    .form-head p { font-size: 14px; color: rgba(0,0,0,0.45); margin-top: 7px; }

    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 14px; }
    .form-row .form-group { flex: 1; }
    .form-label { font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.62); margin-bottom: 7px; display: block; }
    .form-input {
      width: 100%; height: 46px; padding: 0 14px; border: 1.5px solid #e3e6ec; border-radius: 10px;
      font-size: 14px; color: rgba(0,0,0,0.88); outline: none; background: #fafbfc;
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s; font-family: inherit;
    }
    .form-input:hover { border-color: #c8cdd6; }
    .form-input:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px rgba(0,74,240,0.10); }
    .form-input::placeholder { color: rgba(0,0,0,0.28); }
    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 42px; }
    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      border: none; background: none; cursor: pointer; color: #aeb4bf; padding: 4px; display: flex; align-items: center;
    }
    .pwd-toggle svg { width: 18px; height: 18px; }
    .pwd-toggle:hover { color: rgba(0,0,0,0.5); }
    .pwd-hint { font-size: 11.5px; color: rgba(0,0,0,0.38); margin-top: 6px; line-height: 1.5; }

    .agreement { display: flex; align-items: flex-start; gap: 9px; margin: 18px 0 20px; }
    .agreement input[type="checkbox"] { margin-top: 2px; width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; flex-shrink: 0; }
    .agreement-text { font-size: 12.5px; color: rgba(0,0,0,0.5); line-height: 1.6; }
    .agreement-text a { color: var(--brand); }
    .agreement-text a:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%; height: 46px; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; border: none; color: #fff; transition: transform 0.15s, box-shadow 0.2s;
      background: linear-gradient(135deg, #0a52ff, #003ed6); box-shadow: 0 6px 18px rgba(0,74,240,0.26);
    }
    .btn-submit:hover { box-shadow: 0 8px 22px rgba(0,74,240,0.34); transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    .error-msg { font-size: 12.5px; color: #ff4d4f; margin-bottom: 12px; display: none; align-items: center; gap: 6px; }
    .error-msg.show { display: flex; }
    .error-msg svg { width: 14px; height: 14px; flex-shrink: 0; }

    .login-footer { text-align: center; margin-top: 22px; font-size: 13px; color: rgba(0,0,0,0.42); }
    .login-footer a { color: var(--brand); font-weight: 500; }
    .login-footer a:hover { text-decoration: underline; }

    @media (max-width: 920px) {
      .auth-brand { display: none; }
      .auth-form-panel { flex: 1 1 100%; }
    }
  </style>
</head>
<body>

  <div class="auth-layout">
    <!-- 左：品牌视觉栏（与登录页一致） -->
    <div class="auth-brand">
      <div class="brand-logo" role="img" aria-label="MatrixOne Intelligence"><img src="../images/logo-moi.svg" alt="MatrixOne Intelligence"></div>
      <div class="brand-mid">
        <div class="brand-eyebrow">数据 · 模型 · 智能体</div>
        <h1 class="brand-title">从原始数据<br><span class="grad">到生产级 AI</span></h1>
        <p class="brand-sub">面向 AI Agent 的数据基础设施平台——将数据、模型与智能体统一在同一个底座之上，运行在您可掌控的基础设施之中。</p>
        <ul class="brand-checks">
          <li><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>智能体 · 模型 · 数据，统一在同一底座</li>
          <li><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>企业数据沉淀为 AI 就绪的数据资产</li>
          <li><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>领域知识转化为可检索、可调用的智能</li>
          <li><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>持续自我优化的数据飞轮</li>
        </ul>
        <div class="brand-pills">
          <span class="pill"><i></i>一体化</span>
          <span class="pill"><i></i>多模态</span>
          <span class="pill"><i></i>AI 原生</span>
          <span class="pill"><i></i>存算分离</span>
          <span class="pill"><i></i>安全可信</span>
        </div>
      </div>
      <div class="brand-bottom">
        <div class="brand-divider"></div>
        <div class="brand-tag">以数生智 · 以智驭数</div>
      </div>
    </div>

    <!-- 右：注册表单栏 -->
    <div class="auth-form-panel">
      <div class="reg-card">

        <div class="form-head">
          <h2>创建账号</h2>
          <p>注册 MOI 账号，开启您的数据智能之旅</p>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">姓</label>
            <input class="form-input" id="regLastName" type="text" placeholder="请输入您的姓">
          </div>
          <div class="form-group">
            <label class="form-label">名</label>
            <input class="form-input" id="regFirstName" type="text" placeholder="请输入您的名">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">公司</label>
          <input class="form-input" id="regCompany" type="text" placeholder="请输入您的公司名称">
        </div>

        <div class="form-group">
          <label class="form-label">邮箱地址</label>
          <input class="form-input" id="regEmail" type="email" placeholder="请填写有效的邮箱地址">
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="pwd-wrap">
            <input class="form-input" id="regPassword" type="password" placeholder="请设置登录密码">
            <button class="pwd-toggle" onclick="togglePwd('regPassword',this)" aria-label="显示密码"></button>
          </div>
          <div class="pwd-hint">至少 8 位，且包含数字、大写字母、小写字母</div>
        </div>

        <div class="form-group">
          <label class="form-label">确认密码</label>
          <div class="pwd-wrap">
            <input class="form-input" id="regConfirm" type="password" placeholder="请再次输入密码">
            <button class="pwd-toggle" onclick="togglePwd('regConfirm',this)" aria-label="显示密码"></button>
          </div>
        </div>

        <div class="agreement">
          <input type="checkbox" id="regAgree">
          <span class="agreement-text">我已阅读并同意<a href="#">《隐私政策》</a>和<a href="#">《服务条款》</a></span>
        </div>

        <div class="error-msg" id="regError"></div>

        <button class="btn-submit" onclick="handleRegister()">注册</button>

        <div class="login-footer">已有账号？<a href="login.html">立即登录</a></div>
      </div>
    </div>
  </div>

  <script>
    var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
    document.querySelectorAll('.pwd-toggle').forEach(function(b){ b.innerHTML = EYE; });

    function togglePwd(id, btn) {
      var input = document.getElementById(id);
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF : EYE;
    }

    function showError(msg) {
      var el = document.getElementById('regError');
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>' + msg;
      el.classList.add('show');
    }
    function hideError() { document.getElementById('regError').classList.remove('show'); }

    function handleRegister() {
      hideError();
      var lastName = document.getElementById('regLastName').value.trim();
      var firstName = document.getElementById('regFirstName').value.trim();
      var company = document.getElementById('regCompany').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var pwd = document.getElementById('regPassword').value;
      var confirm = document.getElementById('regConfirm').value;
      var agreed = document.getElementById('regAgree').checked;

      if (!lastName) { showError('请输入姓'); return; }
      if (!firstName) { showError('请输入名'); return; }
      if (!email) { showError('请输入邮箱地址'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('请输入有效的邮箱地址'); return; }
      if (!pwd) { showError('请输入密码'); return; }
      if (pwd.length < 8) { showError('密码长度至少 8 位'); return; }
      if (!/[0-9]/.test(pwd) || !/[a-z]/.test(pwd) || !/[A-Z]/.test(pwd)) {
        showError('密码需包含至少 1 个数字、1 个大写字母、1 个小写字母'); return;
      }
      if (pwd !== confirm) { showError('两次输入的密码不一致'); return; }
      if (!agreed) { showError('请先阅读并同意隐私政策和服务条款'); return; }

      var user = {
        id: 'u_' + Date.now(),
        name: lastName + firstName,
        username: email.split('@')[0],
        phone: '',
        email: email,
        github: '', google: '', wechatWork: '',
        company: company,
        loginMethod: 'email',
        loginTime: new Date().toISOString()
      };
      localStorage.setItem('moi_user', JSON.stringify(user));
      location.href = 'index.html';
    }
  </script>
</body>
</html>
