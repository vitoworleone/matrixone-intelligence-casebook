<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOI - 服务站点</title>
  <link rel="stylesheet" href="../styles/common.css">
  <style>
    /* common.css 为控制台布局锁死了 body(height:100vh + overflow:hidden),门户页恢复整页滚动 */
    body { padding-top: 56px; height: auto; min-height: 100vh; overflow-y: auto; }
    .wrap { max-width: 1060px; margin: 0 auto; padding: 40px 24px 60px; }
    .hero h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; color: rgba(0,0,0,0.88); }
    .hero p { margin-top: 8px; font-size: 13.5px; color: rgba(0,0,0,0.45); line-height: 1.8; }

    .remember-bar { margin-top: 16px; display: none; align-items: center; gap: 10px; background: #e6f4ff; border: 1px solid #91caff; border-radius: 10px; padding: 10px 16px; font-size: 13px; color: #0958d9; }
    .remember-bar.show { display: flex; }
    .remember-bar a { color: #0958d9; font-weight: 600; cursor: pointer; margin-left: auto; }

    .site-grid { margin-top: 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .site-card {
      background: rgba(255,255,255,0.65); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; padding: 22px 24px;
      box-shadow: 0 4px 16px rgba(20,33,64,0.05); transition: all 0.25s cubic-bezier(.16,1,.3,1);
      display: flex; flex-direction: column; gap: 13px;
    }
    .site-card:not(.disabled):hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(20,33,64,0.1); border-color: rgba(0,74,240,0.25); }
    .site-card.disabled { opacity: 0.62; }
    .site-head { display: flex; align-items: flex-start; gap: 12px; }
    .site-flag { width: 42px; height: 42px; border-radius: 10px; background: #f0f5ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .site-flag svg { width: 22px; height: 22px; color: #004af0; }
    .site-flag img { width: 24px; height: 24px; object-fit: contain; border-radius: 4px; }
    .site-title { flex: 1; min-width: 0; }
    .site-title .cloud-name { font-size: 16px; font-weight: 700; color: rgba(0,0,0,0.88); display: flex; align-items: center; gap: 8px; }
    .site-title .cloud-sub { margin-top: 3px; font-size: 12px; color: rgba(0,0,0,0.4); }
    .s-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .s-badge.last { background: rgba(0,212,170,0.12); color: #00997a; }
    .s-badge.soon { background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.45); }
    .site-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(0,0,0,0.45); flex-shrink: 0; }
    .s-dot { width: 7px; height: 7px; border-radius: 50%; background: #52c41a; }
    .s-dot.gray { background: #bfbfbf; }

    .region-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: rgba(0,0,0,0.55); }
    .region-chip { background: rgba(0,74,240,0.05); border: 1px solid rgba(0,74,240,0.12); color: #2b4acb; border-radius: 6px; padding: 2px 9px; font-size: 12px; }

    .stat-row { display: flex; gap: 26px; }
    .stat b { font-size: 19px; font-weight: 700; color: rgba(0,0,0,0.88); }
    .stat span { display: block; margin-top: 1px; font-size: 11.5px; color: rgba(0,0,0,0.4); }

    .caps { display: flex; flex-wrap: wrap; gap: 8px; }
    .cap { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 10px; border-radius: 6px; }
    .cap.on { background: rgba(82,196,26,0.09); color: #389e0d; }
    .cap.off { background: rgba(0,0,0,0.04); color: rgba(0,0,0,0.3); text-decoration: line-through; }
    .cap svg { width: 11px; height: 11px; }

    .site-foot { display: flex; align-items: center; justify-content: flex-end; margin-top: 2px; }
    .enter-btn {
      background: #004af0; color: #fff; border: none; height: 34px; padding: 0 22px; border-radius: 8px;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .enter-btn:hover { background: #1d5eff; box-shadow: 0 4px 12px rgba(0,74,240,0.3); }
    .enter-btn:disabled { background: rgba(0,0,0,0.12); cursor: not-allowed; box-shadow: none; }

    .remember-check { margin-top: 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(0,0,0,0.55); }
    .remember-check input { accent-color: #004af0; width: 15px; height: 15px; cursor: pointer; }

    .foot-note { margin-top: 40px; text-align: center; font-size: 12px; color: rgba(0,0,0,0.3); line-height: 1.8; }
    @media (max-width: 860px) { .site-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- 顶栏:与 MOI 平台同款(common.css),仅去掉产品切换器与工作区切换器 -->
  <div class="top-bar">
    <a class="logo" href="index.html" style="text-decoration:none;color:inherit"><img src="../images/logo-blue.svg" alt="MatrixOrigin"></a>
    <div class="spacer" style="flex:1"></div>
    <div class="right-actions" style="display:flex;align-items:center">
      <div class="user-avatar-wrap" id="portalAvatarWrap">
        <div class="user-avatar" onclick="togglePop(event)" title="账户">L</div>
        <div class="user-popover" id="portalPopover">
          <div class="popover-header">
            <div class="popover-avatar">L</div>
            <div class="popover-info">
              <div class="popover-name">lisong</div>
              <div class="popover-email">lisong@matrixorigin.cn</div>
            </div>
          </div>
          <div class="popover-menu">
            <button class="popover-item" onclick="window.open('../account/account.html','_blank')">账号管理</button>
            <button class="popover-item" onclick="window.open('../account/credentials.html','_blank')">访问凭据</button>
            <button class="popover-item" onclick="window.open('../account/billing.html','_blank')">计费中心</button>
            <button class="popover-item" onclick="alert('组织管理(成员 / 站点准入):设计中')">组织管理</button>
            <div class="popover-sep"></div>
            <button class="popover-item danger" onclick="location.href='login.html'">退出登录</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="hero">
      <h1>选择服务站点</h1>
      <p>一个账号,通行 MOI 的全部服务站点。站点 = MOI 在某朵云上的一套部署,各站点提供的功能不同,数据不跨站点流动;站点内可含多个地区,创建工作区时选择地区。</p>
    </div>

    <div class="remember-bar" id="rememberBar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      已记住上次站点:<b id="rememberName"></b>,下次登录将直接进入
      <a onclick="clearRemember()">取消直接进入</a>
    </div>

    <div class="site-grid" id="siteGrid"></div>

    <label class="remember-check">
      <input type="checkbox" id="rememberCk" onchange="toggleRemember()"> 记住我的选择,下次登录直接进入所选站点
    </label>

    <div class="foot-note">
      站点内功能按该站点能力清单提供;账号、访问凭据、计费为账号级,所有站点共用一套(见右上角头像菜单)。<br>
      MatrixOrigin · Control Your Data, Trust Your AI
    </div>
  </div>

  <script>
    // 服务站点 = 云;地区是站点内属性(创建工作区时选择)
    // country 显示规则:按站点 region 的覆盖范围写——单一国家直接写国家名,跨多国列出各国,覆盖全球则写「全球」
    var SITES = [
      { id: 'aliyun', cloud: '阿里云', country: '中国', status: 'ok', last: true,
        logo: 'https://cdn.simpleicons.org/alibabacloud',
        regions: ['华东-1', '华北-1', '华南-1'], ws: 3, dbs: 5,
        caps: { '数据平台': true, '智能体': true, '应用': true, 'Genesis': true } },
      { id: 'tencent', cloud: '腾讯云', country: '中国', status: 'ok',
        logo: 'https://www.google.com/s2/favicons?domain=cloud.tencent.com&sz=64',
        regions: ['华东-1', '华北-1'], ws: 1, dbs: 2,
        caps: { '数据平台': true, '智能体': true, '应用': true, 'Genesis': false } },
      { id: 'v2', cloud: 'Virtual Vision', country: '沙特阿拉伯', status: 'ok',
        logo: 'https://www.google.com/s2/favicons?domain=v2.sa&sz=64',
        regions: ['利雅得-1'], ws: 1, dbs: 2,
        caps: { '数据平台': true, '智能体': true, '应用': false, 'Genesis': false } },
      { id: 'eastern', cloud: 'Eastern Communication', country: '菲律宾', status: 'ok',
        logo: 'https://www.google.com/s2/favicons?domain=eastern.com.ph&sz=64',
        regions: ['马尼拉-1'], ws: 0, dbs: 1,
        caps: { '数据平台': true, '智能体': false, '应用': false, 'Genesis': false } },
      { id: '1stack', cloud: '1Stack', country: '马来西亚 · 新加坡', status: 'ok',
        logo: 'https://www.google.com/s2/favicons?domain=1stack.net&sz=64',
        regions: ['吉隆坡-1', '新加坡-1'], ws: 0, dbs: 0,
        caps: { '数据平台': true, '智能体': true, '应用': false, 'Genesis': false } },
      { id: 'stratosphere', cloud: 'Stratosphere', country: '墨西哥', status: 'soon',
        logo: 'https://www.google.com/s2/favicons?domain=stratosphere.com.mx&sz=64',
        regions: ['克雷塔罗-1', '蒙特雷-1'], ws: 0, dbs: 0,
        caps: { '数据平台': true, '智能体': true, '应用': true, 'Genesis': false } }
    ];

    // 品牌 logo 加载失败时回退为通用云图标
    function cloudLogoFallback(img) {
      img.parentNode.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-.42-8.98 6 6 0 1 0-11.06 3.1A3.5 3.5 0 0 0 6.5 19h11z"/></svg>';
    }

    function renderSites() {
      var g = document.getElementById('siteGrid');
      g.innerHTML = SITES.map(function(s) {
        var soon = s.status === 'soon';
        var caps = Object.keys(s.caps).map(function(k) {
          return s.caps[k]
            ? '<span class="cap on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' + k + '</span>'
            : '<span class="cap off">' + k + '</span>';
        }).join('');
        var regions = s.regions.map(function(r) { return '<span class="region-chip">' + r + '</span>'; }).join('');
        return '<div class="site-card' + (soon ? ' disabled' : '') + '">'
          + '<div class="site-head">'
          +   '<div class="site-flag"><img src="' + s.logo + '" alt="' + s.cloud + '" onerror="cloudLogoFallback(this)"></div>'
          +   '<div class="site-title">'
          +     '<div class="cloud-name">' + s.cloud
          +       (s.last ? '<span class="s-badge last">上次使用</span>' : '')
          +       (soon ? '<span class="s-badge soon">即将上线</span>' : '') + '</div>'
          +     '<div class="cloud-sub">' + s.country + '</div>'
          +   '</div>'
          +   '<div class="site-status"><span class="s-dot' + (soon ? ' gray' : '') + '"></span>' + (soon ? '筹备中' : '运行正常') + '</div>'
          + '</div>'
          + '<div class="region-row">' + s.regions.length + ' 个地区:' + regions + '</div>'
          + '<div class="stat-row">'
          +   '<div class="stat"><b>' + (soon ? '—' : s.ws) + '</b><span>工作区</span></div>'
          +   '<div class="stat"><b>' + (soon ? '—' : s.dbs) + '</b><span>数据库实例</span></div>'
          + '</div>'
          + '<div class="caps">' + caps + '</div>'
          + '<div class="site-foot">'
          +   '<button class="enter-btn" ' + (soon ? 'disabled' : 'onclick="enterSite(\'' + s.id + '\')"') + '>进入站点'
          +   '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    function togglePop(e) {
      e.stopPropagation();
      document.getElementById('portalPopover').classList.toggle('show');
    }
    document.addEventListener('click', function() {
      document.getElementById('portalPopover').classList.remove('show');
    });

    function enterSite(id) {
      var s = SITES.find(function(x) { return x.id === id; });
      if (document.getElementById('rememberCk').checked) {
        localStorage.setItem('moi_portal_last', JSON.stringify({ id: s.id, cloud: s.cloud }));
      }
      localStorage.setItem('moi_current_site', JSON.stringify({ id: s.id, cloud: s.cloud, regions: s.regions }));
      // 原型以阿里云站为例:站点内功能按能力清单裁剪导航(二期在控制台侧落地)
      location.href = '../dashboard/dashboard.html';
    }
    function toggleRemember() {
      if (!document.getElementById('rememberCk').checked) localStorage.removeItem('moi_portal_last');
      refreshRememberBar();
    }
    function clearRemember() {
      localStorage.removeItem('moi_portal_last');
      document.getElementById('rememberCk').checked = false;
      refreshRememberBar();
    }
    function refreshRememberBar() {
      var raw = localStorage.getItem('moi_portal_last');
      var bar = document.getElementById('rememberBar');
      var v = null;
      try { v = raw && JSON.parse(raw); } catch (e) {}
      // 记住的站点已不在名单(下线/改名)时自动清除,避免残留
      if (v && !SITES.some(function(s) { return s.id === v.id; })) {
        localStorage.removeItem('moi_portal_last');
        v = null;
      }
      if (v) {
        document.getElementById('rememberName').textContent = v.cloud;
        document.getElementById('rememberCk').checked = true;
        bar.classList.add('show');
      } else {
        document.getElementById('rememberCk').checked = false;
        bar.classList.remove('show');
      }
    }
    renderSites();
    refreshRememberBar();

    // 记住选择 → 登录后自动直进上次站点;从站点内「切换服务站点」回来时带 stay 标记,不自动跳(防回环)
    (function autoEnter() {
      if (sessionStorage.getItem('moi_portal_stay')) { sessionStorage.removeItem('moi_portal_stay'); return; }
      var raw = localStorage.getItem('moi_portal_last');
      if (!raw) return;
      try {
        var last = JSON.parse(raw);
        var site = SITES.find(function(s) { return s.id === last.id && s.status !== 'soon'; });
        if (site) enterSite(site.id);
      } catch (e) {}
    })();
  </script>
</body>
</html>
