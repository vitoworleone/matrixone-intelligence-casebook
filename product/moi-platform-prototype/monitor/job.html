<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOI - 作业</title>
  <link rel="stylesheet" href="../styles/common.css">
  <style>
    .main { padding: 0 !important; overflow: auto; }
    .job-page { padding: 20px 24px 40px; min-width: 1080px; }
    .job-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .job-title { font-size: 20px; font-weight: 700; color: rgba(0,0,0,0.88); }
    .job-sub { font-size: 12.5px; color: rgba(0,0,0,0.45); }

    /* 列头筛选（与计费中心用量明细一致：漏斗图标 + 多选气泡） */
    .th-filter-btn {
      display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
      border-radius: 6px; background: #f5f5f5; cursor: pointer; vertical-align: middle; margin-left: 3px;
    }
    .th-filter-btn svg { width: 11px; height: 11px; stroke: rgba(0,0,0,0.35); }
    .th-filter-btn.active { background: #e6f4ff; }
    .th-filter-btn.active svg { stroke: #1677ff; }

    /* Toolbar */
    .job-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 14px; }
    .job-search { position: relative; }
    .job-search input {
      width: 236px; height: 34px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 13px;
      padding: 0 30px 0 11px; outline: none; background: #fff; transition: border-color 0.2s;
    }
    .job-search input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(5,145,255,0.08); }
    .job-search .s-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; color: rgba(0,0,0,0.3); pointer-events: none; }
    .job-select { height: 34px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 13px; padding: 0 8px; outline: none; background: #fff; cursor: pointer; color: rgba(0,0,0,0.78); }
    .job-select:focus { border-color: #1677ff; }
    .job-toolbar .spacer { flex: 1; }
    .job-icon-btn { width: 34px; height: 34px; border: 1px solid #d9d9d9; border-radius: 8px; background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: rgba(0,0,0,0.55); }
    .job-icon-btn:hover { border-color: #1677ff; color: #1677ff; }
    .job-icon-btn svg { width: 15px; height: 15px; }

    /* Table */
    .job-table-wrap { border: 1px solid #f0f0f0; border-radius: 10px; overflow-x: auto; background: #fff; }
    table.job-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; table-layout: fixed; }
    .job-table td, .job-table th { overflow: hidden; text-overflow: ellipsis; }
    .job-table thead th { background: #fafbfc; color: rgba(0,0,0,0.5); font-weight: 500; text-align: left; padding: 11px 8px; white-space: nowrap; border-bottom: 1px solid #f0f0f0; }
    .job-table th.sortable { cursor: pointer; user-select: none; }
    .job-table th .sort-ic { margin-left: 4px; opacity: 0.4; font-size: 10px; }
    .job-table th.sorted .sort-ic { opacity: 1; color: #1677ff; }
    .job-table tbody td { padding: 11px 8px; border-bottom: 1px solid #f5f5f5; color: rgba(0,0,0,0.82); white-space: nowrap; vertical-align: middle; }
    .time-cell .t-dur { font-size: 12px; color: rgba(0,0,0,0.42); margin-top: 2px; }
    .job-table tbody tr:last-child td { border-bottom: none; }
    .job-table tbody tr { transition: background 0.12s; }
    .job-table tbody tr:hover { background: #f7faff; }
    /* 操作列右侧吸附：横向滚动时操作始终可见 */
    .job-table th:last-child, .job-table td:last-child {
      position: sticky; right: 0; background: #fff;
      box-shadow: -6px 0 8px -6px rgba(20,33,64,0.10);
    }
    .job-table thead th:last-child { background: #fafbfc; }
    .job-table tbody tr:hover td:last-child { background: #f7faff; }

    .type-badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .type-badge svg { width: 12px; height: 12px; }
    .type-badge.wf   { color: #0958d9; background: rgba(22,119,255,0.08); }
    .type-badge.load { color: #389e0d; background: rgba(82,196,26,0.10); }
    .type-badge.exp  { color: #531dab; background: rgba(114,46,209,0.08); }

    .task-name { color: #1677ff; cursor: pointer; }
    .task-name:hover { text-decoration: underline; }
    .branch-tag { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; height: 18px; padding: 0 6px; border-radius: 5px; background: rgba(0,0,0,0.045); color: rgba(0,0,0,0.5); font-size: 11px; }
    .branch-tag svg { width: 10px; height: 10px; }

    .flow-cell { display: flex; flex-direction: column; gap: 3px; }
    .path-cell { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; }
    .path-cell .p-ic { display: flex; align-items: center; color: rgba(0,0,0,0.4); flex-shrink: 0; }
    .path-cell .p-ic svg { width: 13px; height: 13px; }
    .path-cell .p-ic img { width: 14px; height: 14px; }
    .path-cell .p-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(0,0,0,0.65); font-size: 12.5px; }
    .path-cell .p-arrow { color: rgba(0,0,0,0.28); flex-shrink: 0; font-size: 11px; width: 13px; text-align: center; }

    .st-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; cursor: default; }
    .st-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .st-queued  { color: rgba(0,0,0,0.45); } .st-queued .st-dot { background: #bfbfbf; }
    .st-running { color: #1677ff; } .st-running .st-dot { background: #1677ff; animation: pulse 1.2s ease-in-out infinite; }
    .st-success { color: #389e0d; } .st-success .st-dot { background: #52c41a; }
    .st-partial { color: #d48806; } .st-partial .st-dot { background: #faad14; }
    .st-failed  { color: #cf1322; } .st-failed .st-dot { background: #ff4d4f; }
    .st-paused  { color: #d46b08; } .st-paused .st-dot { background: #fa8c16; }
    .st-canceled{ color: rgba(0,0,0,0.35); } .st-canceled .st-dot { background: #d9d9d9; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .st-running .st-dot { animation: none; } }
    .st-err-ic { display: inline-flex; color: #ff4d4f; cursor: help; }
    .st-err-ic svg { width: 13px; height: 13px; }

    .vol-cell { font-variant-numeric: tabular-nums; }
    .vol-prog { width: 72px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.06); margin-top: 5px; overflow: hidden; }
    .vol-prog i { display: block; height: 100%; border-radius: 2px; background: #1677ff; transition: width 0.4s; }

    .op-btn { border: none; background: none; cursor: pointer; color: rgba(0,0,0,0.45); width: 26px; height: 26px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
    .op-btn:hover { background: rgba(22,119,255,0.08); color: #1677ff; }
    .op-btn.danger:hover { background: #fff1f0; color: #ff4d4f; }
    .op-btn svg { width: 14px; height: 14px; }

    .job-empty { text-align: center; padding: 60px 0; color: rgba(0,0,0,0.3); font-size: 13px; }

    /* Footer */
    .job-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12.5px; color: rgba(0,0,0,0.45); }
    .job-pg { display: flex; align-items: center; gap: 6px; }
    .job-pg-btn { min-width: 28px; height: 28px; padding: 0 6px; border: 1px solid #e5e6eb; border-radius: 6px; background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; color: rgba(0,0,0,0.6); }
    .job-pg-btn.active { background: #1677ff; border-color: #1677ff; color: #fff; }
    .job-pg-btn:disabled { color: rgba(0,0,0,0.2); cursor: not-allowed; }

    /* ===== 作业详情 ===== */
    .jd-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .jd-back { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #e5e6eb; background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: rgba(0,0,0,0.6); flex-shrink: 0; }
    .jd-back:hover { border-color: #1677ff; color: #1677ff; }
    .jd-title { font-size: 17px; font-weight: 700; color: rgba(0,0,0,0.88); }
    .jd-head .spacer { flex: 1; }
    .jd-op-btn { height: 32px; padding: 0 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; color: rgba(0,0,0,0.7); display: inline-flex; align-items: center; gap: 6px; }
    .jd-op-btn:hover { border-color: #1677ff; color: #1677ff; }
    .jd-op-btn svg { width: 13px; height: 13px; }
    .jd-op-btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; }
    .jd-op-btn.primary:hover { background: #4096ff; color: #fff; }
    .jd-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; padding: 18px 22px; margin-bottom: 16px; }
    .jd-card-title { font-size: 14px; font-weight: 700; color: rgba(0,0,0,0.85); margin-bottom: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .jd-card-title .spacer { flex: 1; }
    .jd-info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 28px; }
    .jd-info-item .k { font-size: 12px; color: rgba(0,0,0,0.4); margin-bottom: 3px; }
    .jd-info-item .v { font-size: 13px; color: rgba(0,0,0,0.85); word-break: break-all; }
    .jd-info-item .v a { color: #1677ff; text-decoration: none; }
    .jd-info-item .v a:hover { text-decoration: underline; }
    .jd-conn { display: inline-flex; align-items: center; gap: 6px; }
    .jd-conn img { width: 15px; height: 15px; flex-shrink: 0; }
    .jd-conn svg { width: 14px; height: 14px; flex-shrink: 0; color: rgba(0,0,0,0.4); }
    .jd-conn .ct { font-weight: 600; color: rgba(0,0,0,0.85); }
    .jd-conn .sep { color: rgba(0,0,0,0.25); }
    .jd-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: rgba(0,0,0,0.55); background: #f5f7fa; border-radius: 6px; padding: 3px 10px; font-weight: 400; }
    .jd-chip b { color: rgba(0,0,0,0.85); font-weight: 650; }
    .jd-chip.ok b { color: #389e0d; }
    .jd-chip.bad b { color: #cf1322; }
    /* 工作流只读画布（与工作流编辑器同款视觉，运行态染色） */
    .jd-canvas-wrap {
      position: relative; height: 320px; border-radius: 12px; overflow: hidden; border: 1px solid #eef0f4;
      background-color: #f7f9fd;
      background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .jd-canvas { position: absolute; inset: 0; overflow: auto; }
    .jd-canvas-inner { position: relative; height: 100%; }
    .jd-conns { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
    .jd-conn { fill: none; stroke: rgba(0,74,240,0.5); stroke-width: 1.8; }
    .jd-conn-arrow { fill: #96b3ea; }
    .jd-dagnode {
      position: absolute; width: 172px; padding: 12px 14px; cursor: pointer; z-index: 2;
      background: rgba(255,255,255,0.72);
      -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.7); border-radius: 16px;
      box-shadow: 0 4px 16px rgba(20,33,64,0.06), inset 0 1px 0 rgba(255,255,255,0.8);
      transition: all 0.25s cubic-bezier(.16,1,.3,1);
    }
    .jd-dagnode:hover { transform: translateY(-2px); border-color: rgba(0,74,240,0.3); box-shadow: 0 8px 32px rgba(20,33,64,0.10); }
    .jd-dagnode.active { border-color: rgba(0,74,240,0.5); box-shadow: 0 0 0 3px rgba(0,74,240,0.12), 0 8px 32px rgba(20,33,64,0.10); }
    .jd-dagnode.ok { border-color: rgba(82,196,26,0.5); }
    .jd-dagnode.run { border-color: rgba(22,119,255,0.6); box-shadow: 0 0 0 3px rgba(22,119,255,0.10); }
    .jd-dagnode.err { border-color: rgba(255,77,79,0.6); }
    .jd-dagnode.wait { opacity: 0.72; border-style: dashed; border-color: rgba(0,0,0,0.15); }
    .jd-dagnode .jd-node-name { font-size: 13px; font-weight: 600; color: rgba(0,0,0,0.85); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jd-dagnode .jd-node-name .st-dot { width: 7px; height: 7px; flex-shrink: 0; }
    .jd-dagnode .jd-node-meta { margin-top: 4px; font-size: 11px; color: rgba(0,0,0,0.42); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jd-port { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,0.15); top: 50%; margin-top: -4px; z-index: 3; }
    .jd-port.in { left: -4px; } .jd-port.out { right: -4px; }
    .jd-ro-tag { position: absolute; top: 10px; right: 12px; z-index: 5; font-size: 11px; color: rgba(0,0,0,0.45); background: rgba(255,255,255,0.85); border: 1px solid #eef0f4; border-radius: 6px; padding: 2px 8px; }
    /* 节点详情面板（画布内右侧浮层） */
    .jd-node-panel {
      position: absolute; top: 12px; right: 12px; bottom: 12px; width: 268px; z-index: 6; display: none;
      background: rgba(255,255,255,0.92); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid #eef0f4; border-radius: 12px; box-shadow: 0 10px 30px rgba(20,33,64,0.14);
      padding: 14px 16px; overflow-y: auto;
    }
    .jd-node-panel.open { display: block; }
    .jd-np-close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: none; background: none; cursor: pointer; color: rgba(0,0,0,0.35); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .jd-np-close:hover { background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.7); }
    .jd-np-title { font-size: 14px; font-weight: 700; color: rgba(0,0,0,0.88); display: flex; align-items: center; gap: 7px; padding-right: 22px; }
    .jd-np-row { margin-top: 11px; }
    .jd-np-row .k { font-size: 11.5px; color: rgba(0,0,0,0.4); margin-bottom: 2px; }
    .jd-np-row .v { font-size: 12.5px; color: rgba(0,0,0,0.82); line-height: 1.5; word-break: break-all; }
    .jd-np-row .v.err { color: #cf1322; }
    .jd-np-hint { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #eef0f4; font-size: 11px; color: rgba(0,0,0,0.35); line-height: 1.6; }
    /* 详情表格 */
    .jd-table-wrap { border: 1px solid #f0f0f0; border-radius: 10px; overflow-x: auto; }
    .jd-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    .jd-table thead th { background: #fafbfc; color: rgba(0,0,0,0.5); font-weight: 500; text-align: left; padding: 10px 12px; white-space: nowrap; border-bottom: 1px solid #f0f0f0; }
    .jd-table tbody td { padding: 10px 12px; border-bottom: 1px solid #f5f5f5; color: rgba(0,0,0,0.8); white-space: nowrap; }
    .jd-table tbody tr:last-child td { border-bottom: none; }
    .jd-table td.num { font-variant-numeric: tabular-nums; }
    .jd-err-text { color: #cf1322; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
    .jd-pair { display: inline-flex; align-items: center; gap: 6px; }

    /* Toast */
    .job-toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 999; background: rgba(0,0,0,0.78); color: #fff; font-size: 12.5px; padding: 7px 14px; border-radius: 8px; display: none; }

    /* Tooltip */
    .job-tip { position: fixed; z-index: 999; max-width: 420px; background: rgba(0,0,0,0.86); color: #fff; font-size: 12px; line-height: 1.6; padding: 8px 11px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
  </style>
</head>
<body>

  <div class="top-bar"></div>
  <div id="addWsModal"></div>

  <div class="layout">
    <div class="sidebar"><div class="menu-section"></div></div>

    <div class="main">
      <div class="job-page">
        <div id="jobListView">
        <div class="job-head">
          <span class="job-title">作业</span>
          <span class="job-sub">工作流 / 数据载入 / 数据导出等后台任务的统一运行视图</span>
        </div>

        <!-- Toolbar -->
        <div class="job-toolbar">
          <div class="job-search">
            <input type="text" id="jobSearch" placeholder="搜索任务名称 / 目标位置……" oninput="renderJobs()">
            <span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
          </div>
          <select class="job-select" id="jobTimeFilter" onchange="renderJobs()">
            <option value="">时间：全部</option>
            <option value="1">今天</option>
            <option value="7">近 7 天</option>
            <option value="30">近 30 天</option>
          </select>
          <div class="spacer"></div>
          <button class="job-icon-btn" title="刷新" onclick="refreshTick(true)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v5h5M21 16v-5h-5"/><path d="M4.6 13a8 8 0 0 0 13.6 3.6L21 14M19.4 11A8 8 0 0 0 5.8 7.4L3 10"/></svg>
          </button>
        </div>

        <!-- Table -->
        <div class="job-table-wrap">
          <table class="job-table">
            <thead>
              <tr>
                <th style="width:16%">任务名称</th>
                <th style="width:9%">类型<span class="th-filter-btn" id="typeFilterBtn" onclick="event.stopPropagation();toggleColFilter('type')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th style="width:26%">数据流向（源 → 目标）</th>
                <th style="width:10%">状态<span class="th-filter-btn" id="statusFilterBtn" onclick="event.stopPropagation();toggleColFilter('status')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th style="width:9%">数据量</th>
                <th style="width:10%">触发方式<span class="th-filter-btn" id="triggerFilterBtn" onclick="event.stopPropagation();toggleColFilter('trigger')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th class="sortable" data-sort="start" onclick="toggleSort('start')" style="width:12%">开始 / 时长<span class="sort-ic">▼</span></th>
                <th style="width:64px">操作</th>
              </tr>
            </thead>
            <tbody id="jobTbody"></tbody>
          </table>
          <div class="job-empty" id="jobEmpty" style="display:none">没有符合条件的作业</div>
        </div>

        <div class="job-foot">
          <span id="jobCount"></span>
          <div class="job-pg">
            <button class="job-pg-btn" disabled>‹</button>
            <button class="job-pg-btn active">1</button>
            <button class="job-pg-btn" disabled>›</button>
          </div>
        </div>
        </div><!-- end jobListView -->
        <div id="jobDetailView" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="job-toast" id="jobToast"></div>
  <div class="job-tip" id="jobTip"></div>

  <script src="../scripts/common.js"></script>
  <script>
    // ===== 状态 / 类型字典 =====
    var ST = {
      queued:   { label: '等待中',   cls: 'st-queued' },
      running:  { label: '运行中',   cls: 'st-running' },
      success:  { label: '已完成',   cls: 'st-success' },
      partial:  { label: '部分成功', cls: 'st-partial' },
      failed:   { label: '失败',     cls: 'st-failed' },
      paused:   { label: '已暂停',   cls: 'st-paused' },
      canceled: { label: '已取消',   cls: 'st-canceled' }
    };

    // 无定制明细的作业：按数据量生成占位明细

        h += '<td class="num">' + fmtNum(r.read) + '</td><td class="num">' + fmtNum(r.written) + '</td><td class="num">' + fmtNum(r.skipped) + '</td>';
        h += '<td>' + fmtDur(r.dur) + '</td>';
        h += '<td>' + (r.note ? '<span class="jd-err-text" title="' + esc(r.note) + '">' + esc(r.note) + '</span>' : '<span style="color:rgba(0,0,0,0.25)">—</span>') + '</td>';
        h += '</tr>';
      });
      h += '</tbody></table></div></div>';
      return h;
    }

    // 非结构化载入 / 文件导出：文件明细
    function renderFileDetail(j, det) {
      var files = det.files || [];
      var ok = files.filter(function(f) { return f.status === 'success'; }).length;
      var bad = files.filter(function(f) { return f.status === 'failed'; }).length;
      var verb = j.type === 'exp' ? '导出' : '载入';
      var h = '<div class="jd-card"><div class="jd-card-title">文件明细'
        + '<span class="jd-chip ok" title="' + verb + '成功的文件数">' + verb + '成功 <b>' + ok + '/' + files.length + '</b></span>'
        + '<span class="jd-chip bad" title="' + verb + '失败的文件数">' + verb + '失败 <b>' + bad + '/' + files.length + '</b></span>'
        + '</div>' + fileTable(files, j.type === 'exp') + '</div>';
      return h;
    }

    function fileTable(files, isExport) {
      var h = '<div class="jd-table-wrap"><table class="jd-table"><thead><tr>'
        + '<th>文件名</th><th style="width:100px">状态</th><th style="width:90px">文件类型</th>'
        + '<th style="width:100px">开始时间</th><th style="width:100px">结束时间</th>'
        + '<th>' + (isExport ? '导出路径' : '详情') + '</th>'
        + '</tr></thead><tbody>';
      files.forEach(function(f) {
        h += '<tr><td>' + esc(f.name) + '</td><td>' + fileStBadge(f.status) + '</td><td>' + esc(f.ftype) + '</td>'
           + '<td>' + (f.start || '—') + '</td><td>' + (f.end || '—') + '</td>';
        if (f.status === 'failed' && f.note) h += '<td><span class="jd-err-text" title="' + esc(f.note) + '">' + esc(f.note) + '</span></td>';
        else h += '<td>' + (f.note ? esc(f.note) : '<span style="color:rgba(0,0,0,0.25)">—</span>') + '</td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      return h;
    }

    // ===== 行内操作 =====
    function jobPause(i)  { JOBS[i].status = 'paused'; renderJobs(); toast('作业已暂停'); }
    function jobResume(i) { JOBS[i].status = 'running'; renderJobs(); toast('作业已恢复'); }
    function jobRetry(i)  {
      var j = JOBS[i];
      j.status = 'running'; j.err = null; j.durSec = null;
      if (j.done >= j.total) j.done = 0;
      renderJobs(); toast('已发起重试，仅重跑失败部分');
    }

    // ===== 刷新（手动，运行中作业推进进度）=====
    function refreshTick(manual) {
      JOBS.forEach(function(j) {
        if (j.status === 'running') {
          var step = Math.max(1, Math.round(j.total * 0.18));
          j.done = Math.min(j.total, j.done + step);
          if (j.done >= j.total) { j.status = 'success'; j.durSec = Math.round(60 + Math.random() * 300); }
        } else if (j.status === 'queued' && Math.random() > 0.5) {
          j.status = 'running';
        }
      });
      renderJobs();
      if (manual) toast('已刷新');
    }

    // ===== Toast / Tooltip =====
    var toastTimer = null;
    function toast(msg) {
      var el = document.getElementById('jobToast');
      el.textContent = msg; el.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.style.display = 'none'; }, 1800);
    }
    function showTip(e, el) {
      var tip = document.getElementById('jobTip');
      tip.textContent = el.getAttribute('data-err');
      tip.style.display = 'block';
      var r = el.getBoundingClientRect();
      tip.style.left = Math.min(r.left, window.innerWidth - 440) + 'px';
      tip.style.top = (r.bottom + 8) + 'px';
    }
    function hideTip() { document.getElementById('jobTip').style.display = 'none'; }

    // ===== Init =====
    // 从来源页（数据载入 / 数据导出 / 工作流）跳转带入：q=任务名 预填搜索框，type=作业类型 预选类型筛选
    (function initFromQuery(){
      var p = new URLSearchParams(location.search);
      var q = p.get('q'), ty = p.get('type');
      if (q) document.getElementById('jobSearch').value = q;
      if (ty && ['wf', 'load', 'exp'].indexOf(ty) !== -1) {
        colFilters.type = [ty];
        var tb = document.getElementById('typeFilterBtn');
        if (tb) tb.classList.add('active');
      }
    })();
    renderJobs();
  </script>
</body>
</html>
