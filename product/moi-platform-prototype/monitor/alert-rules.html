<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOI - 告警规则</title>
  <link rel="stylesheet" href="../styles/common.css">
  <style>
    .main { padding: 0 !important; overflow: auto; }
    .ar-page { padding: 20px 24px 40px; min-width: 1080px; }
    .ar-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .ar-title { font-size: 20px; font-weight: 700; color: rgba(0,0,0,0.88); }
    .ar-sub { font-size: 12.5px; color: rgba(0,0,0,0.45); }

    /* 列头筛选（与作业 / 计费中心用量明细一致） */
    .th-filter-btn {
      display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
      border-radius: 6px; background: #f5f5f5; cursor: pointer; vertical-align: middle; margin-left: 3px;
    }
    .th-filter-btn svg { width: 11px; height: 11px; stroke: rgba(0,0,0,0.35); }
    .th-filter-btn.active { background: #e6f4ff; }
    .th-filter-btn.active svg { stroke: #1677ff; }

    /* Toolbar */
    .ar-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
    .ar-search { position: relative; }
    .ar-search input {
      width: 260px; height: 34px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 13px;
      padding: 0 30px 0 11px; outline: none; background: #fff; transition: border-color 0.2s;
    }
    .ar-search input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(5,145,255,0.08); }
    .ar-search .s-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; color: rgba(0,0,0,0.3); pointer-events: none; }
    .ar-toolbar .spacer { flex: 1; }
    .ar-create-btn {
      height: 34px; padding: 0 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
      background: #1677ff; border: none; color: #fff; display: inline-flex; align-items: center; gap: 6px;
    }
    .ar-create-btn:hover { background: #4096ff; }
    .ar-create-btn svg { width: 13px; height: 13px; }

    /* Table */
    .ar-table-wrap { border: 1px solid #f0f0f0; border-radius: 10px; overflow-x: auto; background: #fff; }
    table.ar-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; table-layout: fixed; }
    .ar-table td, .ar-table th { overflow: hidden; text-overflow: ellipsis; }
    .ar-table thead th { background: #fafbfc; color: rgba(0,0,0,0.5); font-weight: 500; text-align: left; padding: 11px 8px; white-space: nowrap; border-bottom: 1px solid #f0f0f0; }
    .ar-table th.sortable { cursor: pointer; user-select: none; }
    .ar-table th .sort-ic { margin-left: 4px; opacity: 0.4; font-size: 10px; }
    .ar-table th.sorted .sort-ic { opacity: 1; color: #1677ff; }
    .ar-table tbody td { padding: 11px 8px; border-bottom: 1px solid #f5f5f5; color: rgba(0,0,0,0.82); white-space: nowrap; vertical-align: middle; }
    .ar-table tbody tr:last-child td { border-bottom: none; }
    .ar-table tbody tr { transition: background 0.12s; }
    .ar-table tbody tr:hover { background: #f7faff; }

    .ar-expr { color: #1677ff; cursor: pointer; }
    .ar-expr:hover { text-decoration: underline; }
    .ar-thval { display: inline-block; padding: 0 6px; border-radius: 4px; background: #f5f5f5; color: rgba(0,0,0,0.82); font-size: 12px; font-variant-numeric: tabular-nums; margin: 0 2px; }

    .lv-badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .lv-urgent { color: #cf1322; background: rgba(255,77,79,0.10); }
    .lv-major  { color: #d46b08; background: rgba(250,140,22,0.12); }
    .lv-info   { color: #0958d9; background: rgba(22,119,255,0.08); }

    .st-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; }
    .st-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .st-normal { color: #389e0d; } .st-normal .st-dot { background: #52c41a; }
    .st-alerting { color: #cf1322; } .st-alerting .st-dot { background: #ff4d4f; animation: arPulse 1.2s ease-in-out infinite; }
    @keyframes arPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .st-alerting .st-dot { animation: none; } }

    /* 启用开关 */
    .sw { position: relative; display: inline-block; width: 34px; height: 18px; vertical-align: middle; }
    .sw input { display: none; }
    .sw .sl { position: absolute; inset: 0; background: #d9d9d9; border-radius: 18px; cursor: pointer; transition: .2s; }
    .sw .sl::before { content: ''; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
    .sw input:checked + .sl { background: #1677ff; }
    .sw input:checked + .sl::before { transform: translateX(16px); }

    .op-btn { border: none; background: none; cursor: pointer; color: rgba(0,0,0,0.45); width: 26px; height: 26px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
    .op-btn:hover { background: rgba(22,119,255,0.08); color: #1677ff; }
    .op-btn.danger:hover { background: #fff1f0; color: #ff4d4f; }
    .op-btn svg { width: 14px; height: 14px; }

    .ar-empty { text-align: center; padding: 60px 0; color: rgba(0,0,0,0.3); font-size: 13px; }
    .ar-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12.5px; color: rgba(0,0,0,0.45); }
    .ar-pg { display: flex; align-items: center; gap: 6px; }
    .ar-pg-btn { min-width: 28px; height: 28px; padding: 0 6px; border: 1px solid #e5e6eb; border-radius: 6px; background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; color: rgba(0,0,0,0.6); }
    .ar-pg-btn.active { background: #1677ff; border-color: #1677ff; color: #fff; }
    .ar-pg-btn:disabled { color: rgba(0,0,0,0.2); cursor: not-allowed; }

    /* ===== 创建 / 编辑弹窗 ===== */
    .ar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 500; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 6vh 0 40px; }
    .ar-overlay.open { display: flex; }
    .ar-modal { background: #fff; border-radius: 14px; width: 660px; box-shadow: 0 12px 40px rgba(0,0,0,0.16); padding: 22px 28px 20px; }
    .ar-m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .ar-m-title { font-size: 16px; font-weight: 700; color: rgba(0,0,0,0.88); }
    .ar-m-close { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 6px; color: rgba(0,0,0,0.45); font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .ar-m-close:hover { background: rgba(0,0,0,0.05); }
    .ar-row { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
    .ar-row-label { width: 84px; flex-shrink: 0; font-size: 13px; color: rgba(0,0,0,0.65); line-height: 34px; }
    .ar-row-body { flex: 1; min-width: 0; }
    /* 类别 segmented */
    .ar-cat-btn { height: 34px; padding: 0 16px; border: 1px solid #d9d9d9; background: #fff; font-size: 13px; color: rgba(0,0,0,0.7); cursor: pointer; }
    .ar-cat-btn:first-child { border-radius: 8px 0 0 8px; }
    .ar-cat-btn:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
    .ar-cat-btn.active { border-color: #1677ff; color: #1677ff; background: #f0f6ff; position: relative; z-index: 1; }
    /* 表达式下拉 */
    .ar-expr-dd { position: relative; }
    .ar-expr-ctrl {
      height: 38px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 0 32px 0 12px; display: flex; align-items: center;
      font-size: 13.5px; color: rgba(0,0,0,0.85); cursor: pointer; background: #fff; position: relative;
    }
    .ar-expr-ctrl.open, .ar-expr-ctrl:hover { border-color: #1677ff; }
    .ar-expr-ctrl .placeholder { color: rgba(0,0,0,0.3); }
    .ar-expr-ctrl .caret { position: absolute; right: 10px; color: rgba(0,0,0,0.3); }
    .ar-expr-menu {
      display: none; position: absolute; top: 42px; left: 0; right: 0; z-index: 60; background: #fff;
      border: 1px solid #e5e6eb; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.14); padding: 6px; max-height: 320px; overflow-y: auto;
    }
    .ar-expr-menu.open { display: block; }
    .ar-expr-item { padding: 10px 12px; border-radius: 6px; font-size: 13.5px; color: rgba(0,0,0,0.82); cursor: pointer; }
    .ar-expr-item:hover { background: #f5f7fb; }
    .ar-expr-item.selected { background: #e6f4ff; font-weight: 600; }
    .ar-chip { display: inline-block; padding: 1px 8px; border-radius: 5px; background: #f0f0f0; color: rgba(0,0,0,0.55); font-size: 12px; margin: 0 3px; }
    /* 阈值面板 */
    .ar-th-panel { margin-top: 10px; background: #f7f8fa; border-radius: 10px; padding: 16px 18px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(0,0,0,0.7); }
    .ar-th-panel input { width: 130px; height: 34px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 0 10px; font-size: 13px; outline: none; background: #fff; }
    .ar-th-panel input:focus { border-color: #1677ff; }
    .ar-th-panel .hint { color: rgba(0,0,0,0.35); font-size: 12.5px; }
    /* 级别 radio */
    .ar-radio { display: inline-flex; align-items: center; gap: 7px; margin-right: 26px; cursor: pointer; font-size: 13.5px; color: rgba(0,0,0,0.8); line-height: 34px; }
    .ar-radio input { accent-color: #1677ff; width: 15px; height: 15px; cursor: pointer; }
    /* 通知周期 */
    .ar-cycle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: rgba(0,0,0,0.35); line-height: 36px; }
    .ar-cycle input { width: 15px; height: 15px; }
    .ar-cycle.on { color: rgba(0,0,0,0.8); cursor: pointer; }
    .ar-cycle.on input { accent-color: #1677ff; cursor: pointer; }
    .ar-cycle-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ar-cycle-wrap .ar-select { width: 96px; }
    .ar-cycle-wrap .ar-select:disabled { background: #f5f5f5; color: rgba(0,0,0,0.3); cursor: not-allowed; }
    /* 通知对象行 */
    .ar-notify-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .ar-select { height: 36px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 13px; padding: 0 10px; outline: none; background: #fff; cursor: pointer; color: rgba(0,0,0,0.82); }
    .ar-select:focus { border-color: #1677ff; }
    .ar-notify-row .ch { width: 150px; flex-shrink: 0; }
    .ar-notify-row .obj { flex: 1; min-width: 0; }
    .ar-add-notify { display: inline-block; margin-top: 2px; font-size: 13px; color: #1677ff; cursor: pointer; }
    .ar-add-notify:hover { text-decoration: underline; }
    .ar-add-notify.disabled { color: rgba(0,0,0,0.25); cursor: not-allowed; text-decoration: none; }
    /* Footer */
    .ar-m-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
    .ar-btn { height: 36px; padding: 0 22px; border-radius: 8px; font-size: 13.5px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; color: rgba(0,0,0,0.7); }
    .ar-btn:hover { border-color: #1677ff; color: #1677ff; }
    .ar-btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; font-weight: 500; }
    .ar-btn.primary:hover { background: #4096ff; color: #fff; }

    .ar-toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 999; background: rgba(0,0,0,0.78); color: #fff; font-size: 12.5px; padding: 7px 14px; border-radius: 8px; display: none; }
  </style>
</head>
<body>

  <div class="top-bar"></div>
  <div id="addWsModal"></div>

  <div class="layout">
    <div class="sidebar"><div class="menu-section"></div></div>

    <div class="main">
      <div class="ar-page">
        <div class="ar-head">
          <span class="ar-title">告警规则</span>
          <span class="ar-sub">为数据载入 / 数据处理任务设置阈值告警，触发后按通知对象送达</span>
        </div>

        <div class="ar-toolbar">
          <div class="ar-search">
            <input type="text" id="arSearch" placeholder="搜索告警表达式……" oninput="renderRules()">
            <span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
          </div>
          <div class="spacer"></div>
          <button class="ar-create-btn" onclick="openRuleModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            创建告警规则
          </button>
        </div>

        <div class="ar-table-wrap">
          <table class="ar-table">
            <thead>
              <tr>
                <th style="width:24%">告警表达式</th>
                <th style="width:96px">告警类别<span class="th-filter-btn" id="catFilterBtn" onclick="event.stopPropagation();toggleColFilter('cat')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th style="width:96px">告警级别<span class="th-filter-btn" id="levelFilterBtn" onclick="event.stopPropagation();toggleColFilter('level')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th style="width:86px">通知周期</th>
                <th style="width:10%">通知对象<span class="th-filter-btn" id="notifyFilterBtn" onclick="event.stopPropagation();toggleColFilter('notify')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th style="width:96px">告警状态<span class="th-filter-btn" id="stateFilterBtn" onclick="event.stopPropagation();toggleColFilter('state')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th class="sortable" data-sort="created" onclick="toggleSort('created')" style="width:9%">创建时间<span class="sort-ic">▼</span></th>
                <th class="sortable" data-sort="updated" onclick="toggleSort('updated')" style="width:9%">更新时间<span class="sort-ic">▼</span></th>
                <th style="width:74px">启用状态</th>
                <th style="width:96px">操作</th>
              </tr>
            </thead>
            <tbody id="arTbody"></tbody>
          </table>
          <div class="ar-empty" id="arEmpty" style="display:none">没有符合条件的告警规则</div>
        </div>

        <div class="ar-foot">
          <span id="arCount"></span>
          <div class="ar-pg">
            <button class="ar-pg-btn" disabled>‹</button>
            <button class="ar-pg-btn active">1</button>
            <button class="ar-pg-btn" disabled>›</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 创建 / 编辑告警规则弹窗 -->
  <div class="ar-overlay" id="arOverlay" onclick="if(event.target===this)closeRuleModal()">
    <div class="ar-modal">
      <div class="ar-m-head">
        <span class="ar-m-title" id="arModalTitle">创建告警规则</span>
        <button class="ar-m-close" onclick="closeRuleModal()">✕</button>
      </div>

      <div class="ar-row">
        <div class="ar-row-label">告警类别</div>
        <div class="ar-row-body">
          <button class="ar-cat-btn" id="catBtnLoad" onclick="setModalCat('load')">数据加载</button><button class="ar-cat-btn" id="catBtnProc" onclick="setModalCat('proc')">数据处理</button>
        </div>
      </div>

      <div class="ar-row">
        <div class="ar-row-label">告警表达式</div>
        <div class="ar-row-body">
          <div class="ar-expr-dd">
            <div class="ar-expr-ctrl" id="arExprCtrl" onclick="event.stopPropagation();toggleExprMenu()">
              <span id="arExprText" class="placeholder">请选择告警表达式</span>
              <span class="caret"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
            </div>
            <div class="ar-expr-menu" id="arExprMenu" onclick="event.stopPropagation()"></div>
          </div>
          <div class="ar-th-panel" id="arThPanel" style="display:none">
            <span>阈值 1</span>
            <input type="number" id="arThInput">
            <span class="hint" id="arThHint"></span>
          </div>
        </div>
      </div>

      <div class="ar-row">
        <div class="ar-row-label">告警级别</div>
        <div class="ar-row-body">
          <label class="ar-radio"><input type="radio" name="arLevel" value="urgent">紧急</label>
          <label class="ar-radio"><input type="radio" name="arLevel" value="major">重要</label>
          <label class="ar-radio"><input type="radio" name="arLevel" value="info" checked>提示</label>
        </div>
      </div>

      <div class="ar-row">
        <div class="ar-row-label">通知周期</div>
        <div class="ar-row-body" id="arCycleRow"></div>
      </div>

      <div class="ar-row">
        <div class="ar-row-label">通知对象</div>
        <div class="ar-row-body">
          <div id="arNotifyRows"></div>
          <span class="ar-add-notify" id="arAddNotify" onclick="addNotifyRow()">添加通知对象</span>
        </div>
      </div>

      <div class="ar-row">
        <div class="ar-row-label">启用状态</div>
        <div class="ar-row-body" style="line-height:34px">
          <label class="sw"><input type="checkbox" id="arEnabled" checked><span class="sl"></span></label>
        </div>
      </div>

      <div class="ar-m-foot">
        <button class="ar-btn" onclick="closeRuleModal()">取 消</button>
        <button class="ar-btn primary" onclick="saveRule()">确 定</button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗（居中） -->
  <div class="ar-overlay" id="arDelOverlay" style="align-items:center;padding:0" onclick="if(event.target===this)closeDelModal()">
    <div class="ar-modal" style="width:420px;padding:20px 24px 18px">
      <div class="ar-m-head" style="margin-bottom:10px">
        <span class="ar-m-title">删除告警规则</span>
        <button class="ar-m-close" onclick="closeDelModal()">✕</button>
      </div>
      <div style="font-size:13.5px;color:rgba(0,0,0,0.7);line-height:1.6;margin-bottom:20px">您是否确定删除该条告警规则？删除后不再触发告警，历史告警记录保留。</div>
      <div class="ar-m-foot" style="margin-top:0">
        <button class="ar-btn" onclick="closeDelModal()">取 消</button>
        <button class="ar-btn primary" onclick="confirmDelete()">确 定</button>
      </div>
    </div>
  </div>

  <div class="ar-toast" id="arToast"></div>

  <script src="../scripts/common.js"></script>
  <script src="../scripts/obj-perm.js"></script>
  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // ===== 告警表达式模板（后续可持续扩展：往对应类别数组里加一行即可）=====
    // range: (min, max]；unit 为空 = 无阈值表达式
    // periodic: true = 持续状态类表达式，支持周期通知（默认每 30 分钟）；其余为单次事件类，固定仅告警一次
    // maxExcl: true = 上界开区间（如 (0, 100000)）
    var EXPRS = {
      load: [
        { id: 'l1', text: '单次载入任务的载入成功率小于 {T} %',        unit: '%', range: [1, 100],      hint: '(1, 100]' },
        { id: 'l2', text: '单次载入任务中存在数据载入失败' },
        { id: 'l3', text: '载入同名文件' },
        { id: 'l4', text: '单次载入任务文件数超过 {T} 个',            unit: '个', range: [0, 100000], hint: '(0, 100000)', maxExcl: true },
        { id: 'l5', text: '单次载入任务的文件平均载入时间大于 {T} 秒', unit: '秒', range: [1, 3600],   hint: '(1, 3600]' }
      ],
      proc: [
        { id: 'p1', text: '单文件处理时长大于 {T} 秒',                    unit: '秒', range: [1, 3600],   hint: '(1, 3600]' },
        { id: 'p2', text: '单文件分段数大于 {T} 个',                      unit: '个', range: [0, 100000], hint: '(0, 100000)', maxExcl: true },
        { id: 'p3', text: '单个作业中文件处理成功率小于 {T} %',           unit: '%', range: [1, 100],      hint: '(1, 100]' },

      var enabled = document.getElementById('arEnabled').checked;
      var cycle = (expr.periodic && !mCycle.once) ? { n: mCycle.n, unit: mCycle.unit } : null;
      if (editIdx == null) {
        RULES.unshift({ id: 'r' + (ruleSeq++), cat: mCat, exprId: mExprId, threshold: threshold, level: level, cycle: cycle, notify: picked, state: 'normal', created: nowStr(), updated: nowStr(), enabled: enabled });
        toast('告警规则已创建');
      } else {
        var r = RULES[editIdx];
        r.cat = mCat; r.exprId = mExprId; r.threshold = threshold; r.level = level; r.cycle = cycle; r.notify = picked; r.enabled = enabled; r.updated = nowStr();
        toast('告警规则已更新');
      }
      closeRuleModal();
      renderRules();
    }

    // ===== Toast =====
    var toastTimer = null;
    function toast(msg) {
      var el = document.getElementById('arToast');
      el.textContent = msg; el.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.style.display = 'none'; }, 1800);
    }

    // ===== Init =====
    renderRules();
  </script>
</body>
</html>
