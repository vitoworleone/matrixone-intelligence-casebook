<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOI - 日志</title>
  <link rel="stylesheet" href="../styles/common.css">
  <style>
    .main { padding: 0 !important; overflow: auto; }
    .al-page { padding: 20px 24px 40px; min-width: 1080px; }

    /* 页内 tab：操作日志 / 系统日志 */
    .al-tabs { display: flex; gap: 26px; border-bottom: 1px solid #ececf0; margin-bottom: 18px; }
    .al-tab { padding: 4px 2px 12px; font-size: 15px; color: rgba(0,0,0,0.55); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
    .al-tab:hover { color: rgba(0,0,0,0.85); }
    .al-tab.active { color: #1677ff; border-bottom-color: #1677ff; font-weight: 600; }
    .al-tab .sub { font-size: 11.5px; color: rgba(0,0,0,0.35); font-weight: 400; margin-left: 6px; }

    /* 工具条 */
    .al-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .al-select, .al-input { height: 33px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 13px; padding: 0 10px; outline: none; background: #fff; color: rgba(0,0,0,0.85); }
    .al-select:focus, .al-input:focus { border-color: #1677ff; }
    .al-select { cursor: pointer; }
    .al-input { width: 200px; }
    .al-lab { font-size: 12.5px; color: rgba(0,0,0,0.45); white-space: nowrap; }
    .al-btn { height: 33px; padding: 0 13px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; color: rgba(0,0,0,0.7); display: inline-flex; align-items: center; gap: 6px; }
    .al-btn:hover { border-color: #1677ff; color: #1677ff; }
    .al-btn svg { width: 14px; height: 14px; }
    .al-sw { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: rgba(0,0,0,0.6); cursor: pointer; user-select: none; height: 33px; padding: 0 11px; border: 1px solid #e5e6eb; border-radius: 8px; background: #fff; }
    .al-sw.on { border-color: #ff4d4f; color: #cf1322; background: #fff7f6; }
    .al-sw .dot { width: 7px; height: 7px; border-radius: 50%; background: #d9d9d9; }
    .al-sw.on .dot { background: #ff4d4f; }

    /* 计数行 */
    .al-listhead { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 10px; }
    .al-count { font-size: 16px; font-weight: 700; color: rgba(0,0,0,0.88); }
    .al-count-sub { font-size: 12px; color: rgba(0,0,0,0.38); }

    /* 表格 */
    .al-table-wrap { border: 1px solid #f0f0f0; border-radius: 10px; overflow-x: auto; background: #fff; }
    table.al-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    .al-table thead th { background: #fafbfc; color: rgba(0,0,0,0.5); font-weight: 500; text-align: left; padding: 10px 13px; white-space: nowrap; border-bottom: 1px solid #f0f0f0; }
    .al-table tbody td { padding: 11px 13px; border-bottom: 1px solid #f5f5f5; color: rgba(0,0,0,0.82); white-space: nowrap; vertical-align: middle; }
    .al-table tbody tr:last-child td { border-bottom: none; }
    .al-table tbody tr { cursor: pointer; transition: background 0.12s; }
    .al-table tbody tr:hover { background: #f7faff; }
    .al-time { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; color: rgba(0,0,0,0.6); }
    .al-user { display: inline-flex; align-items: center; gap: 6px; }
    .al-avatar { width: 20px; height: 20px; border-radius: 50%; background: #e6f0ff; color: #1677ff; font-size: 10.5px; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }
    .al-avatar.sys { background: #f0f0f0; color: rgba(0,0,0,0.45); }
    .al-src { font-size: 11px; color: rgba(0,0,0,0.42); background: #f4f5f8; border-radius: 4px; padding: 1px 7px; }
    .al-src.momo { background: #e9fbf6; color: #00875a; }
    .al-src.api { background: #f0f5ff; color: #2f54eb; }
    .al-src.sched { background: #f4f0ff; color: #722ed1; }
    .al-mod { font-size: 12px; color: rgba(0,0,0,0.62); }
    .al-act { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 5px; font-weight: 500; background: #f0f6ff; color: #1677ff; }
    .al-act.del { background: #fff1f0; color: #cf1322; }
    .al-act.exec { background: #f4f0ff; color: #722ed1; }
    .al-act.auth { background: #fff7e6; color: #d46b08; }
    .al-act.data { background: #e6fffb; color: #08979c; }
    .al-act.sess { background: #f5f5f5; color: rgba(0,0,0,0.55); }
    .al-hot { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 4px; background: #fff1f0; color: #cf1322; border: 1px solid #ffccc7; margin-left: 6px; vertical-align: 1px; }
    .al-obj { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
    .al-objtype { font-size: 11px; color: rgba(0,0,0,0.38); margin-right: 5px; }
    .al-objname { color: rgba(0,0,0,0.82); }
    .st-badge { display: inline-flex; align-items: center; gap: 5px; }
    .st-dot { width: 6px; height: 6px; border-radius: 50%; }
    .st-success { color: #52c41a; } .st-success .st-dot { background: #52c41a; }
    .st-failed { color: #ff4d4f; } .st-failed .st-dot { background: #ff4d4f; }
    .al-detail-link { color: #1677ff; font-size: 12.5px; cursor: pointer; }
    .al-detail-link:hover { text-decoration: underline; }
    .al-empty { text-align: center; padding: 48px 0; color: rgba(0,0,0,0.3); font-size: 13px; }

    /* 分页 */
    .al-pg { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 14px; font-size: 13px; color: rgba(0,0,0,0.6); }
    .al-pg button { min-width: 30px; height: 30px; padding: 0 8px; border: 1px solid #e5e6eb; border-radius: 6px; background: #fff; cursor: pointer; }
    .al-pg button:hover:not(:disabled) { border-color: #1677ff; color: #1677ff; }
    .al-pg button:disabled { color: rgba(0,0,0,0.2); cursor: not-allowed; }

    /* 详情抽屉 */
    .al-mask { position: fixed; inset: 0; background: rgba(15,20,40,0.35); z-index: 900; display: none; }
    .al-mask.show { display: block; }
    .al-drawer { position: fixed; top: 0; right: -620px; width: 600px; max-width: 92vw; height: 100vh; background: #fff; z-index: 901; box-shadow: -8px 0 32px rgba(0,0,0,0.14); transition: right .25s cubic-bezier(.16,1,.3,1); display: flex; flex-direction: column; }
    .al-drawer.show { right: 0; }
    .al-d-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .al-d-title { font-size: 15px; font-weight: 600; color: rgba(0,0,0,0.86); display: flex; align-items: center; gap: 8px; }
    .al-d-x { border: none; background: transparent; font-size: 21px; color: rgba(0,0,0,0.4); cursor: pointer; line-height: 1; }
    .al-d-x:hover { color: rgba(0,0,0,0.8); }
    .al-d-body { flex: 1; overflow-y: auto; padding: 18px 20px 30px; }
    .al-d-sec { font-size: 12.5px; font-weight: 600; color: rgba(0,0,0,0.5); margin: 18px 0 9px; }
    .al-d-sec:first-child { margin-top: 0; }
    .al-d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; background: #fafbfd; border: 1px solid #f0f1f5; border-radius: 10px; padding: 14px 16px; }
    .al-d-item .k { font-size: 11.5px; color: rgba(0,0,0,0.4); margin-bottom: 3px; }
    .al-d-item .v { font-size: 13px; color: rgba(0,0,0,0.85); word-break: break-all; }
    .al-d-item .v.mono { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }
    .al-d-desc { font-size: 13px; color: rgba(0,0,0,0.75); line-height: 1.8; background: #fafbfd; border: 1px solid #f0f1f5; border-radius: 10px; padding: 12px 15px; }
    .al-d-params { width: 100%; border-collapse: collapse; font-size: 12.5px; border: 1px solid #f0f1f5; border-radius: 10px; overflow: hidden; }
    .al-d-params th { background: #fafbfc; text-align: left; font-weight: 500; color: rgba(0,0,0,0.45); padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
    .al-d-params td { padding: 8px 12px; border-bottom: 1px solid #f6f6f8; color: rgba(0,0,0,0.78); vertical-align: top; }
    .al-d-params tr:last-child td { border-bottom: none; }
    .al-old { background: #fff1f0; color: #a8071a; border-radius: 4px; padding: 1px 6px; text-decoration: line-through; text-decoration-color: rgba(168,7,26,0.4); }
    .al-new { background: #f6ffed; color: #237804; border-radius: 4px; padding: 1px 6px; }
    .al-d-err { font-size: 12.5px; color: #a8071a; background: #fff1f0; border: 1px solid #ffccc7; border-radius: 10px; padding: 11px 14px; line-height: 1.7; }
    .al-d-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: #1677ff; cursor: pointer; text-decoration: none; }
    .al-d-link:hover { text-decoration: underline; }

    /* 系统日志 */
    .sl-line { display: flex; gap: 12px; align-items: flex-start; padding: 7px 14px; border-bottom: 1px solid #f6f6f8; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; line-height: 1.7; cursor: default; }
    .sl-line:hover { background: #fafbfd; }
    .sl-line.has-stack { cursor: pointer; }
    .sl-ts { color: rgba(0,0,0,0.45); white-space: nowrap; }
    .sl-lv { font-weight: 700; width: 46px; flex-shrink: 0; }
    .sl-lv.INFO { color: #1677ff; } .sl-lv.WARN { color: #d46b08; } .sl-lv.ERROR { color: #cf1322; }
    .sl-comp { color: #722ed1; white-space: nowrap; }
    .sl-msg { color: rgba(0,0,0,0.75); word-break: break-all; }
    .sl-stack { display: none; margin: 4px 0 2px 0; padding: 10px 12px; background: #2b2b33; color: #e8e8ef; border-radius: 8px; font-size: 11.5px; white-space: pre-wrap; line-height: 1.65; }
    .sl-stack.show { display: block; }
    .sl-stackrow td { padding: 0 14px 8px; border-bottom: 1px solid #f6f6f8; }
  </style>
</head>

      { ts:'2026-06-08 11:00:40', lv:'INFO',  comp:'operator-api',    msg:'operator "信息提取" published as async API service, bound compute=默认计算资源' },
      { ts:'2026-06-08 02:00:12', lv:'INFO',  comp:'compute-mgr',     msg:'compute "默认计算资源" auto-suspended after 15min idle' },

      { ts:'2026-06-03 18:00:46', lv:'WARN',  comp:'workflow-engine', msg:'workflow "NESR Silver 构建" run #1840 killed by wangfang at node 传感器清洗' },
      { ts:'2026-06-02 11:30:20', lv:'INFO',  comp:'auth-svc',        msg:'user chenjian created by zhaomin, role=业务分析师' }
    ];

    // ============ 操作日志：筛选 / 渲染 ============
    var alPage = 1, AL_PSIZE = 12, alHotOnly = false, alFiltered = [];
    function escH(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

    function alInitFilters(){
      var users={}, mods={}, acts={}, srcs={};
      AUDIT.forEach(function(r){ users[r.user]=1; mods[r.mod]=1; acts[r.act]=1; srcs[r.src]=1; });
      function fill(id, set){ var sel=document.getElementById(id); Object.keys(set).forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o); }); }
      fill('fUser',users); fill('fMod',mods); fill('fAct',acts); fill('fSrc',srcs);
    }
    function alToggleHot(){ alHotOnly=!alHotOnly; document.getElementById('fHot').classList.toggle('on',alHotOnly); alApply(); }
    function alReset(){
      document.getElementById('fTime').value='7d';
      ['fUser','fMod','fAct','fSrc','fRes'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('fKw').value=''; alHotOnly=false; document.getElementById('fHot').classList.remove('on');
      alApply();
    }
    function alTimeOk(ts){
      var v=document.getElementById('fTime').value; if(v==='all') return true;
      var now=new Date('2026-06-11 23:59:59').getTime(), t=new Date(ts.replace(/-/g,'/')).getTime();
      if(v==='today') return ts.indexOf('2026-06-11')===0;
      if(v==='7d') return now-t <= 7*864e5;
      if(v==='30d') return now-t <= 30*864e5;
      return true;
    }
    function alApply(){
      var u=document.getElementById('fUser').value, m=document.getElementById('fMod').value,
          a=document.getElementById('fAct').value, s=document.getElementById('fSrc').value,
          r=document.getElementById('fRes').value, kw=document.getElementById('fKw').value.trim().toLowerCase();
      alFiltered = AUDIT.filter(function(x){
        if(!alTimeOk(x.ts)) return false;
        if(u && x.user!==u) return false;
        if(m && x.mod!==m) return false;
        if(a && x.act!==a) return false;
        if(s && x.src!==s) return false;
        if(r && x.res!==r) return false;
        if(alHotOnly && !x.hot) return false;
        if(kw && (x.obj[1]+' '+x.obj[2]).toLowerCase().indexOf(kw)<0) return false;
        return true;
      });
      alPage=1; alRender();
    }
    function srcCls(s){ return s==='MOMO 对话'?'momo':(s==='API'?'api':(s==='系统调度'?'sched':'')); }
    function actCls(c){ return c==='del'?'del':(c==='exec'?'exec':(c==='auth'?'auth':(c==='data'?'data':(c==='sess'?'sess':'')))); }
    function alRender(){
      var body=document.getElementById('alBody'), total=alFiltered.length;
      document.getElementById('alCount').textContent = total + ' 条记录';
      var start=(alPage-1)*AL_PSIZE, rows=alFiltered.slice(start,start+AL_PSIZE), h='';
      if(!rows.length){ h='<tr><td colspan="8"><div class="al-empty">没有符合条件的操作记录</div></td></tr>'; }
      rows.forEach(function(r){
        var idx=AUDIT.indexOf(r);
        var av = r.utype==='系统' ? '<span class="al-avatar sys">⚙</span>' : '<span class="al-avatar">'+escH(r.user.charAt(0))+'</span>';
        h+='<tr onclick="alOpenDrawer('+idx+')">'
          +'<td class="al-time">'+escH(r.ts)+'</td>'
          +'<td><span class="al-user">'+av+escH(r.user)+'</span></td>'
          +'<td><span class="al-src '+srcCls(r.src)+'">'+escH(r.src)+'</span></td>'
          +'<td class="al-mod">'+escH(r.mod)+'</td>'
          +'<td><span class="al-act '+actCls(r.cat)+'">'+escH(r.act)+'</span>'+(r.hot?'<span class="al-hot">高敏</span>':'')+'</td>'
          +'<td class="al-obj"><span class="al-objtype">'+escH(r.obj[0])+'</span><span class="al-objname" title="'+escH(r.obj[2])+'">'+escH(r.obj[1])+'</span></td>'
          +'<td><span class="st-badge '+(r.res==='成功'?'st-success':'st-failed')+'"><span class="st-dot"></span>'+escH(r.res)+'</span></td>'
          +'<td><span class="al-detail-link" onclick="event.stopPropagation();alOpenDrawer('+idx+')">详情</span></td>'
          +'</tr>';
      });
      body.innerHTML=h;
      // pagination
      var pages=Math.max(1,Math.ceil(total/AL_PSIZE)), pg='';
      pg+='<span>共 '+total+' 条 · 第 '+alPage+' / '+pages+' 页</span>';
      pg+='<button '+(alPage<=1?'disabled':'')+' onclick="alPage--;alRender()">‹</button>';
      pg+='<button '+(alPage>=pages?'disabled':'')+' onclick="alPage++;alRender()">›</button>';
      document.getElementById('alPg').innerHTML=pg;
    }

    // ============ 详情抽屉 ============
    function alOpenDrawer(idx){
      var r=AUDIT[idx]; if(!r) return;
      document.getElementById('alDTitle').innerHTML = '<span class="al-act '+actCls(r.cat)+'">'+escH(r.act)+'</span>'+(r.hot?'<span class="al-hot">高敏</span>':'')+' '+escH(r.obj[1]);
      var h='';
      h+='<div class="al-d-sec">基本信息</div><div class="al-d-grid">';
      [['操作时间',r.ts],['操作人',r.user+'（'+r.role+'）'],['操作者类型',r.utype],['来源',r.src],['IP 地址',r.ip],['请求 ID',r.reqId,'mono'],
       ['模块',r.mod],['操作类型',r.act],['操作对象',r.obj[0]+' · '+r.obj[1]],['对象路径',r.obj[2]],['结果',r.res],['耗时',r.dur||'—']]
      .forEach(function(it){ h+='<div class="al-d-item"><div class="k">'+escH(it[0])+'</div><div class="v '+(it[2]||'')+'">'+escH(it[1])+'</div></div>'; });
      h+='</div>';
      h+='<div class="al-d-sec">操作说明</div><div class="al-d-desc">'+escH(r.desc)+'</div>';
      if(r.diff){
        h+='<div class="al-d-sec">变更内容</div><table class="al-d-params"><thead><tr><th style="width:30%">字段</th><th style="width:35%">变更前</th><th>变更后</th></tr></thead><tbody>';
        r.diff.forEach(function(d){ h+='<tr><td>'+escH(d[0])+'</td><td><span class="al-old">'+escH(d[1])+'</span></td><td><span class="al-new">'+escH(d[2])+'</span></td></tr>'; });
        h+='</tbody></table>';
      }
      if(r.params){
        h+='<div class="al-d-sec">操作参数</div><table class="al-d-params"><tbody>';
        r.params.forEach(function(p){ h+='<tr><td style="width:34%;color:rgba(0,0,0,0.45)">'+escH(p[0])+'</td><td>'+escH(p[1])+'</td></tr>'; });
        h+='</tbody></table>';
      }
      if(r.err){ h+='<div class="al-d-sec">失败原因</div><div class="al-d-err">'+escH(r.err)+'</div>'; }
      if(r.link){ h+='<div class="al-d-sec">关联</div><a class="al-d-link" href="'+r.link[1]+'">'+escH(r.link[0])+' ›</a>'; }
      document.getElementById('alDBody').innerHTML=h;
      document.getElementById('alMask').classList.add('show');
      document.getElementById('alDrawer').classList.add('show');
    }
    function alCloseDrawer(){
      document.getElementById('alMask').classList.remove('show');
      document.getElementById('alDrawer').classList.remove('show');
    }
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') alCloseDrawer(); });

    // ============ CSV 导出 ============
    function alExportCsv(){
      var head=['时间','操作人','角色','操作者类型','来源','IP','模块','操作','高敏','对象类型','对象名称','对象路径','结果','失败原因','请求ID'];
      var lines=[head.join(',')];
      alFiltered.forEach(function(r){
        lines.push([r.ts,r.user,r.role,r.utype,r.src,r.ip,r.mod,r.act,(r.hot?'是':'否'),r.obj[0],r.obj[1],r.obj[2],r.res,(r.err||''),r.reqId]
          .map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
      });
      var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='moi-audit-log.csv'; a.click(); URL.revokeObjectURL(a.href);
    }

    // ============ 系统日志 ============
    function slApply(){
      var lv=document.getElementById('sLv').value, kw=document.getElementById('sKw').value.trim().toLowerCase();
      var rows=SYSLOG.filter(function(x){
        if(lv && x.lv!==lv) return false;
        if(kw && (x.comp+' '+x.msg).toLowerCase().indexOf(kw)<0) return false;
        return true;
      });
      document.getElementById('slCount').textContent = rows.length + ' 条';
      var h='<table style="width:100%;border-collapse:collapse">';
      rows.forEach(function(x,i){
        var hasStack=!!x.stack;
        h+='<tr><td style="padding:0;border:none"><div class="sl-line'+(hasStack?' has-stack':'')+'" '+(hasStack?'onclick="slToggleStack(this)"':'')+'>'
          +'<span class="sl-ts">'+escH(x.ts)+'</span><span class="sl-lv '+x.lv+'">'+x.lv+'</span>'
          +'<span class="sl-comp">['+escH(x.comp)+']</span><span class="sl-msg">'+escH(x.msg)+(hasStack?'　<span style="color:#1677ff">▾ 堆栈</span>':'')+'</span>'
          +'</div></td></tr>';
        if(hasStack){ h+='<tr class="sl-stackrow"><td style="border:none"><div class="sl-stack">'+escH(x.stack)+'</div></td></tr>'; }
      });
      h+='</table>';
      if(!rows.length) h='<div class="al-empty">没有符合条件的日志</div>';
      document.getElementById('slList').innerHTML=h;
    }
    function slToggleStack(line){
      var tr=line.closest('tr'), next=tr && tr.nextElementSibling;
      var stack=next && next.querySelector('.sl-stack');
      if(stack) stack.classList.toggle('show');
    }
    function slReset(){ document.getElementById('sLv').value=''; document.getElementById('sKw').value=''; slApply(); }
    function slExport(){
      var lines=SYSLOG.map(function(x){ return x.ts+' '+x.lv+' ['+x.comp+'] '+x.msg; });
      var blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='moi-system-log.txt'; a.click(); URL.revokeObjectURL(a.href);
    }

    // ============ tab 切换 ============
    function switchAlTab(t){
      document.getElementById('tabOp').classList.toggle('active',t==='op');
      document.getElementById('tabSys').classList.toggle('active',t==='sys');
      document.getElementById('opPanel').style.display = t==='op'?'':'none';
      document.getElementById('sysPanel').style.display = t==='sys'?'':'none';
    }

    // init
    alInitFilters(); alApply(); slApply();
  </script>
