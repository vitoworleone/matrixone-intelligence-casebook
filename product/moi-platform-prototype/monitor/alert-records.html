<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOI - 告警记录</title>
  <link rel="stylesheet" href="../styles/common.css">
  <style>
    .main { padding: 0 !important; overflow: auto; }
    .ar-page { padding: 20px 24px 40px; min-width: 1080px; }
    .ar-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .ar-title { font-size: 20px; font-weight: 700; color: rgba(0,0,0,0.88); }
    .ar-sub { font-size: 12.5px; color: rgba(0,0,0,0.45); }

    .ar-banner {
      display: flex; align-items: center; gap: 8px; padding: 9px 14px; margin-bottom: 14px;
      background: #f0f7ff; border: 1px solid #d6e4ff; border-radius: 8px; font-size: 12.5px; color: rgba(0,0,0,0.65);
    }
    .ar-banner svg { width: 14px; height: 14px; color: #1677ff; flex-shrink: 0; }

    .th-filter-btn {
      display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
      border-radius: 6px; background: #f5f5f5; cursor: pointer; vertical-align: middle; margin-left: 3px;
    }
    .th-filter-btn svg { width: 11px; height: 11px; stroke: rgba(0,0,0,0.35); }
    .th-filter-btn.active { background: #e6f4ff; }
    .th-filter-btn.active svg { stroke: #1677ff; }

    .ar-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
    .ar-search { position: relative; }
    .ar-search input {
      width: 260px; height: 34px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 13px;
      padding: 0 30px 0 11px; outline: none; background: #fff; transition: border-color 0.2s;
    }
    .ar-search input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(5,145,255,0.08); }
    .ar-search .s-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; color: rgba(0,0,0,0.3); pointer-events: none; }
    .ar-daterange { display: inline-flex; align-items: center; gap: 8px; height: 34px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 0 10px; background: #fff; font-size: 13px; color: rgba(0,0,0,0.65); }
    .ar-daterange input { border: none; outline: none; font-size: 12.5px; color: rgba(0,0,0,0.8); width: 118px; background: transparent; }
    .ar-daterange .sep { color: rgba(0,0,0,0.3); }
    .ar-daterange .clr { cursor: pointer; color: rgba(0,0,0,0.25); font-size: 13px; display: none; }
    .ar-daterange .clr:hover { color: #ff4d4f; }
    .ar-toolbar .spacer { flex: 1; }

    .ar-table-wrap { border: 1px solid #f0f0f0; border-radius: 10px; overflow-x: auto; background: #fff; }
    table.ar-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; table-layout: fixed; }
    .ar-table td, .ar-table th { overflow: hidden; text-overflow: ellipsis; }
    .ar-table thead th { background: #fafbfc; color: rgba(0,0,0,0.5); font-weight: 500; text-align: left; padding: 11px 8px; white-space: nowrap; border-bottom: 1px solid #f0f0f0; }
    .ar-table th.sortable { cursor: pointer; user-select: none; }
    .ar-table th .sort-ic { margin-left: 4px; opacity: 0.4; font-size: 10px; }
    .ar-table th.sorted .sort-ic { opacity: 1; color: #1677ff; }
    .ar-table tbody td { padding: 11px 8px; border-bottom: 1px solid #f5f5f5; color: rgba(0,0,0,0.82); white-space: nowrap; vertical-align: middle; }
    .ar-table tbody tr:last-child td { border-bottom: none; }
    .ar-table tbody tr { transition: background 0.12s; }
    .ar-table tbody tr:hover { background: #f7faff; }

    .ar-expr { color: #1677ff; cursor: pointer; text-decoration: none; }
    .ar-expr:hover { text-decoration: underline; }
    .ar-thval { display: inline-block; padding: 0 6px; border-radius: 4px; background: #f5f5f5; color: rgba(0,0,0,0.82); font-size: 12px; font-variant-numeric: tabular-nums; margin: 0 2px; }
    .ar-actual { color: #cf1322; font-variant-numeric: tabular-nums; }

    .lv-badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .lv-urgent { color: #cf1322; background: rgba(255,77,79,0.10); }
    .lv-major  { color: #d46b08; background: rgba(250,140,22,0.12); }
    .lv-info   { color: #0958d9; background: rgba(22,119,255,0.08); }

    .ar-empty { text-align: center; padding: 70px 0 60px; color: rgba(0,0,0,0.3); font-size: 13px; }
    .ar-empty svg { width: 44px; height: 44px; color: rgba(0,0,0,0.15); display: block; margin: 0 auto 10px; }
    .ar-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12.5px; color: rgba(0,0,0,0.45); }
    .ar-pg { display: flex; align-items: center; gap: 6px; }
    .ar-pg-btn { min-width: 28px; height: 28px; padding: 0 6px; border: 1px solid #e5e6eb; border-radius: 6px; background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; color: rgba(0,0,0,0.6); }
    .ar-pg-btn.active { background: #1677ff; border-color: #1677ff; color: #fff; }
    .ar-pg-btn:disabled { color: rgba(0,0,0,0.2); cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="top-bar"></div>
  <div id="addWsModal"></div>

  <div class="layout">
    <div class="sidebar"><div class="menu-section"></div></div>

    <div class="main">
      <div class="ar-page">
        <div class="ar-head">
          <span class="ar-title">告警记录</span>
          <span class="ar-sub">告警规则触发后产生的历史记录</span>
        </div>

        <div class="ar-banner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          告警记录默认保留最近 1 月
        </div>

        <div class="ar-toolbar">
          <div class="ar-search">
            <input type="text" id="alSearch" placeholder="搜索告警表达式……" oninput="renderRecords()">
            <span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
          </div>
          <div class="ar-daterange">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:rgba(0,0,0,0.35)"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <input type="date" id="alStart" onchange="renderRecords()">
            <span class="sep">→</span>
            <input type="date" id="alEnd" onchange="renderRecords()">
            <span class="clr" id="alDateClr" onclick="clearDates()" title="清除时间范围">✕</span>
          </div>
          <div class="spacer"></div>
        </div>

        <div class="ar-table-wrap">
          <table class="ar-table">
            <thead>
              <tr>
                <th class="sortable" data-sort="time" onclick="toggleSort()" style="width:10%">告警时间<span class="sort-ic">▼</span></th>
                <th style="width:104px">告警类别<span class="th-filter-btn" id="catFilterBtn" onclick="event.stopPropagation();toggleColFilter('cat')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th style="width:31%">告警表达式</th>
                <th style="width:29%">触发详情</th>
                <th style="width:96px">告警级别<span class="th-filter-btn" id="levelFilterBtn" onclick="event.stopPropagation();toggleColFilter('level')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg></span></th>
                <th style="width:78px">状态</th>
                <th style="width:130px">通知对象</th>
              </tr>
            </thead>
            <tbody id="alTbody"></tbody>
          </table>
          <div class="ar-empty" id="alEmpty" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
            暂无数据
          </div>
        </div>

        <div class="ar-foot">
          <span id="alCount"></span>
          <div class="ar-pg">
            <button class="ar-pg-btn" disabled>‹</button>
            <button class="ar-pg-btn active">1</button>
            <button class="ar-pg-btn" disabled>›</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/common.js"></script>
  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    var LEVEL = { urgent: { label: '紧急', cls: 'lv-urgent' }, major: { label: '重要', cls: 'lv-major' }, info: { label: '提示', cls: 'lv-info' } };

    // 类别：load=数据加载 proc=数据处理 dashboard=数据看板（看板图表告警同源汇入,表达式跳转对应看板）
    var CAT_LABEL = { load: '数据加载', proc: '数据处理', dashboard: '数据看板' };
    // Mock：与告警规则页的规则同一份故事——表达式含阈值、触发详情给实际值；
    // 「工作区内同时等待处理的文件数」为周期通知规则（每 30 分钟一条）
    // status：持续状态型记录带 firing/resolved（含看板阈值告警）,单次事件型为 null
    var RECORDS = [
      { time: '2026-07-14 15:00:12', cat: 'proc', expr: '工作区内同时等待处理的文件数大于 <b class="ar-thval">200</b> 个', detail: '当前等待 486 个', level: 'info', notify: '邮箱', status: 'firing' },
      { time: '2026-07-14 14:30:09', cat: 'proc', expr: '工作区内同时等待处理的文件数大于 <b class="ar-thval">200</b> 个', detail: '当前等待 512 个', level: 'info', notify: '邮箱', status: 'firing' },
      { time: '2026-07-14 14:00:11', cat: 'proc', expr: '工作区内同时等待处理的文件数大于 <b class="ar-thval">200</b> 个', detail: '当前等待 355 个', level: 'info', notify: '邮箱', status: 'firing' },
      { time: '2026-07-14 10:15:33', cat: 'dashboard', expr: '看板「NESR 设备可靠性看板」· 图表「近30天每日新增工单」最新值 > <b class="ar-thval">25</b>', detail: '当前值 32（X：8/5）', level: 'urgent', notify: '—', status: 'firing' },
      { time: '2026-07-13 09:15:40', cat: 'load', expr: '单次载入任务中存在数据载入失败', detail: '任务「本地文件上传载入」失败 3 个文件', level: 'urgent', notify: '邮箱、电话', status: null },
      { time: '2026-07-12 22:40:08', cat: 'dashboard', expr: '看板「NESR 设备可靠性看板」· 图表「高优先级未关闭工单」最新值 > <b class="ar-thval">10</b>', detail: '当前值 13', level: 'urgent', notify: '—', status: 'firing' },
      { time: '2026-07-12 18:40:21', cat: 'proc', expr: '单个作业中文件处理成功率小于 <b class="ar-thval">90</b> %', detail: '实际成功率 81.8%（9/11）', level: 'major', notify: '企业微信', status: null },
      { time: '2026-07-12 11:31:56', cat: 'load', expr: '单次载入任务中存在数据载入失败', detail: '任务「本地文件上传载入」失败 3 个文件', level: 'urgent', notify: '邮箱、电话', status: null },
      { time: '2026-07-11 15:09:02', cat: 'proc', expr: '单文件处理时长大于 <b class="ar-thval">300</b> 秒', detail: '文件「安全白皮书.pdf」耗时 448 秒', level: 'info', notify: '邮箱', status: null },
      { time: '2026-07-11 07:30:15', cat: 'dashboard', expr: '看板「NESR 设备可靠性看板」· 图表「本月工单完成率」最新值 < <b class="ar-thval">85</b>', detail: '当前值 82.4', level: 'major', notify: '—', status: 'resolved' },
      { time: '2026-07-10 06:02:13', cat: 'load', expr: '单次载入任务的载入成功率小于 <b class="ar-thval">100</b> %', detail: '实际成功率 98.7%', level: 'major', notify: '邮箱、短信', status: null },
      { time: '2026-07-09 16:52:40', cat: 'dashboard', expr: '看板「NESR 设备可靠性看板」· 图表「在役设备数」最新值 < <b class="ar-thval">120</b>', detail: '当前值 119', level: 'major', notify: '—', status: 'resolved' },
      { time: '2026-07-08 16:20:45', cat: 'load', expr: '载入同名文件', detail: '文件「产品手册_v3.pdf」与已有文件同名', level: 'info', notify: '邮箱', status: null },
      { time: '2026-06-28 10:11:30', cat: 'proc', expr: '单个作业中文件处理成功率小于 <b class="ar-thval">90</b> %', detail: '实际成功率 85.7%（6/7）', level: 'major', notify: '企业微信', status: null }
    ];

    // ===== 列头筛选（类别 / 级别）=====
    var colFilters = { cat: [], level: [] };
    var COL_FILTER_DEFS = {
      cat: { btnId: 'catFilterBtn', width: 150, options: [ { val: 'load', label: '数据加载' }, { val: 'proc', label: '数据处理' }, { val: 'dashboard', label: '数据看板' } ] },
      level: { btnId: 'levelFilterBtn', width: 140, options: [ { val: 'urgent', label: '紧急' }, { val: 'major', label: '重要' }, { val: 'info', label: '提示' } ] }
    };
    function toggleColFilter(key) {
      var existing = document.getElementById('colFilterDrop');
      var wasFor = existing && existing.getAttribute('data-for');
      document.querySelectorAll('#colFilterDrop').forEach(function(d) { d.remove(); });
      if (wasFor === key) return;
      var def = COL_FILTER_DEFS[key];
      var anchor = document.getElementById(def.btnId);
      var rect = anchor.getBoundingClientRect();
      var top = rect.bottom + 4;
      var drop = document.createElement('div');
      drop.id = 'colFilterDrop';
      drop.setAttribute('data-for', key);
      drop.style.cssText = 'position:fixed;top:' + top + 'px;left:' + Math.min(rect.left, window.innerWidth - def.width - 12) + 'px;width:' + def.width + 'px;max-height:' + Math.min(360, window.innerHeight - top - 12) + 'px;background:#fff;border:1px solid #e5e6eb;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.12);z-index:9999;display:flex;flex-direction:column;overflow:hidden';
      drop.onclick = function(e) { e.stopPropagation(); };
      var html = '<div style="flex:1 1 auto;overflow-y:auto;padding:8px 4px">';
      def.options.forEach(function(o) {
        var checked = colFilters[key].length === 0 || colFilters[key].indexOf(o.val) !== -1;
        html += '<label style="display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;color:rgba(0,0,0,0.88);cursor:pointer;border-radius:4px" onmouseover="this.style.background=\'#f5f5f5\'" onmouseout="this.style.background=\'none\'"><input type="checkbox" value="' + esc(o.val) + '"' + (checked ? ' checked' : '') + ' style="accent-color:#1677ff;width:15px;height:15px;cursor:pointer">' + esc(o.label) + '</label>';
      });
      html += '</div>';
      html += '<div style="flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid #f0f0f0;background:#fafbfc">'
        + '<span style="font-size:12px;color:rgba(0,0,0,0.55);cursor:pointer" onclick="resetColFilter(\'' + key + '\')">重置</span>'
        + '<button style="padding:4px 16px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;background:#1677ff;color:#fff;border:none" onclick="applyColFilter(\'' + key + '\')">确定</button>'
        + '</div>';
      drop.innerHTML = html;
      document.body.appendChild(drop);
      setTimeout(function() {
        document.addEventListener('click', function handler(e) {
          if (!drop.contains(e.target)) { drop.remove(); document.removeEventListener('click', handler); }
        });
      }, 0);
    }
    function applyColFilter(key) {
      var checks = document.querySelectorAll('#colFilterDrop input[type="checkbox"]');
      var selected = [];
      checks.forEach(function(c) { if (c.checked) selected.push(c.value); });
      colFilters[key] = selected.length === COL_FILTER_DEFS[key].options.length ? [] : selected;
      var drop = document.getElementById('colFilterDrop');
      if (drop) drop.remove();
      updateFilterBtns();
      renderRecords();
    }
    function resetColFilter(key) {
      colFilters[key] = [];
      document.querySelectorAll('#colFilterDrop input[type="checkbox"]').forEach(function(c) { c.checked = true; });
    }
    function updateFilterBtns() {
      Object.keys(COL_FILTER_DEFS).forEach(function(key) {
        var btn = document.getElementById(COL_FILTER_DEFS[key].btnId);
        if (btn) btn.classList.toggle('active', colFilters[key].length > 0);
      });
    }

    // ===== 排序（按告警时间）=====
    var sortAsc = false;
    function toggleSort() { sortAsc = !sortAsc; renderRecords(); }

    // ===== 时间范围 =====
    function clearDates() {
      document.getElementById('alStart').value = '';
      document.getElementById('alEnd').value = '';
      renderRecords();
    }

    // ===== 列表渲染 =====
    function renderRecords() {
      var q = (document.getElementById('alSearch').value || '').trim().toLowerCase();
      var start = document.getElementById('alStart').value;
      var end = document.getElementById('alEnd').value;
      document.getElementById('alDateClr').style.display = (start || end) ? 'inline' : 'none';

      var list = RECORDS.filter(function(r) {
        if (colFilters.cat.length && colFilters.cat.indexOf(r.cat) === -1) return false;
        if (colFilters.level.length && colFilters.level.indexOf(r.level) === -1) return false;
        var day = r.time.slice(0, 10);
        if (start && day < start) return false;
        if (end && day > end) return false;
        if (q) {
          var plain = r.expr.replace(/<[^>]+>/g, '');
          if ((plain + ' ' + r.detail).toLowerCase().indexOf(q) === -1) return false;
        }
        return true;
      });
      list.sort(function(a, b) { return sortAsc ? (a.time < b.time ? -1 : 1) : (a.time > b.time ? -1 : 1); });

      var th = document.querySelector('.ar-table th.sortable');
      th.classList.add('sorted');
      th.querySelector('.sort-ic').textContent = sortAsc ? '▲' : '▼';

      var html = list.map(function(r) {
        var lv = LEVEL[r.level];
        var isDash = r.cat === 'dashboard';
        var row = '<tr>';
        row += '<td title="' + esc(r.time) + '">' + esc(r.time.slice(5, 16)) + '</td>';
        row += '<td>' + esc(CAT_LABEL[r.cat] || '—') + '</td>';
        row += '<td><a class="ar-expr" href="' + (isDash ? '../data-processing/data-dashboard.html' : 'alert-rules.html') + '" title="' + (isDash ? '查看对应数据看板' : '查看对应告警规则') + '">' + r.expr + '</a></td>';
        row += '<td title="' + esc(r.detail) + '"><span class="ar-actual">' + esc(r.detail) + '</span></td>';
        row += '<td><span class="lv-badge ' + lv.cls + '">' + lv.label + '</span></td>';
        row += '<td>' + (r.status === 'firing' ? '<span style="color:#cf1322;font-size:12px">● 告警中</span>' : r.status === 'resolved' ? '<span style="color:#389e0d;font-size:12px">● 已恢复</span>' : '<span style="color:rgba(0,0,0,0.3)">—</span>') + '</td>';
        row += '<td>' + esc(r.notify) + '</td>';
        row += '</tr>';
        return row;
      }).join('');
      document.getElementById('alTbody').innerHTML = html;
      document.getElementById('alEmpty').style.display = list.length ? 'none' : '';
      document.getElementById('alCount').textContent = '共 ' + list.length + ' 条告警记录';
    }

    // ===== Init =====
    // 从来源页跳转带入：?cat=dashboard 预选告警类别筛选（数据看板底部「全部历史」链接使用）
    (function initFromQuery() {
      var c = new URLSearchParams(location.search).get('cat');
      if (c && CAT_LABEL[c]) colFilters.cat = [c];
    })();
    renderRecords();
  </script>
</body>
</html>
