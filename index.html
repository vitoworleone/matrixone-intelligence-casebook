  <script src="scripts/common.js"></script>
  <script>
    // Mode switching
    function switchMode(mode) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.mode-btn[data-mode="' + mode + '"]').classList.add('active');
      localStorage.setItem('moi_mode', mode);
      if (mode === 'app') {
        window.location.href = 'app-dev/index.html';
        return;
      }
      // Redirect to last visited data-dev page or dashboard
      var lastPage = localStorage.getItem('moi_last_data_page');
      if (lastPage) {
        window.location.href = lastPage;
      } else {
        window.location.href = 'dashboard/dashboard.html';
      }
    }
    // Restore mode
    var savedMode = localStorage.getItem('moi_mode') || 'app';
    if (savedMode === 'app') {
      window.location.href = 'app-dev/index.html';
    } else {
      // In data mode, redirect to last page or dashboard
      var lastPage = localStorage.getItem('moi_last_data_page');
      if (lastPage) {
        window.location.href = lastPage;
      } else {
        window.location.href = 'dashboard/dashboard.html';
      }
    }
  </script>
