workflow:
  name: catalog-read-parse-chunk-index-save
  root: root

root:
  chain:
    - work_item:
        name: read_source
        id: moi:catalog.source.read.v2
        version: v2
        input:
          source_ref: "{{ .vars.source_ref }}"
        save:
          sources: .sources
          source_file_ids: .file_ids

    - work_item:
        name: parse_documents
        id: moi:parse
        input:
          sources: "{{ .state.sources }}"
          file_ids: "{{ .state.source_file_ids }}"
        save:
          parsed_documents: .documents

    - work_item:
        name: split_documents
        id: moi:parser.split.documents.length
        input:
          documents: "{{ .state.parsed_documents }}"
        save:
          chunked_documents: .documents

    - work_item:
        name: build_knowledge_index
        id: moi:knowledge.index.build
        input:
          documents: "{{ .state.chunked_documents }}"
        save:
          indexed_count: .written

    - work_item:
        name: save_result
        id: moi:catalog.sink.write
        input:
          target_ref: "{{ .vars.output_ref }}"
          documents: "{{ .state.chunked_documents }}"
        save:
          output_file_id: .file_id
