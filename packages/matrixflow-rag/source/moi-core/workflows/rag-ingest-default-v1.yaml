# RAG Ingest Default Workflow - v1
#
# Full ingest pipeline: parse → chunk → embed → vector_write
#   → write_parsed_docset → register assets → link derivations
#
# 1:1 parity with the workflow_be Haystack pipeline created via catalog API:
#   RootNode → DocumentParseNode → ChunkNode → EmbedNode → WriteNode
# Plus moi-core data lineage tracking (asset register/link) that replaces
# workflow_be's job_consumer + CRUDCatalogService post-processing.
#
# Input vars:
#   file_id:            source raw file ID
#   file_name:          source raw file name
#   volume_id:          source volume ID (used for retrieval filtering / lineage)
#   vector_table:       target vector index table name
#   embedding_model:    embedding model name (default: BAAI/bge-m3)
#   embedding_dimension: vector dimension (must match model output)
#   chunk_size:         chunk size in characters (default: 512)
#   chunk_overlap:      chunk overlap in characters (default: 64)
#   enable_multi_level_index: enable doc/section/chunk indexing (default: true)
#   index_version:      optional version number for multi-level entries
#   section_size:       chunks per section in multi-level indexing (default: 5)
#   max_doc_summary_chars: max chars for doc-level summary (default: 2000)
#   parser_options:     optional parser configuration overrides
#
# Output:
#   parsed_file_id:     ID of the written JSONL parsed docset file
#   vector_count:       number of vectors written to the index

workflow:
  name: fin-rag-ingest-default-v1
  root: root

root:
  chain:
    # ── Core Pipeline (1:1 with workflow_be Haystack pipeline) ──────────

    # 1. Parse: convert raw file to structured documents
    #    workflow_be: RootNode (FileTypeRouter) → DocumentParseNode (converters)
    #    moi-core rich converter handles MIME routing + conversion internally.
    #    Supports plain text, HTML, PDF, DOCX, PPTX, Excel, CSV via backend parsers.
    - work_item:
        name: parse
        id: moi:parser.convert.document.rich
        input:
          sources: "{{ .data.sources }}"
          execution_context: "{{ .data.execution_context }}"
          options:
            workflow_parser: true
            image_process_type: [ocr, caption]

    # 2. Chunk: split documents into overlapping chunks
    #    workflow_be: ChunkNode → EnhancedDocumentSplitter
    #    Supports level-based splitting (heading boundaries) matching
    #    workflow_be's enable_level_based_split=true default.
    - work_item:
        name: chunk
        id: moi:parser.split.documents.length
        input:
          documents: "{{ .data.documents }}"
          chunk_size: "{{ .vars.chunk_size // 512 }}"
          overlap: "{{ .vars.chunk_overlap // 64 }}"
          enable_level_based_split: "{{ .vars.enable_level_based_split // true }}"

    # 2.5. Multi-level indexing: expand chunks into doc/section/chunk entries
    #    Adds metadata: level/doc_id/section_id/index_version for retrieval stages.
    - work_item:
        name: multilevel_index
        id: moi:retrieval.index.multilevel
        input:
          documents: "{{ .data.documents }}"
          enable: "{{ .vars.enable_multi_level_index // true }}"
          index_version: "{{ .vars.index_version // 0 }}"
          section_size: "{{ .vars.section_size // 5 }}"
          max_doc_summary_chars: "{{ .vars.max_doc_summary_chars // 2000 }}"

    # 3. Embed: generate embeddings for all chunks
    #    workflow_be: EmbedNode → OpenAIDocumentEmbedder
    - work_item:
        name: embedding_generate
        id: moi:embedding.generate
        input:
          documents: "{{ .data.documents }}"
          model: '{{ .vars.embedding_model // "BAAI/bge-m3" }}'
        save:
          # 只保存 content + metadata，剥离 embedding 向量（~2MB）以避免 state 膨胀。
          # embedding 已写入向量表（step 4），JSONL 血缘文件不需要向量数据。
          embedded_documents: "[.documents[] | select(.metadata.level == null or .metadata.level == \"\" or .metadata.level == \"chunk\") | del(.embedding)]"

    # 4. Write vectors: upsert embedded chunks into the vector index table
    #    workflow_be: WriteNode → DocumentWriter + MOIDocumentStore
    - work_item:
        name: vector_write
        id: moi:data.retrieval.vector.write
        input:
          documents: "{{ .data.documents }}"
          file_id: "{{ .vars.file_id }}"
          volume_id: "{{ .vars.volume_id // \"\" }}"
          table_name: "{{ .vars.vector_table }}"
          embedding_model: '{{ .vars.embedding_model // "BAAI/bge-m3" }}'
          embedding_dimension: "{{ .vars.embedding_dimension // 1024 }}"

    # ── Data Lineage (replaces workflow_be job_consumer post-processing) ─

    # 5. Write parsed docset: persist chunks as JSONL file in workspace storage
    #    workflow_be: no direct equivalent (chunks stored in embedding_results table)
    #    Uses state.embedded_documents (from step 3) since vector_write consumes documents.
    - work_item:
        name: write_parsed_docset
        id: moi:files.write_documents
        input:
          documents: "{{ .state.embedded_documents }}"
          file_name: "{{ .vars.file_name }}.parsed.jsonl"
        save:
          parsed_file_id: ".file_id"

    # 7. Register raw asset: create DataAsset for the original raw file.
    #    workflow_be: CRUDCatalogService.create_file in job_consumer (ref_file_id = raw file id)
    #    Output: asset_id (saved to state for link steps)
    - work_item:
        name: register_raw_asset
        id: moi:data.asset.register
        input:
          asset_type: file
          asset_ref: "{{ .vars.file_id }}"
          volume_id: "{{ .vars.volume_id // 0 }}"
          name: "{{ .vars.file_name }}"
          source: rag_ingest
        save:
          raw_asset_id: ".asset_id"

    # 8. Register parsed asset: create DataAsset for the parsed JSONL docset.
    #    Uses state.parsed_file_id (from step 6) instead of .data.file_id.
    - work_item:
        name: register_parsed_asset
        id: moi:data.asset.register
        input:
          asset_type: file
          asset_ref: "{{ .state.parsed_file_id }}"
          volume_id: "{{ .vars.volume_id // 0 }}"
          name: "{{ .vars.file_name }}.parsed.jsonl"
          source: rag_ingest
        save:
          parsed_asset_id: ".asset_id"

    # 9. Link parsed → raw: record derivation relationship.
    #    Uses state.raw_asset_id (from step 7) and state.parsed_file_id (from step 6).
    #    kind = "parsed_from" mirrors workflow_be's ref_file_id lineage.
    - work_item:
        name: link_parsed_from_raw
        id: moi:data.asset.link
        input:
          root_asset_id: "{{ .state.raw_asset_id }}"
          source_asset_id: "{{ .state.raw_asset_id }}"
          target_asset_id: "{{ .state.parsed_asset_id }}"
          kind: parsed_from

    # 10. Register vector asset: create DataAsset keyed on the vector index table.
    - work_item:
        name: register_vector_asset
        id: moi:data.asset.register
        input:
          asset_type: vector_index
          asset_ref: "{{ .vars.vector_table }}"
          name: "{{ .vars.vector_table }}"
          source: rag_ingest
        save:
          vector_asset_id: ".asset_id"

    # 11. Link vector → parsed: record indexing derivation relationship.
    #     Uses state.vector_asset_id (from step 10) and state.parsed_file_id (from step 6).
    - work_item:
        name: link_indexed_from_parsed
        id: moi:data.asset.link
        input:
          root_asset_id: "{{ .state.raw_asset_id }}"
          source_asset_id: "{{ .state.parsed_asset_id }}"
          target_asset_id: "{{ .state.vector_asset_id }}"
          kind: indexed_from
