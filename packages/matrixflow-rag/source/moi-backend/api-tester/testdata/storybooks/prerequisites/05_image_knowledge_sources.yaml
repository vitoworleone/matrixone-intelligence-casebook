schema_version: "1"
id: image_knowledge_manual_sources
title: 图片解析与知识库人工 S3 数据及模型前置
profile: nightly
requires: [s3_read, connector, model_discovery]
steps:
  - id: inspect_source
    adapter: s3
    action: inspect_prefix
    with:
      prefix: 图片解析/
    expect:
      minimum_objects: 1
      minimum_size_bytes: 1

  - id: create_connector
    adapter: connector
    action: create_s3
    with:
      name_prefix: sb_image_kb_s3
    expect:
      statuses: [active]

  - id: verify_connector_object
    adapter: connector
    action: assert_object_visible
    with:
      connector_id:
        $ref: steps.create_connector.connector_id
      uri:
        $ref: steps.inspect_source.objects.0.connector_uri
    expect:
      minimum_size: 1

  - id: require_models
    adapter: model
    action: require_models
    with:
      requirements:
        - id: vlm_ocr
          model: qwen-vl-plus
          kind: ocr
          system_default: true
        - id: text_embedding
          model: bge-m3
          kind: embedding
          system_default: true
        - id: image_index
          model: efficientnet-b3
          kind: embedding_multimodal
          backend_name: Genesis Embedding
          system_default: true
