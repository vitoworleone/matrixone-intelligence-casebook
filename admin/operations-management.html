  <style>
    .btn-secondary { background: #fff; color: rgba(0,0,0,0.65); border: 1px solid #d9d9d9; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .btn-secondary:hover { border-color: #722ed1; color: #722ed1; }
    .btn-primary { background: #722ed1; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .btn-primary:hover { background: #9254de; }

    .op-filters { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .op-filters select, .op-filters input { height: 32px; padding: 0 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 12.5px; background: #fff; outline: none; }
    .op-filters input { width: 240px; }

    .op-st { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 4px; }
    .op-st.doing { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
    .op-st.replied { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
    .op-st.done { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .op-cat { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 4px; background: #f5f5f5; color: rgba(0,0,0,0.55); }
    .op-valid { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; background: #f0e6ff; color: #722ed1; border: 1px solid #d3adf7; font-weight: 600; }

    .op-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; display: none; align-items: center; justify-content: center; }
    .op-modal-overlay.show { display: flex; }
    .op-modal { background: #fff; border-radius: 12px; width: 640px; max-height: 84vh; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,0.16); }
    .op-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px 12px; border-bottom: 1px solid #f0f0f0; }
    .op-modal-head h3 { margin: 0; font-size: 16px; font-weight: 700; color: rgba(0,0,0,0.85); }
    .op-modal-close { border: none; background: none; font-size: 15px; color: rgba(0,0,0,0.4); cursor: pointer; }
    .op-modal-body { padding: 16px 22px; overflow-y: auto; }
    .op-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; margin-bottom: 14px; }
    .op-gi .l { font-size: 11.5px; color: rgba(0,0,0,0.45); margin-bottom: 3px; }
    .op-gi .v { font-size: 13px; color: rgba(0,0,0,0.85); }
    .op-chat { background: #fafbfc; border: 1px solid #f0f0f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .op-chat .ttl { font-size: 12px; font-weight: 600; color: rgba(0,0,0,0.55); margin-bottom: 8px; }
    .op-chat .ln { font-size: 12.5px; line-height: 1.8; color: rgba(0,0,0,0.75); }
    .op-chat .ln b { color: rgba(0,0,0,0.55); font-weight: 600; }
    .op-reply-box { width: 100%; min-height: 72px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; resize: vertical; font-family: inherit; box-sizing: border-box; }
    .op-reply-box:focus { border-color: #722ed1; }
    .op-modal-foot { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-top: 1px solid #f0f0f0; }
    .op-hint { font-size: 12px; color: rgba(0,0,0,0.45); }

    .ms-toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: #fff; padding: 9px 18px; border-radius: 8px; font-size: 13px; z-index: 3000; display: none; }

      { id: 'FB-20260826-012', title: '工作流定时任务在 02:00 未按时触发', cat: '缺陷', module: '数据 · 工作流', user: '李静（华东精工制造）', st: 'replied', stLabel: '已回复', time: '2026-08-26 09:40', valid: true, reply: '已确认为有效反馈（100 Credit 已发放）。问题定位为调度时区配置缺陷，修复将随下一次发布上线；期间可将触发时间避开整点。',
        chat: ['用户：定时工作流凌晨两点没跑', '助手：请确认工作流名称与时区设置？', '用户：合同解析流，UTC+8', '助手：已生成工单（分类 缺陷 / 模块 工作流 / 优先级 高）'] },
      { id: 'FB-20260822-007', title: '希望知识库支持按文件夹批量更新', cat: '需求', module: '资源中心 · 知识库', user: '陈老师（星河教育科技）', st: 'doing', stLabel: '处理中', time: '2026-08-22 15:03', valid: false, reply: '',
        chat: ['用户：知识库想按文件夹整体更新，不想一个个传', '助手：请描述期望的操作方式？', '用户：选中卷里的文件夹，一键同步到知识库', '助手：已生成工单（分类 需求 / 模块 知识库 / 优先级 中）'] },
      { id: 'FB-20260815-003', title: 'CSV 导入含中文表头时列名乱码', cat: '缺陷', module: '数据 · 数据载入', user: '周毅（远航物流）', st: 'done', stLabel: '已解决', time: '2026-08-15 11:18', valid: true, reply: '编码探测缺陷已修复并上线，感谢反馈。',
        chat: ['用户：CSV 中文表头导入后变成乱码', '助手：请提供文件编码与样例？', '用户：GBK 编码，样例已上传', '助手：已生成工单（分类 缺陷 / 模块 数据载入 / 优先级 高）'] },
      { id: 'FB-20260812-001', title: '如何把 MySQL 表定时同步到 MOI', cat: '咨询', module: '数据 · 数据载入', user: '吴晓（远航物流）', st: 'done', stLabel: '已解决', time: '2026-08-12 14:30', valid: false, reply: '已回复使用指引：创建 MySQL 连接器后按「从零同步 + 周期增量」配置载入任务即可。',
        chat: ['用户：MySQL 的表怎么定时同步进来？', '助手：您要一次性搬还是持续同步？', '用户：每天同步一次', '助手：已生成工单（分类 咨询 / 模块 数据载入）'] }
    ];

    function opRender() {
      var q = (document.getElementById('opSearch').value || '').trim().toLowerCase();
      var cat = document.getElementById('opCat').value;
      var st = document.getElementById('opSt').value;
      var vd = document.getElementById('opValid').value;
      var rows = OP_FB.filter(function(f) {
        if (cat !== 'all' && f.cat !== cat) return false;
        if (st !== 'all' && f.st !== st) return false;
        if (vd !== 'all' && String(f.valid ? 1 : 0) !== vd) return false;
        if (q && (f.id + f.title + f.user).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      document.getElementById('opBody').innerHTML = rows.length === 0
        ? '<tr><td colspan="8" style="text-align:center;color:rgba(0,0,0,0.35);padding:36px 0">没有符合条件的反馈</td></tr>'
        : rows.map(function(f) {
          return '<tr>'
            + '<td style="font-family:monospace;font-size:12px">' + f.id + '</td>'
            + '<td style="font-size:13px">' + f.title + '<div style="font-size:11px;color:rgba(0,0,0,0.4);margin-top:2px">' + f.time + '</div></td>'
            + '<td><span class="op-cat">' + f.cat + '</span></td>'
            + '<td style="font-size:12.5px">' + f.module + '</td>'
            + '<td style="font-size:12.5px">' + f.user + '</td>'
            + '<td><span class="op-st ' + f.st + '">' + f.stLabel + '</span></td>'
            + '<td>' + (f.valid ? '<span class="op-valid">✓ 有效</span>' : '<span style="color:rgba(0,0,0,0.3);font-size:12px">—</span>') + '</td>'
            + '<td><button class="btn-primary" style="padding:4px 14px;font-size:12px" onclick="opOpen(\'' + f.id + '\')">处理</button></td>'
            + '</tr>';
        }).join('');
    }

    function opFind(id) { return OP_FB.filter(function(x) { return x.id === id; })[0]; }

    function opOpen(id) {
      var f = opFind(id); if (!f) return;
      document.getElementById('opModalTitle').textContent = '处理反馈 · ' + f.id;
      document.getElementById('opModalBody').innerHTML =
        '<div class="op-grid">'
        + '<div class="op-gi"><div class="l">分类</div><div class="v">' + f.cat + '</div></div>'
        + '<div class="op-gi"><div class="l">模块</div><div class="v">' + f.module + '</div></div>'
        + '<div class="op-gi"><div class="l">状态</div><div class="v"><span class="op-st ' + f.st + '">' + f.stLabel + '</span></div></div>'
        + '<div class="op-gi"><div class="l">用户（账户）</div><div class="v">' + f.user + '</div></div>'
        + '<div class="op-gi"><div class="l">提交时间</div><div class="v">' + f.time + '</div></div>'
        + '<div class="op-gi"><div class="l">有效反馈</div><div class="v">' + (f.valid ? '<span class="op-valid">✓ 已确认（已发放 100 cr）</span>' : '未确认') + '</div></div>'
        + '</div>'
        + '<div class="op-chat"><div class="ttl">对话记录（反馈助手收集）</div>' + f.chat.map(function(l) {
            var i = l.indexOf('：');
            return '<div class="ln"><b>' + l.slice(0, i) + '：</b>' + l.slice(i + 1) + '</div>';
          }).join('') + '</div>'
        + '<div style="font-size:12px;font-weight:600;color:rgba(0,0,0,0.55);margin-bottom:6px">官方回复</div>'
        + '<textarea class="op-reply-box" id="opReply" placeholder="填写回复内容，保存后用户在前台「反馈历史」中可见">' + (f.reply || '') + '</textarea>';
      document.getElementById('opModalFoot').innerHTML = f.valid
        ? '<span class="op-hint">已确认有效反馈 · 100 Credit 已发放</span>'
          + '<span style="flex:1"></span>'
          + '<button class="btn-primary" style="padding:7px 16px;font-size:13px" onclick="opReplyOnly(\'' + f.id + '\')">保存回复</button>'
        : '<span class="op-hint">回复保存后用户在前台「反馈历史」中可见</span>'
          + '<span style="flex:1"></span>'
          + '<button class="btn-secondary" style="padding:7px 16px;font-size:13px" onclick="opReplyOnly(\'' + f.id + '\')">无效反馈，仅回复</button>'
          + '<button class="btn-primary" style="padding:7px 16px;font-size:13px" onclick="opReplyReward(\'' + f.id + '\')">有效反馈，回复并奖励</button>';
      document.getElementById('opModal').classList.add('show');
    }
    function opClose() { document.getElementById('opModal').classList.remove('show'); }
    function opReplyOnly(id) {
      var f = opFind(id); if (!f) return;
      f.reply = document.getElementById('opReply').value.trim();
      if (f.st === 'doing' && f.reply) { f.st = 'replied'; f.stLabel = '已回复'; }
      opRender(); opClose();
      msToast('回复已保存，用户前台可见');
    }
    function opReplyReward(id) {
      var f = opFind(id); if (!f || f.valid) return;
      if (!confirm('确认「' + f.id + '」为有效反馈？\n\n确认后将向用户 ' + f.user + ' 发放 100 Credit 反馈奖励，入账计费中心收支明细（渠道：反馈奖励），此操作不可撤销。')) return;
      f.valid = true;
      f.reply = document.getElementById('opReply').value.trim();
      if (f.st === 'doing') { f.st = 'replied'; f.stLabel = '已回复'; }
      opRender(); opClose();
      msToast('已确认有效反馈，100 Credit 已发放并计入收支明细');
    }

    var msToastTimer = null;
    function msToast(msg) {
      var t = document.getElementById('msToast');
      t.textContent = msg; t.style.display = 'block';
      clearTimeout(msToastTimer);
      msToastTimer = setTimeout(function() { t.style.display = 'none'; }, 2600);
    }

      { time: '2026-08-26 10:18', user: '陈老师（星河教育科技）', type: 'checkin', typeLabel: '每日签到', detail: '本轮第 9 次', amt: 100, st: 'ok' },
      { time: '2026-08-25 08:40', user: '周毅（远航物流）', type: 'checkin', typeLabel: '每日签到', detail: '本轮第 15 次（含里程碑额外 +1000）', amt: 1100, st: 'ok' },

    function rwRender() {
      var q = (document.getElementById('rwSearch').value || '').trim().toLowerCase();
      var tp = document.getElementById('rwType').value;
      var st = document.getElementById('rwSt').value;
      var rows = OP_RW.filter(function(r) {
        if (tp !== 'all' && r.type !== tp) return false;
        if (st !== 'all' && r.st !== st) return false;
        if (q && (r.user + r.detail).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      document.getElementById('rwBody').innerHTML = rows.length === 0
        ? '<tr><td colspan="6" style="text-align:center;color:rgba(0,0,0,0.35);padding:36px 0">没有符合条件的记录</td></tr>'
        : rows.map(function(r) {
          return '<tr>'
            + '<td style="font-size:12px;color:rgba(0,0,0,0.55)">' + r.time + '</td>'
            + '<td style="font-size:12.5px">' + r.user + '</td>'
            + '<td><span class="op-cat">' + r.typeLabel + '</span></td>'
            + '<td style="font-size:12.5px">' + r.detail + '</td>'
            + '<td style="text-align:right;font-weight:600;color:' + (r.st === 'ok' ? '#722ed1' : 'rgba(0,0,0,0.35)') + '">' + (r.st === 'ok' ? '+' + r.amt : '待发放 +' + r.amt) + '</td>'
            + '<td>' + (r.st === 'ok' ? '<span class="op-st done">已发放</span>' : '<span class="op-st replied">待激活</span>') + '</td>'
            + '</tr>';
        }).join('');
    }

    // ===== Panel 切换(hash 路由:feedback / rewards) =====
    function showOpPanel(hash) {
      var h = hash === 'rewards' ? 'rewards' : 'feedback';
      document.getElementById('opPanel-feedback').style.display = h === 'feedback' ? '' : 'none';
      document.getElementById('opPanel-rewards').style.display = h === 'rewards' ? '' : 'none';
      if (h === 'rewards') rwRender();
    }
    window.addEventListener('hashchange', function() { showOpPanel(location.hash.replace('#', '')); });

    opRender();
    showOpPanel(location.hash.replace('#', ''));
  </script>
</body>
</html>
